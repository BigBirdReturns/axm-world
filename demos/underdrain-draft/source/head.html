<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>UNDERDRAIN: The Bloom Below</title>
<style>
:root{
  --ink:#f5f0df;--muted:#b9b39e;--paper:#151815;--panel:#20241f;--panel2:#2a2e28;
  --brass:#e1b65a;--mint:#86e6b4;--spore:#b7ef72;--rust:#d9764a;--danger:#ff6e6e;
  --line:rgba(245,240,223,.14);--shadow:0 20px 70px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 20% 0%,rgba(134,230,180,.08),transparent 32rem),
  radial-gradient(circle at 90% 20%,rgba(225,182,90,.08),transparent 28rem),
  #0d100e;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
body{display:flex;justify-content:center}
.shell{width:min(1240px,100%);min-height:100vh;padding:18px}
.topbar{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border:1px solid var(--line);
  background:rgba(21,24,21,.92);backdrop-filter:blur(12px);border-radius:18px;padding:14px 16px;position:sticky;top:8px;z-index:20;box-shadow:var(--shadow)}
.brand{display:flex;gap:12px;align-items:center}
.emblem{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(225,182,90,.6);
 background:conic-gradient(from 180deg,rgba(134,230,180,.25),rgba(225,182,90,.18),rgba(217,118,74,.22),rgba(134,230,180,.25));
 font-size:24px}
.eyebrow,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
.eyebrow{font-size:11px;color:var(--mint)}
h1{font-size:clamp(20px,3vw,34px);margin:1px 0 0;line-height:1}
.nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.nav button,.pill,.secondary,.primary{border:1px solid var(--line);border-radius:999px;background:#171b17;color:var(--ink);padding:9px 13px}
.nav button[aria-current="page"]{border-color:var(--mint);box-shadow:0 0 0 2px rgba(134,230,180,.12) inset}
.primary{background:linear-gradient(135deg,var(--mint),#4fb983);color:#07100a;border:0;font-weight:800;padding:12px 18px}
.secondary{background:#20251f}
main{padding:18px 0 70px}
.view{display:none}.view.active{display:block}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(35,40,34,.96),rgba(21,24,21,.96));
 border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.card h2,.card h3{margin-top:0}
.bigline{font-size:clamp(28px,5.8vw,74px);line-height:.92;letter-spacing:-.05em;margin:8px 0 18px;max-width:12ch}
.lead{font-size:18px;line-height:1.55;color:#ded7c3;max-width:68ch}
.signal{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.pill{font-size:12px;padding:7px 10px;background:#131613;color:var(--muted)}
.pill.good{color:var(--mint);border-color:rgba(134,230,180,.35)}
.pill.warn{color:var(--brass);border-color:rgba(225,182,90,.35)}
.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.brief-grid div{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.12)}
.brief-grid strong{display:block;margin-bottom:4px}
.strategy-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.strategy{border:1px solid var(--line);border-radius:16px;padding:16px;background:#171a17;text-align:left;color:var(--ink);min-height:148px}
.strategy:hover,.strategy:focus-visible{border-color:var(--mint);outline:none;transform:translateY(-1px)}
.strategy.selected{border-color:var(--brass);box-shadow:0 0 0 2px rgba(225,182,90,.13) inset}
.strategy b{display:block;font-size:16px;margin:5px 0}
.strategy small{color:var(--muted);line-height:1.4}
.cast{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px}
.cast article{border:1px solid var(--line);border-radius:16px;padding:14px;background:#171a17}
.avatar{font-size:30px;margin-bottom:8px}
.method{color:var(--mint);font-size:12px;margin-top:8px}
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;align-items:stretch}
.beat{position:relative;border:1px solid var(--line);border-radius:15px;padding:13px;background:#171a17;min-height:150px}
.beat:not(:last-child):after{content:"→";position:absolute;right:-10px;top:50%;color:var(--brass);z-index:2}
.beat .n{font-family:ui-monospace,monospace;color:var(--brass);font-size:11px}
.beat h3{font-size:15px;margin:6px 0}
.beat p{font-size:12px;color:var(--muted);line-height:1.4}
.physics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.physics .card{box-shadow:none}
.action-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
.stage{position:relative;border:1px solid var(--line);background:#070b08;border-radius:20px;overflow:hidden;min-height:540px;box-shadow:var(--shadow)}
canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;background:#09100c}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hudbox{background:rgba(7,11,8,.82);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;backdrop-filter:blur(8px)}
.meter{width:160px;height:8px;background:#2c2f2a;border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--danger),var(--mint))}
.sidepanel{display:flex;flex-direction:column;gap:12px}
.log{height:250px;overflow:auto;font-size:13px;line-height:1.45}
.log p{padding:9px;margin:0;border-bottom:1px solid var(--line)}
.log .radio{color:var(--brass)}
.objectives li.done{text-decoration:line-through;color:var(--muted)}
.controls{font-size:12px;color:var(--muted);line-height:1.6}
.touch{display:none;position:absolute;inset:auto 10px 10px;justify-content:space-between;pointer-events:none}
.touch-group{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px;pointer-events:auto}
.touch button{border:1px solid rgba(245,240,223,.25);background:rgba(7,11,8,.76);color:var(--ink);border-radius:14px;font-size:20px;touch-action:none}
.touch .up{grid-column:2}.touch .left{grid-column:1}.touch .down{grid-column:2}.touch .right{grid-column:3}
.touch-actions{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.touch-actions button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(245,240,223,.25);background:rgba(7,11,8,.78);color:var(--ink);font-weight:800;touch-action:none}
.receipt-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px}
pre{white-space:pre-wrap;word-break:break-word;background:#0c100d;border:1px solid var(--line);border-radius:14px;padding:14px;color:#d9ecd9;max-height:520px;overflow:auto;font-size:12px}
.outcome{font-size:44px;margin:0 0 10px}
.consequence{font-size:18px;line-height:1.55;color:#e8dfc8}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}
.kpi div{border:1px solid var(--line);border-radius:12px;padding:10px;background:#171a17}
.kpi strong{display:block;font-size:22px}
.footer-note{color:var(--muted);font-size:12px;margin-top:14px}
#autotest-results{min-height:160px}
@media(max-width:920px){
  .hero,.action-layout,.receipt-grid{grid-template-columns:1fr}
  .cast{grid-template-columns:repeat(2,1fr)}
  .rail{grid-template-columns:1fr}
  .beat:not(:last-child):after{content:"↓";right:50%;top:auto;bottom:-14px}
  .strategy-grid{grid-template-columns:1fr}
  .touch{display:flex}
  .stage{min-height:420px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
</style>
</head>
<body>
