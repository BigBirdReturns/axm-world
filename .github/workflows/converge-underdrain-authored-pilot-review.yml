name: Converge UNDERDRAIN authored pilot on review

on:
  pull_request:
    branches:
      - demo/underdrain-authored-pilot-v2
    paths:
      - '.github/workflows/converge-underdrain-authored-pilot-review.yml'
      - '.github/workflows/converge-underdrain-authored-pilot-v2.yml'
      - 'scripts/demos/converge-underdrain-authored-pilot-v2.sh'

permissions:
  contents: write

concurrency:
  group: converge-underdrain-authored-pilot-review
  cancel-in-progress: true

env:
  ARC_UNDERDRAIN_SHA: 395bc539165cc525678ba7eb83434c8cd674437b
  SENTINEL_WORLD_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualify/underdrain-authored-pilot-v2
          path: axm-world
          fetch-depth: 0
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-arc
          ref: ${{ env.ARC_UNDERDRAIN_SHA }}
          path: axm-arc
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            axm-world/package-lock.json
            axm-arc/package-lock.json

      - name: Install exact dependencies
        run: |
          npm --prefix axm-world ci --no-audit --no-fund
          npm --prefix axm-arc ci --no-audit --no-fund

      - name: Generate, qualify, and publish the carrier-free candidate
        run: bash axm-world/scripts/demos/converge-underdrain-authored-pilot-v2.sh
