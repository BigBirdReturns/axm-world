name: UNDERDRAIN materializer Unity import closure v2

on:
  push:
    branches:
      - repair/underdrain-materializer-unity-import-closure-v2
    paths:
      - '.github/workflows/underdrain-materializer-unity-import-closure-v2.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feature/underdrain-unity6000-player-train-v1
    paths:
      - '.github/workflows/underdrain-materializer-unity-import-closure-v2.yml'

permissions:
  contents: write

concurrency:
  group: underdrain-materializer-unity-import-closure-v2
  cancel-in-progress: true

env:
  TARGET_BRANCH: repair/underdrain-materializer-unity-import-closure-v2
  EXPECTED_PARENT: e092ec17acdeeb8afb3a35194b3c7fc4871f4e37
  CARRIER: .github/workflows/underdrain-materializer-unity-import-closure-v2.yml
  PARENT_RUNNER: .github/workflows/underdrain-materializer-unity-import-closure-runner.yml
  PATCH_SHA256: 763dfb3d5026a8efcbaa6c12e08432cc257abe5b9c99ea049f74a2263e935fb7
  PATCH_GZIP_SHA256: 7dc1064a1c5d68e6750932bf42f334460251eec36049f1fa898066a89c5d7ebf
  PATCH_GZIP_BASE64: 

jobs:
  repair:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'repair/underdrain-materializer-unity-import-closure-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact repair carrier
        uses: actions/checkout@v4
        with:
          ref: repair/underdrain-materializer-unity-import-closure-v2
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Admit and apply the exact repaired payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$CARRIER"
          git diff --check "$EXPECTED_PARENT" HEAD
          python - <<'PYCODE'
          import base64, gzip, hashlib, os
          from pathlib import Path
          compressed = base64.b64decode(os.environ['PATCH_GZIP_BASE64'], validate=True)
          if hashlib.sha256(compressed).hexdigest() != os.environ['PATCH_GZIP_SHA256']:
              raise SystemExit('repair-payload-gzip-digest-mismatch')
          source = gzip.decompress(compressed)
          if hashlib.sha256(source).hexdigest() != os.environ['PATCH_SHA256']:
              raise SystemExit('repair-payload-source-digest-mismatch')
          path = Path(os.environ['RUNNER_TEMP']) / 'underdrain-materializer-unity-import-closure-v2.py'
          path.write_bytes(source)
          compile(source, str(path), 'exec')
          exec(compile(source, str(path), 'exec'))
          PYCODE
          git diff --check

      - name: Prove the Unity import and exact-custody witnesses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          batch = Path('unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs').read_text()
          runner = Path('scripts/materialize-underdrain-production-representation.ps1').read_text()
          stubs = Path('unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs').read_text()
          billboard = Path('unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs').read_text()
          witnesses = {
              'two explicit custom sprite alignments': batch.count('spriteAlignment = (int)SpriteAlignment.Custom') == 2,
              'two separate facing pivots': batch.count('var facing = Child(root.transform, "Facing")') == 2,
              'four nested visual curves': batch.count('clip.SetCurve("Facing/Visual"') == 4,
              'no old visual curves': 'clip.SetCurve("Visual"' not in batch,
              'role scale retained on facing': batch.count('facing.localScale = Vector3.one * source.source.displayScale') == 2 and 'visual.localScale = Vector3.one * source.source.displayScale' not in batch,
              'billboard facing fallback': 'transform.Find("Facing") ?? transform.Find("Visual") ?? transform' in billboard,
              'sprite alignment stub': 'enum SpriteAlignment { Custom = 9 }' in stubs and 'public int spriteAlignment;' in stubs,
              'machine lock': 'MACHINE_LOCK.json' in runner,
              'exact World and Arc commit resolver': 'function Resolve-CleanGitCommit' in runner and 'ExpectedWorldCommit' in runner and 'ExpectedArcCommit' in runner,
              'custody before Unity': runner.index('Resolve-CleanGitCommit') < runner.index('Get-Process Unity'),
              'Unity closed before package mutation': runner.index('Get-Process Unity') < runner.index('robocopy.exe'),
              'World and Arc receipt': 'worldCommit = $worldCommit' in runner and 'arcCommit = $arcCommit' in runner,
          }
          missing = [name for name, present in witnesses.items() if not present]
          if missing:
              raise SystemExit('repair-witness-failure:' + ','.join(missing))
          PYCODE

      - name: Qualify the repaired source estate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- \
            tests/world/underdrain-representation-materializer.test.ts \
            tests/world/underdrain-powershell-contract.test.ts \
            tests/world/underdrain-machine-preflight.test.ts \
            tests/world/underdrain-player-product-acceptance.test.ts \
            tests/world/underdrain-unity6000-player-train.test.ts
          dotnet build unity/Conformance/Axm.Rodoh.Action.UnderdrainRepresentation.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.Cues.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.Conformance.csproj --configuration Release
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          find unity/Conformance -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          git diff --check

      - name: Publish only the six repaired source files and retire temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$CARRIER"
          if test -e "$PARENT_RUNNER"; then git rm -- "$PARENT_RUNNER"; fi
          git add -- \
            docs/UNDERDRAIN_REPRESENTATION_MATERIALIZATION.md \
            scripts/materialize-underdrain-production-representation.ps1 \
            tests/world/underdrain-representation-materializer.test.ts \
            unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs \
            unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs
          cat > "$RUNNER_TEMP/expected-paths" <<'PATHS'
          .github/workflows/underdrain-materializer-unity-import-closure-runner.yml
          .github/workflows/underdrain-materializer-unity-import-closure-v2.yml
          docs/UNDERDRAIN_REPRESENTATION_MATERIALIZATION.md
          scripts/materialize-underdrain-production-representation.ps1
          tests/world/underdrain-representation-materializer.test.ts
          unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs
          unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs
          PATHS
          sed -i 's/^          //' "$RUNNER_TEMP/expected-paths"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/expected-paths"
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/observed-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/observed-paths"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Bind UNDERDRAIN materialization to exact machine custody'
          git push origin HEAD:"$TARGET_BRANCH"
