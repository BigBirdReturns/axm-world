name: PR313 regenerate exact asset inventory

on:
  push:
    branches:
      - content/ilyon-crown-tides

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ilyon-crown-tides
          fetch-depth: 0
      - name: Regenerate exact inventory
        run: |
          node scripts/assets/build-release-asset-inventory.mjs \
            --root . \
            --rollups src/assets/rollups/rodoh-v1-programs.json \
            --descriptions src/assets/descriptions/rodoh-v1-dense-assets.json \
            --output docs/release/RODOH_ASSET_INVENTORY.json
          git diff --check
      - name: Commit inventory and remove one-shot workflow
        run: |
          rm .github/workflows/_pr313-regenerate-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/RODOH_ASSET_INVENTORY.json .github/workflows/_pr313-regenerate-inventory.yml
          if git diff --cached --quiet; then
            echo "No inventory delta"
            exit 0
          fi
          git commit -m "Regenerate exact asset inventory"
          git push origin HEAD:content/ilyon-crown-tides
