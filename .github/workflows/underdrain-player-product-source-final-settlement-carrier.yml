name: UNDERDRAIN player-product source final settlement carrier

on:
  push:
    branches:
      - feature/underdrain-unity6000-player-train-v1
    paths:
      - '.github/workflows/underdrain-player-product-source-final-settlement-carrier.yml'

permissions:
  contents: write

concurrency:
  group: underdrain-player-product-source-final-settlement-carrier
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/underdrain-unity6000-player-train-v1
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Admit only the settlement carrier above the merged source head
        shell: bash
        env:
          REVIEWED_SOURCE_SHA: 24cc07f345a9756d10454ceeb922c8067d5d7074
          CARRIER: .github/workflows/underdrain-player-product-source-final-settlement-carrier.yml
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REVIEWED_SOURCE_SHA" HEAD
          test "$(git diff --name-only "$REVIEWED_SOURCE_SHA" HEAD)" = "$CARRIER"
          git diff --check "$REVIEWED_SOURCE_SHA" HEAD

      - name: Qualify the complete player-product source estate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check scripts/extract-underdrain-shine-assets.mjs
          node --check scripts/resolve-underdrain-shine-representation.mjs
          npm run typecheck
          npm test -- \
            tests/world/underdrain-representation-materializer.test.ts \
            tests/world/underdrain-machine-preflight.test.ts \
            tests/world/underdrain-powershell-contract.test.ts \
            tests/world/underdrain-player-product-acceptance.test.ts \
            tests/world/underdrain-unity6000-player-train.test.ts \
            tests/world/action-natural-player.test.ts \
            tests/world/action-semantic-cue-receiver.test.ts \
            tests/world/action-unity-source-contract.test.ts
          dotnet build unity/Conformance/Axm.Rodoh.Action.UnderdrainRepresentation.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.Cues.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.Conformance.csproj --configuration Release
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          find unity/Conformance -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish the carrier-free qualified parent head
        shell: bash
        env:
          CARRIER: .github/workflows/underdrain-player-product-source-final-settlement-carrier.yml
        run: |
          set -euo pipefail
          git rm -- "$CARRIER"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Settle the qualified UNDERDRAIN player-product source estate'
          git push origin HEAD:feature/underdrain-unity6000-player-train-v1
