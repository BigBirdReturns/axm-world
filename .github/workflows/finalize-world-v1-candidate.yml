name: Finalize exact World 1.0.0 candidate

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-world-v1-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_SHA: eaab92dda4122b62d2c0435f674583f0e77ceb57
  ARC_RELEASE_SHA: 7b576898f7a82409669a97187bcd836296a77e24
  ARC_PRODUCT_AUTHORITY: 4b07539a06d40b131591f1e9c7d5b90a96ceec31
  CI: 'true'
  SOURCE_DATE_EPOCH: '0'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Determine whether finalization is required
        id: state
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            0.0.1) echo 'required=true' >> "$GITHUB_OUTPUT" ;;
            1.0.0) echo 'required=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected World package version: $version" >&2; exit 1 ;;
          esac
      - name: Derive the six non-workflow release files
        if: steps.state.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(sha256sum .github/workflows/local-estate-replication.yml | cut -d' ' -f1)" = '7566dec3e4dad20994e98a603fc741a088ca0b40ff07eac17dfe60133cdafdb7'
          npm version 1.0.0 --no-git-tag-version
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          arc_release = '7b576898f7a82409669a97187bcd836296a77e24'
          arc_product = '4b07539a06d40b131591f1e9c7d5b90a96ceec31'

          lock_path = Path('estate/estate.lock.json')
          lock = json.loads(lock_path.read_text())
          arc = lock['repositories']['arc']
          world = lock['repositories']['world']
          if arc.get('requiredAncestor') != arc_product or arc.get('productAuthorityCommit') != arc_product:
              raise SystemExit('Arc product authority moved unexpectedly')
          arc['requiredCommit'] = arc_release
          arc['packageVersion'] = '1.0.0'
          world['packageVersion'] = '1.0.0'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          local_test_path = Path('tests/world/local-estate-contract.test.ts')
          local_test = local_test_path.read_text()
          local_test, count = re.subn(
              r'requiredCommit:\s*"[0-9a-f]{40}"',
              f'requiredCommit: "{arc_release}"',
              local_test,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one local Arc requiredCommit assertion, found {count}')
          local_test = local_test.replace(
              'expect(json<{ version: string }>("package.json").version).toBe("0.0.1");',
              'expect(json<{ version: string }>("package.json").version).toBe("1.0.0");',
          )
          if 'toBe("0.0.1")' in local_test:
              raise SystemExit('stale World package assertion remains in local-estate contract')
          local_test_path.write_text(local_test)

          browser_test_path = Path('tests/world/browser-support-performance.test.ts')
          browser_test = browser_test_path.read_text()
          browser_test = browser_test.replace(
              '      "World package version is 0.0.1, not 1.0.0.",\n      "Arc package version is 0.0.1, not 1.0.0.",\n',
              '',
          )
          browser_test = browser_test.replace(
              '      packageVersion: "0.0.1",\n      arcPackageVersion: "0.0.1",',
              '      packageVersion: "1.0.0",\n      arcPackageVersion: "1.0.0",',
          )
          browser_test, count = re.subn(
              r'releaseEvidenceCommit:\s*"[0-9a-f]{40}"',
              f'releaseEvidenceCommit: "{arc_release}"',
              browser_test,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one releaseEvidenceCommit assertion, found {count}')
          if 'package version is 0.0.1' in browser_test or 'PackageVersion: "0.0.1"' in browser_test:
              raise SystemExit('stale version blocker remains in status contract')
          browser_test_path.write_text(browser_test)

          doc_path = Path('docs/SUPPLY_CHAIN_CUSTODY.md')
          doc, count = re.subn(
              r'Arc release-evidence head `[0-9a-f]{40}`',
              f'Arc release-evidence head `{arc_release}`',
              doc_path.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one Arc release-evidence statement, found {count}')
          doc_path.write_text(doc)
          PY
          cat > "$RUNNER_TEMP/QUALIFIED_SHA256SUMS" <<'SUMS'
          7566dec3e4dad20994e98a603fc741a088ca0b40ff07eac17dfe60133cdafdb7  .github/workflows/local-estate-replication.yml
          53477259101b68e1fa47763e1f9e5ff15a8530dadbc60debf6fd984cacbd5c64  docs/SUPPLY_CHAIN_CUSTODY.md
          9438bf62cde4f3974883944177e2a972fe28c3796b19f16f9832f9be89de8a9a  estate/estate.lock.json
          84ab2533a92c5f877277054035add84c5afbb633f5026f801554e6d5e248ef7f  package-lock.json
          fac953f2cc80a7d5a6ab5d9e459f4df343bc691339e02f42154cbd00a755f13b  package.json
          290605daffb1c8646ed68e53e3736933701f35d9a0363696598b99ca605bfb6b  tests/world/browser-support-performance.test.ts
          aac16248c6868c4a44adb4265ae45ac4bce6746cdadb48070efd1ac623e94551  tests/world/local-estate-contract.test.ts
          SUMS
          sha256sum --check "$RUNNER_TEMP/QUALIFIED_SHA256SUMS"
          git diff --check
      - run: npm ci --no-audit --no-fund
        if: steps.state.outputs.required == 'true'
      - name: Qualify the exact coordinated release tree
        if: steps.state.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assets/build-release-asset-inventory.mjs \
            --root "$PWD" \
            --rollups src/assets/rollups/rodoh-v1-programs.json \
            --descriptions src/assets/descriptions/rodoh-v1-dense-assets.json \
            --output docs/release/RODOH_ASSET_INVENTORY.json \
            --check
          npm run typecheck
          npm test -- \
            tests/world/local-estate-contract.test.ts \
            tests/world/browser-support-performance.test.ts \
            tests/world/supply-chain.test.ts \
            tests/world/asset-release-custody.test.ts \
            tests/world/holder-estate.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          sha256sum --check "$RUNNER_TEMP/QUALIFIED_SHA256SUMS"
          git diff --check
      - name: Publish only the six non-workflow files
        if: steps.state.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin release/world-v1-candidate
          test "$(git rev-parse origin/release/world-v1-candidate)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            package-lock.json \
            estate/estate.lock.json \
            tests/world/local-estate-contract.test.ts \
            tests/world/browser-support-performance.test.ts \
            docs/SUPPLY_CHAIN_CUSTODY.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m 'Prepare the exact untagged RODOH 1.0.0 candidate'
          git push origin HEAD:release/world-v1-candidate
      - name: Confirm already-finalized tree
        if: steps.state.outputs.required == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = '1.0.0'
          test "$(sha256sum .github/workflows/local-estate-replication.yml | cut -d' ' -f1)" = '7566dec3e4dad20994e98a603fc741a088ca0b40ff07eac17dfe60133cdafdb7'
      - name: Preserve qualification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/world-v1-finalization"
          cp "$RUNNER_TEMP/QUALIFIED_SHA256SUMS" "$RUNNER_TEMP/world-v1-finalization/" 2>/dev/null || true
          git rev-parse HEAD > "$RUNNER_TEMP/world-v1-finalization/checkout-head.txt"
          git status --porcelain > "$RUNNER_TEMP/world-v1-finalization/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-v1-candidate-finalization
          path: ${{ runner.temp }}/world-v1-finalization
          if-no-files-found: warn
          retention-days: 14
