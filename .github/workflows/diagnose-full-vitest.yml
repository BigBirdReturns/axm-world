name: Diagnose full Vitest

on:
  push:
    branches: [release/supply-chain-attestation]
    paths:
      - '.github/workflows/diagnose-full-vitest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-full-vitest-supply-chain
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run complete Vitest with durable diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee full-vitest.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > full-vitest.exit-code.txt
          exit "$code"
      - name: Upload complete Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-full-vitest-diagnostics
          path: |
            full-vitest.log
            full-vitest.exit-code.txt
          if-no-files-found: error
          retention-days: 7
