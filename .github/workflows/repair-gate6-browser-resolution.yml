name: Repair Gate 6 browser resolution

on:
  pull_request:
    paths:
      - '.github/workflows/repair-gate6-browser-resolution.yml'
  push:
    branches: [release/local-estate-replication]
    paths:
      - '.github/workflows/repair-gate6-browser-resolution.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-gate6-browser-resolution
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPAIR_BASE_SHA: 118bf7b8fc666c4d753547b0e9ce752877f6e817
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore the exact reviewed verifier and patch only executable resolution
        run: |
          set -euo pipefail
          git show 12b0aeb3c6f955070c979e97d13f3bcdd8de6e30:scripts/verify-relief-circuit-gate6.mjs > /tmp/reviewed-verifier.mjs
          python - <<'PY'
          from pathlib import Path
          reviewed = Path('/tmp/reviewed-verifier.mjs').read_text()
          old = 'const CHROMIUM = process.env.PW_CHROMIUM_PATH ?? "/usr/bin/chromium";'
          replacement = '\n'.join([
              '// Permanent CI may pin an explicit executable. Local-estate runs bind',
              '// PLAYWRIGHT_BROWSERS_PATH to their holder-owned cache, so ask Playwright for',
              '// the exact installed browser rather than falling through to a Linux-only path.',
              'const CHROMIUM = process.env.PW_CHROMIUM_PATH ?? chromium.executablePath();',
          ])
          if reviewed.count(old) != 1:
              raise SystemExit(f'Expected one Chromium fallback, found {reviewed.count(old)}')
          expected = reviewed.replace(old, replacement)
          Path('scripts/verify-relief-circuit-gate6.mjs').write_text(expected)
          actual = Path('scripts/verify-relief-circuit-gate6.mjs').read_text()
          if actual != expected:
              raise SystemExit('Repaired verifier does not match the byte-exact expected content')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'scripts/verify-relief-circuit-gate6.mjs'
      - run: npm ci --no-audit --no-fund
      - name: Qualify the repaired boundary
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/gate6-review-regressions.test.ts
      - name: Publish a workflow-neutral permanent repair
        run: |
          set -euo pipefail
          cp scripts/verify-relief-circuit-gate6.mjs /tmp/verify-relief-circuit-gate6.mjs
          git fetch --no-tags origin release/local-estate-replication
          base="$(git rev-parse origin/release/local-estate-replication)"
          test "$base" = "$REPAIR_BASE_SHA"
          git read-tree "$base^{tree}"
          cp /tmp/verify-relief-circuit-gate6.mjs scripts/verify-relief-circuit-gate6.mjs
          git add scripts/verify-relief-circuit-gate6.mjs
          git diff --cached --check
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Resolve holder-cached Chromium in the Gate 6 verifier' | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$tree" -p "$base")"
          git push origin "$commit":release/local-estate-replication
