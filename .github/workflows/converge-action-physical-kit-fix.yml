name: Converge action physical acceptance kit fix

on:
  push:
    branches:
      - qualify/action-runtime-physical-acceptance-kit-v1
    paths:
      - '.github/workflows/converge-action-physical-kit-fix.yml'

permissions:
  contents: write

concurrency:
  group: converge-action-physical-kit-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualify/action-runtime-physical-acceptance-kit-v1
          fetch-depth: 0
          show-progress: false
      - name: Repair the demonstrated PowerShell parse boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/action-physical-acceptance/Invoke-RodohActionPhysicalAcceptance.ps1')
          source = path.read_text(encoding='utf-8')
          old = 'if (Test-Path ([string]$planValue.journalPath) { throw "Embodied journal already exists; completion is single-use." }'
          new = 'if (Test-Path ([string]$planValue.journalPath)) { throw "Embodied journal already exists; completion is single-use." }'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one demonstrated parse defect, found {source.count(old)}.')
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- tools/action-physical-acceptance/Invoke-RodohActionPhysicalAcceptance.ps1
      - name: Publish the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/action-physical-acceptance/Invoke-RodohActionPhysicalAcceptance.ps1
          git commit -m 'Fix physical acceptance kit PowerShell parse boundary'
          git push origin HEAD:qualify/action-runtime-physical-acceptance-kit-v1
