name: Converge UNDERDRAIN continuous authored pilot

on:
  push:
    branches:
      - qualify/underdrain-authored-pilot-v2
    paths:
      - '.github/workflows/converge-underdrain-authored-pilot-v2.yml'

permissions:
  contents: write

concurrency:
  group: converge-underdrain-authored-pilot-v2
  cancel-in-progress: true

env:
  ARC_UNDERDRAIN_SHA: 395bc539165cc525678ba7eb83434c8cd674437b
  SENTINEL_WORLD_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out World candidate
        uses: actions/checkout@v4
        with:
          ref: qualify/underdrain-authored-pilot-v2
          path: axm-world
          fetch-depth: 0
          show-progress: false

      - name: Check out exact Arc authority
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-arc
          ref: ${{ env.ARC_UNDERDRAIN_SHA }}
          path: axm-arc
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            axm-world/package-lock.json
            axm-arc/package-lock.json

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix axm-world ci --no-audit --no-fund
          npm --prefix axm-arc ci --no-audit --no-fund

      - name: Generate the exact authoring source and Arc browser capsule
        shell: bash
        run: |
          set -euo pipefail
          cp axm-arc/examples/underdrain-draft/authoring.json axm-world/demos/underdrain-draft/authoring.json
          authoring_sha="$(sha256sum axm-world/demos/underdrain-draft/authoring.json | cut -d' ' -f1)"
          export AUTHORING_SHA="$authoring_sha"

          python - <<'PY'
          import os
          from pathlib import Path

          arc_sha = os.environ['ARC_UNDERDRAIN_SHA']
          authoring_sha = os.environ['AUTHORING_SHA']
          entry = f'''import {{ cartridgeDigest }} from "../src/engine/cartridge-digest.js";
          import {{ compileActionEncounter }} from "../src/engine/action/compile.js";
          import {{ actionSeed, buildActionReceipt, verifyActionReceipt }} from "../src/engine/action/receipt.js";
          import {{ compressActionInputs, initialActionState, stepActionSimulation }} from "../src/engine/action/simulation.js";
          import {{
            UNDERDRAIN_DRAFT_ARC,
            UNDERDRAIN_SERVICE_CHALLENGE,
            UNDERDRAIN_CHALLENGE,
            UNDERDRAIN_ROOT_GATE_CHALLENGE,
            initialUnderdrainCampaignState,
            applyUnderdrainStateEffects,
            acceptUnderdrainRootGateChoice,
          }} from "../src/demos/underdrain/index.js";

          const challenges = new Map([
            [UNDERDRAIN_SERVICE_CHALLENGE.id, UNDERDRAIN_SERVICE_CHALLENGE],
            [UNDERDRAIN_CHALLENGE.id, UNDERDRAIN_CHALLENGE],
            [UNDERDRAIN_ROOT_GATE_CHALLENGE.id, UNDERDRAIN_ROOT_GATE_CHALLENGE],
          ]);
          function challenge(id: string) {{
            const value = challenges.get(id);
            if (!value) throw new Error(`Unknown UNDERDRAIN challenge ${{id}}.`);
            return value;
          }}
          function getSpec(challengeId: string, difficultyModeId: string | null = null) {{
            return compileActionEncounter(UNDERDRAIN_DRAFT_ARC, challenge(challengeId), difficultyModeId);
          }}
          function acceptAction(params: {{
            challengeId: string;
            difficultyModeId?: string | null;
            cycle: number;
            orgSeed: number;
            controlledAgentId: string;
            partyAgentIds: string[];
            frames: Array<{{ moveX?: number; moveY?: number; aimX?: number; aimY?: number; buttons?: number }}>;
          }}) {{
            const difficultyModeId = params.difficultyModeId ?? null;
            const authoredChallenge = challenge(params.challengeId);
            const trace = compressActionInputs(params.frames);
            const receipt = buildActionReceipt({{
              arc: UNDERDRAIN_DRAFT_ARC,
              challenge: authoredChallenge,
              difficultyModeId,
              cycle: params.cycle,
              orgSeed: params.orgSeed,
              controlledAgentId: params.controlledAgentId,
              partyAgentIds: params.partyAgentIds,
              trace,
            }});
            const verified = verifyActionReceipt({{
              arc: UNDERDRAIN_DRAFT_ARC,
              challenge: authoredChallenge,
              difficultyModeId,
              cycle: params.cycle,
              orgSeed: params.orgSeed,
              partyAgentIds: params.partyAgentIds,
              receipt,
            }});
            const outcome = authoredChallenge.outcomes[verified.receipt.result.outcome];
            return {{
              receipt: verified.receipt,
              terminalState: verified.terminalState,
              narrative: outcome.narrative,
              stateEffects: structuredClone(outcome.stateEffects ?? []),
            }};
          }}
          const capsule = {{
            authorityCommit: "{arc_sha}",
            get worldSourceCommit() {{ return (globalThis as any).__UNDERDRAIN_WORLD_COMMIT__; }},
            cartridgeDigest: cartridgeDigest(UNDERDRAIN_DRAFT_ARC),
            authoringSha256: "{authoring_sha}",
            initialCampaignState: () => initialUnderdrainCampaignState(UNDERDRAIN_DRAFT_ARC),
            applyStateEffects: (before: Record<string, unknown>, effects: readonly any[]) =>
              applyUnderdrainStateEffects(before as any, effects as any, UNDERDRAIN_DRAFT_ARC),
            challengeOutcome: (challengeId: string, outcome: "success" | "partial" | "failure") =>
              structuredClone(challenge(challengeId).outcomes[outcome]),
            getSpec,
            seedFor: actionSeed,
            initial: initialActionState,
            step: stepActionSimulation,
            acceptAction,
            acceptRootGateChoice: (choiceId: any, campaignBefore: Record<string, unknown>) =>
              acceptUnderdrainRootGateChoice({{ choiceId, campaignBefore: campaignBefore as any, arc: UNDERDRAIN_DRAFT_ARC }}),
          }};
          (globalThis as any).UnderdrainArc = Object.freeze(capsule);
          '''
          Path('axm-arc/tools/underdrain-capsule-entry.ts').write_text(entry, encoding='utf-8', newline='\n')
          Path('axm-arc/tools/vite.underdrain-capsule.config.mjs').write_text('''import { defineConfig } from "vite";
          import { resolve } from "node:path";
          export default defineConfig({
            build: {
              target: "es2022",
              minify: false,
              sourcemap: false,
              emptyOutDir: false,
              outDir: resolve(process.cwd(), "../axm-world/demos/underdrain-draft/source"),
              lib: {
                entry: resolve(process.cwd(), "tools/underdrain-capsule-entry.ts"),
                formats: ["iife"],
                name: "UnderdrainArcCapsule",
                fileName: () => "arc-capsule.js",
              },
            },
          });
          ''', encoding='utf-8', newline='\n')
          PY

          (
            cd axm-arc
            npx vite build --config tools/vite.underdrain-capsule.config.mjs
          )
          rm axm-arc/tools/underdrain-capsule-entry.ts axm-arc/tools/vite.underdrain-capsule.config.mjs
          test -s axm-world/demos/underdrain-draft/source/arc-capsule.js
          ! grep -Eq 'placeholder[[:space:]]*:[[:space:]]*(true|!0)' axm-world/demos/underdrain-draft/source/arc-capsule.js
          grep -F "$ARC_UNDERDRAIN_SHA" axm-world/demos/underdrain-draft/source/arc-capsule.js >/dev/null
          grep -F "$authoring_sha" axm-world/demos/underdrain-draft/source/arc-capsule.js >/dev/null

      - name: Build the deterministic sentinel and capture the real browser sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p axm-world/local/underdrain-draft
          authoring_sha="$(sha256sum axm-world/demos/underdrain-draft/authoring.json | cut -d' ' -f1)"
          node axm-world/scripts/demos/build-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --output axm-world/local/underdrain-draft/index.html \
            --world-commit "$SENTINEL_WORLD_SHA" \
            > "$RUNNER_TEMP/underdrain-sentinel-build.json"

          SENTINEL_HTML=axm-world/local/underdrain-draft/index.html \
          EXPECTED_PATH=axm-world/demos/underdrain-draft/expected-build.json \
          ARC_SHA="$ARC_UNDERDRAIN_SHA" \
          AUTHORING_SHA="$authoring_sha" \
          WORLD_SHA="$SENTINEL_WORLD_SHA" \
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const bytes = readFileSync(process.env.SENTINEL_HTML);
          const record = {
            format: 'rodoh-underdrain-expected-build/2',
            worldCommit: process.env.WORLD_SHA,
            arcCommit: process.env.ARC_SHA,
            authoringSha256: process.env.AUTHORING_SHA,
            htmlBytes: bytes.length,
            htmlSha256: createHash('sha256').update(bytes).digest('hex'),
          };
          writeFileSync(process.env.EXPECTED_PATH, JSON.stringify(record, null, 2) + '\n');
          NODE

          cd axm-world
          npx playwright install --with-deps chromium >/tmp/underdrain-browser-install.log 2>&1
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/underdrain-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          const external = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('request', request => {
            const url = new URL(request.url());
            if (!['127.0.0.1', 'localhost'].includes(url.hostname) && url.protocol !== 'data:') external.push(request.url());
          });
          await page.goto('http://127.0.0.1:4173/local/underdrain-draft/index.html?autotest=1');
          await page.waitForFunction(() => document.body.dataset.testStatus === 'pass', null, { timeout: 45000 });
          const result = await page.evaluate(() => window.__UNDERDRAIN_TEST_RESULT__);
          if (errors.length) throw new Error(`browser errors: ${JSON.stringify(errors)}`);
          if (external.length) throw new Error(`external requests: ${JSON.stringify(external)}`);
          if (result?.format !== 'rodoh-underdrain-automated-pilot-qualification/2' || result?.status !== 'pass') {
            throw new Error(`unexpected machine sweep: ${JSON.stringify(result)}`);
          }
          writeFileSync('demos/underdrain-draft/playtest.json', JSON.stringify(result, null, 2) + '\n');
          await browser.close();
          NODE
          kill "$server_pid"
          trap - EXIT
          cd ..

      - name: Qualify generated source before publication
        shell: bash
        run: |
          set -euo pipefail
          authoring_sha="$(sha256sum axm-world/demos/underdrain-draft/authoring.json | cut -d' ' -f1)"
          cmp axm-arc/examples/underdrain-draft/authoring.json axm-world/demos/underdrain-draft/authoring.json
          npm --prefix axm-arc run typecheck
          npm --prefix axm-arc test -- \
            tests/demos/underdrain-draft.test.ts \
            tests/demos/underdrain-root-gate.test.ts \
            tests/action/semantic-objectives.test.ts \
            tests/experience/authored-experience.test.ts
          npm --prefix axm-world run typecheck
          npm --prefix axm-world test -- \
            tests/world/underdrain-draft-standalone.test.ts \
            tests/world/action-semantic-objective-contract.test.ts \
            tests/world/one-am-player.test.ts \
            tests/world/one-am-structural-evidence.test.ts
          node axm-world/scripts/demos/verify-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --html axm-world/local/underdrain-draft/index.html \
            --world-commit "$SENTINEL_WORLD_SHA" \
            --arc-commit "$ARC_UNDERDRAIN_SHA" \
            --authoring-sha256 "$authoring_sha" \
            --output "$RUNNER_TEMP/underdrain-static-verification.json"
          git -C axm-world diff --check
          git -C axm-arc diff --check
          test -z "$(git -C axm-arc status --porcelain)"

      - name: Publish one carrier-free authored-pilot source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf axm-world/local/underdrain-draft axm-world/test-results
          git -C axm-world config user.name 'github-actions[bot]'
          git -C axm-world config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C axm-world rm .github/workflows/converge-underdrain-authored-pilot-v2.yml
          git -C axm-world add \
            demos/underdrain-draft/authoring.json \
            demos/underdrain-draft/source/arc-capsule.js \
            demos/underdrain-draft/expected-build.json \
            demos/underdrain-draft/playtest.json
          git -C axm-world diff --cached --check
          git -C axm-world commit -m 'Complete the continuous Underdrain authored pilot source'
          git -C axm-world push origin HEAD:qualify/underdrain-authored-pilot-v2
