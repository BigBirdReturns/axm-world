name: Finalize holder-estate hardening

on:
  pull_request:
    paths:
      - '.github/workflows/apply-holder-estate-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-holder-estate-hardening
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      PW_BASE_URL: http://127.0.0.1:5173
      HOLDER_BASE_SHA: e643e0eee01eb31854add53cb1b2377e9e06952d
    steps:
      - name: Check out exact holder-estate qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize reviewed hardening patch
        run: |
          set -euo pipefail
          mkdir -p holder-hardening-diagnostics
          cat .github/holder-hardening/patch-*.b64 | tr -d '\r\n' | base64 --decode > holder-hardening-diagnostics/holder-hardening.patch
          sha256sum holder-hardening-diagnostics/holder-hardening.patch | tee holder-hardening-diagnostics/SHA256SUMS
          wc -c holder-hardening-diagnostics/holder-hardening.patch | tee holder-hardening-diagnostics/bytes.txt

      - name: Preserve carrier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holder-hardening-carrier-diagnostics
          path: holder-hardening-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Verify and apply hardening patch
        run: |
          set -euo pipefail
          printf '%s  %s\n' '06cc4de449af16c4e62a71c9edfff9139d2968a87b54c05138cc30df10786f9a' 'holder-hardening-diagnostics/holder-hardening.patch' | sha256sum --check -
          git apply --check \
            --exclude=.github/workflows/apply-holder-estate-ui.yml \
            --exclude=.github/workflows/holder-estate.yml \
            holder-hardening-diagnostics/holder-hardening.patch
          git apply \
            --exclude=.github/workflows/apply-holder-estate-ui.yml \
            --exclude=.github/workflows/holder-estate.yml \
            holder-hardening-diagnostics/holder-hardening.patch
          rm -rf .github/holder-hardening holder-hardening-diagnostics
          git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Bounded input, transaction, rollback, and localization contracts
        run: npm test -- tests/world/holder-estate.test.ts tests/world/locale.test.ts

      - name: Complete World regression suite
        run: npm test

      - name: Production build and clean source tree
        run: |
          set -euo pipefail
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile whole-holder journey
        run: |
          set -euo pipefail
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npx playwright test e2e/holder-estate.spec.ts

      - name: Construct and push workflow-neutral permanent commit
        run: |
          set -euo pipefail
          rm -rf test-results holder-estate-receipt holder-hardening-diagnostics
          git fetch --no-tags origin release/holder-estate-v1
          base="$(git rev-parse origin/release/holder-estate-v1)"
          test "$base" = "$HOLDER_BASE_SHA"
          git read-tree "$base^{tree}"
          git add \
            docs/HOLDER_ESTATE_V1.md \
            src/world/Player.tsx \
            src/world/components/HolderEstatePanel.tsx \
            src/world/holder-estate.ts \
            src/world/i18n/messages.ts \
            tests/world/holder-estate.test.ts
          git add -A .github/holder-hardening
          git diff --cached --check
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Harden whole-holder estate transactions and input custody' | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$tree" -p "$base")"
          git push origin "$commit":release/holder-estate-v1
