name: Finalize World semantic action objectives v2

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-world-semantic-objectives-v2.yml'
  push:
    branches:
      - feature/action-semantic-objectives-v1
    paths:
      - '.github/workflows/finalize-world-semantic-objectives-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-world-semantic-action-objectives-v2
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply the reviewed receiver transformation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semantic-finalizer"
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/transform.log"
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-world-semantic-objectives.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end]
          ) + '\n'

          old_helper = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new)
          '''
          new_helper = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new)
              if count > 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              parts = []
              for line in old.splitlines():
                  if line.strip():
                      parts.append(r'[ \\t]*' + re.escape(line.lstrip()))
                  else:
                      parts.append(r'[ \\t]*')
              pattern = r'\\r?\\n'.join(parts)
              if old.endswith('\\n'):
                  pattern += r'\\r?\\n'
              updated, fallback_count = re.subn(pattern, lambda _match: new, text, count=1, flags=re.MULTILINE)
              if fallback_count != 1:
                  raise SystemExit(f'{label}: exact and whitespace-tolerant anchors were absent')
              return updated
          '''
          if script.count(old_helper) != 1:
              raise SystemExit(f'replace_once helper: expected one definition, found {script.count(old_helper)}')
          script = script.replace(old_helper, new_helper)
          exec(compile(script, '<world-semantic-objective-transform>', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
          mkdir -p "$RUNNER_TEMP/semantic-finalizer/source/Core" "$RUNNER_TEMP/semantic-finalizer/source/Unity"
          cp unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionContract.cs "$RUNNER_TEMP/semantic-finalizer/source/Core/"
          cp unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs "$RUNNER_TEMP/semantic-finalizer/source/Core/"
          cp unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionTrace.cs "$RUNNER_TEMP/semantic-finalizer/source/Core/"
          cp unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputRouter.cs "$RUNNER_TEMP/semantic-finalizer/source/Unity/"
          git diff -- \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionContract.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionTrace.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputRouter.cs \
            > "$RUNNER_TEMP/semantic-finalizer/source.diff"

      - run: npm ci --no-audit --no-fund

      - name: Compile every dependency-free receiver
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dotnet build unity/Conformance/Axm.Rodoh.Action.Conformance.csproj --configuration Release 2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/conformance-build.log"
          dotnet build unity/Conformance/Axm.Rodoh.Action.ArcParity.csproj --configuration Release 2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/arc-parity-build.log"
          dotnet build unity/Conformance/Axm.Rodoh.Action.SemanticParity.csproj --configuration Release 2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/semantic-parity-build.log"

      - name: Qualify focused and complete World contracts
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/typecheck.log"
          npm test -- \
            tests/world/action-semantic-objective-contract.test.ts \
            tests/world/action-unity-source-contract.test.ts \
            2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/focused-tests.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/complete-tests.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/semantic-finalizer/world-build.log"
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check

      - name: Upload exact transformed source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-semantic-objective-finalizer-v2
          path: ${{ runner.temp }}/semantic-finalizer
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Publish only permanent runtime-1.1 receiver changes
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin feature/action-semantic-objectives-v1
          test "$(git rev-parse origin/feature/action-semantic-objectives-v1)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionContract.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionTrace.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputRouter.cs
          git rm \
            .github/workflows/finalize-world-semantic-objectives.yml \
            .github/workflows/finalize-world-semantic-objectives-v2.yml
          git diff --cached --check
          git commit -m 'Mirror semantic action objectives in World and Unity'
          git push origin HEAD:feature/action-semantic-objectives-v1
