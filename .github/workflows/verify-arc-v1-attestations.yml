name: Verify Arc 1.0.0 repository-owned attestations

on:
  pull_request:
    paths:
      - '.github/workflows/verify-arc-v1-attestations.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARC_SHA: 7b576898f7a82409669a97187bcd836296a77e24
  CI: 'true'
  SOURCE_DATE_EPOCH: '0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact Arc v1 candidate
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-arc
          ref: ${{ env.ARC_SHA }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild the exact Arc static subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ARC_SHA"
          test "$(node -p 'require("./package.json").version')" = '1.0.0'
          npm run typecheck
          npm test -- tests/release/supply-chain.test.ts
          npm run build
          mkdir -p "$RUNNER_TEMP/arc-v1-evidence/artifacts" "$RUNNER_TEMP/arc-v1-evidence/verification"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/arc-v1-evidence/artifacts/axm-arc-game.tar" \
            -C docs game
          gzip -n "$RUNNER_TEMP/arc-v1-evidence/artifacts/axm-arc-game.tar"
      - name: Verify Arc-owned SLSA provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/arc-v1-evidence/artifacts/axm-arc-game.tar.gz" \
            --repo BigBirdReturns/axm-arc \
            --predicate-type https://slsa.dev/provenance/v1 \
            --signer-workflow BigBirdReturns/axm-arc/.github/workflows/supply-chain-evidence.yml \
            --source-digest "$ARC_SHA" \
            --source-ref refs/heads/main \
            --format json \
            > "$RUNNER_TEMP/arc-v1-evidence/verification/slsa.json"
          test -s "$RUNNER_TEMP/arc-v1-evidence/verification/slsa.json"
      - name: Verify Arc-owned CycloneDX predicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/arc-v1-evidence/artifacts/axm-arc-game.tar.gz" \
            --repo BigBirdReturns/axm-arc \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow BigBirdReturns/axm-arc/.github/workflows/supply-chain-evidence.yml \
            --source-digest "$ARC_SHA" \
            --source-ref refs/heads/main \
            --format json \
            > "$RUNNER_TEMP/arc-v1-evidence/verification/cyclonedx.json"
          test -s "$RUNNER_TEMP/arc-v1-evidence/verification/cyclonedx.json"
      - name: Preserve exact Arc verification
        uses: actions/upload-artifact@v4
        with:
          name: arc-v1-attestation-verification
          path: ${{ runner.temp }}/arc-v1-evidence
          if-no-files-found: error
          retention-days: 30
