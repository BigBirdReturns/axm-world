name: Repair canon evidence path

on:
  push:
    branches: [release/browser-support-performance]
    paths:
      - '.github/workflows/fix-canon-evidence-path.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-canon-evidence-path
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace the nonexistent Gate 6 receipt path with the permanent gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/canon/GODSCAR_CANON_TRACE.json')
          text = path.read_text()
          old = 'e2e/relief-circuit-gate6.spec.ts'
          new = '.github/workflows/gate6-relief-circuit.yml'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Gate 6 evidence path, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify canon trace and complete World suite
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/canon-trace.test.ts tests/world/second-recension-books-1-3.test.ts
          npm test
      - name: Publish the workflow-neutral correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/canon/GODSCAR_CANON_TRACE.json
          git rm .github/workflows/fix-canon-evidence-path.yml
          git diff --cached --check
          git commit -m 'Bind life-fraction canon to the permanent Gate 6 receipt'
          git push origin HEAD:release/browser-support-performance
