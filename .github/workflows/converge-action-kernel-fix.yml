name: Converge action kernel objective law

on:
  push:
    branches:
      - feature/action-runtime-v1
    paths:
      - '.github/workflows/converge-action-kernel-fix.yml'

permissions:
  contents: write

concurrency:
  group: converge-action-kernel-objective-law
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/action-runtime-v1
          fetch-depth: 0
          show-progress: false
      - name: Replace the demonstrated objective-completion drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs')
          source = path.read_text(encoding='utf-8')
          replacement = '''        private static void UpdateObjective(ActionSpecProjection spec, ActionSimulationState state)
          {
              if (state.activeObjectiveIndex < 0 || state.activeObjectiveIndex >= spec.objectives.Length) return;
              var objective = spec.objectives[state.activeObjectiveIndex];
              var defeated = 0;
              foreach (var enemy in state.enemies)
              {
                  if (enemy.objectiveId == objective.id && enemy.mode == ActionEnemyMode.Defeated) defeated += 1;
              }
              if (defeated < objective.targetDefeats || state.completedObjectiveIds.Contains(objective.id)) return;

              state.completedObjectiveIds.Add(objective.id);
              state.completedObjectiveIds.Sort(StringComparer.Ordinal);
              state.events.Add(new ActionEvent { type = "objective_completed", objectiveId = objective.id });

              var next = state.activeObjectiveIndex + 1;
              state.activeObjectiveIndex = next;
              var successThresholdReached = spec.completion.kind == "clear"
                  && state.completedObjectiveIds.Count >= spec.completion.successObjectiveCount;
              if (successThresholdReached)
              {
                  state.enemies.Clear();
                  return;
              }
              if (next < spec.objectives.Length)
              {
                  state.events.Add(new ActionEvent { type = "wave_started", objectiveId = spec.objectives[next].id });
              }
              SpawnWave(spec, state, next);
          }

'''
          pattern = re.compile(
              r'        private static void UpdateObjective\(ActionSpecProjection spec, ActionSimulationState state\)\n'
              r'.*?'
              r'(?=        private static void ClassifyTerminal\(ActionSpecProjection spec, ActionSimulationState state\))',
              re.DOTALL,
          )
          updated, count = pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f'Expected one UpdateObjective method, replaced {count}.')
          path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs
      - name: Publish the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs
          git commit -m 'Align C# objective completion with Arc action law'
          git push origin HEAD:feature/action-runtime-v1
