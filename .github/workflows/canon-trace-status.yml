name: Canon trace and current estate status

on:
  pull_request:
    paths:
      - 'docs/canon/**'
      - 'estate/CURRENT_ESTATE_STATUS.schema.json'
      - 'scripts/estate/**'
      - 'tests/world/canon-trace.test.ts'
      - 'tests/world/browser-support-performance.test.ts'
      - 'package.json'
      - '.github/workflows/canon-trace-status.yml'
  push:
    branches: [main]
    paths:
      - 'docs/canon/**'
      - 'estate/CURRENT_ESTATE_STATUS.schema.json'
      - 'scripts/estate/**'
      - 'tests/world/canon-trace.test.ts'
      - 'tests/world/browser-support-performance.test.ts'
      - 'package.json'
      - '.github/workflows/canon-trace-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Canon, support, and status contracts
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- \
            tests/world/canon-trace.test.ts \
            tests/world/second-recension-books-1-3.test.ts \
            tests/world/browser-support-performance.test.ts
      - name: Generate exact current status without manufacturing acceptance
        run: |
          set -euo pipefail
          mkdir -p current-status
          node scripts/estate/generate-current-status.mjs \
            --repo "$PWD" \
            --estate-root "$PWD" \
            --output-json "$PWD/current-status/CURRENT_ESTATE_STATUS.json" \
            --output-markdown "$PWD/current-status/CURRENT_ESTATE_STATUS.md"
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('current-status/CURRENT_ESTATE_STATUS.json', 'utf8'));
          if (status.format !== 'rodoh-current-estate-status/1') throw new Error('wrong status format');
          if (status.release.ready !== false) throw new Error('pre-release CI must not manufacture local acceptance');
          if (!status.release.blockers.some((value) => /Local operator acceptance/.test(value))) throw new Error('local operator gate missing');
          if (status.bookIV.status !== 'staged-post-1.0' || status.bookIV.runtimeRegistered || status.bookIV.programAssigned) throw new Error('Book IV crossed the release boundary');
          if (Object.keys(status.products).length !== 6) throw new Error('expected five first-party products plus Orchard');
          NODE
      - name: Complete regression suite
        run: |
          set -euo pipefail
          npm test
      - name: Upload exact status and canon receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-canon-trace-current-status
          path: current-status
          if-no-files-found: warn
          retention-days: 30
