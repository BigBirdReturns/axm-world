name: Finalize exact supply-chain assembly

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-supply-chain-assembly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-exact-supply-chain-assembly
  cancel-in-progress: true

env:
  DONOR_SHA: 2e2e7160a1e9b174f9b695bc82e6435941d37d41
  ARC_RELEASE_SHA: 9345cbeb8f360832d8def5e7a37ac094957b8f14
  ARC_PRODUCT_AUTHORITY: 4b07539a06d40b131591f1e9c7d5b90a96ceec31
  CI: 'true'

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Overlay the qualified v2 evidence donor and pin Arc release custody
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$source_head"
          git fetch --no-tags origin qualify/supply-chain-custody-v2
          test "$(git rev-parse origin/qualify/supply-chain-custody-v2)" = "$DONOR_SHA"
          git checkout "$DONOR_SHA" -- \
            .github/workflows/supply-chain-evidence.yml \
            scripts/supply-chain/generate-provenance.mjs \
            scripts/supply-chain/verify-offline-evidence.mjs \
            tests/world/supply-chain.test.ts
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          release = '9345cbeb8f360832d8def5e7a37ac094957b8f14'
          product = '4b07539a06d40b131591f1e9c7d5b90a96ceec31'

          lock_path = Path('estate/estate.lock.json')
          lock = json.loads(lock_path.read_text())
          arc = lock['repositories']['arc']
          if arc.get('requiredAncestor') != product or arc.get('productAuthorityCommit') != product:
              raise SystemExit('Arc product authority moved unexpectedly')
          arc['requiredCommit'] = release
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          workflow_path = Path('.github/workflows/local-estate-replication.yml')
          workflow = workflow_path.read_text()
          workflow, count = re.subn(
              r'(?m)^(\s*ARC_LOCAL_ESTATE_REF:)\s*[0-9a-f]{40}\s*$',
              rf'\1 {release}',
              workflow,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one ARC_LOCAL_ESTATE_REF, found {count}')
          workflow_path.write_text(workflow)

          test_path = Path('tests/world/local-estate-contract.test.ts')
          test = test_path.read_text()
          test, count = re.subn(
              r'requiredCommit:\s*"[0-9a-f]{40}"',
              f'requiredCommit: "{release}"',
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one structured Arc requiredCommit assertion, found {count}')
          test_path.write_text(test)

          doc_path = Path('docs/SUPPLY_CHAIN_CUSTODY.md')
          doc = doc_path.read_text().rstrip()
          statement = (
              f'The coordinated estate checks out Arc release-evidence head `{release}`. '
              f'The byte-identical product, engine, and creator source plane remain governed by '
              f'product-authority commit `{product}`.'
          )
          if statement not in doc:
              doc += '\n\n' + statement
          doc_path.write_text(doc + '\n')
          PY
          git diff --check
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('estate/estate.lock.json', 'utf8'));
          if (lock.repositories.arc.requiredCommit !== process.env.ARC_RELEASE_SHA) throw new Error('Arc release head was not pinned');
          if (lock.repositories.arc.requiredAncestor !== process.env.ARC_PRODUCT_AUTHORITY) throw new Error('Arc required ancestor moved');
          if (lock.repositories.arc.productAuthorityCommit !== process.env.ARC_PRODUCT_AUTHORITY) throw new Error('Arc product authority moved');
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Qualify the exact assembled World product and evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/local-estate-contract.test.ts tests/world/supply-chain.test.ts tests/world/holder-estate.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish the carrier-free assembled candidate
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin qualify/supply-chain-assembled-v1
          test "$(git rev-parse origin/qualify/supply-chain-assembled-v1)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/supply-chain-evidence.yml \
            .github/workflows/local-estate-replication.yml \
            scripts/supply-chain/generate-provenance.mjs \
            scripts/supply-chain/verify-offline-evidence.mjs \
            tests/world/supply-chain.test.ts \
            tests/world/local-estate-contract.test.ts \
            estate/estate.lock.json \
            docs/SUPPLY_CHAIN_CUSTODY.md
          git rm .github/workflows/finalize-supply-chain-assembly.yml
          git diff --cached --check
          git commit -m 'Assemble exact release evidence over accepted holder custody'
          git push origin HEAD:qualify/supply-chain-assembled-v1
