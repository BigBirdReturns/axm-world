name: Repair and qualify complete Gate 7 entry spec v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-complete-gate7-entry-spec-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: e0f8a47e1a31505159ba10eb521a2a5d66403fc1
  CI: 'true'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore the complete main spec and apply only the bounded race fix
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:e2e/gate7-clean-room.spec.ts" > "$RUNNER_TEMP/gate7-original.ts"
          python - <<'PY'
          from pathlib import Path
          import os

          original = Path(os.environ['RUNNER_TEMP']) / 'gate7-original.ts'
          target = Path('e2e/gate7-clean-room.spec.ts')
          source = original.read_text()
          old = '    if (await skip.isVisible().catch(() => false)) await skip.click();'
          new = '''    if (await skip.isVisible().catch(() => false)) {
      // Visibility is a snapshot. The entry transition may self-complete and
      // detach this button before the click is dispatched. Race one bounded
      // click against transition disappearance; the terminal shell assertion
      // below still fails honestly if neither route reaches playable state.
      await Promise.race([
        skip.click({ timeout: 250 }).catch(() => undefined),
        transition.waitFor({ state: "hidden", timeout: 250 }).catch(() => undefined),
      ]);
    }'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one unbounded skip click, found {source.count(old)}')
          target.write_text(source.replace(old, new))
          PY
          test "$(wc -l < e2e/gate7-clean-room.spec.ts)" -ge 300
          test "$(grep -c 'unbundled clean-room cartridge completes' e2e/gate7-clean-room.spec.ts)" -eq 1
          test "$(grep -c 'clean-room custody preserves unknown memory' e2e/gate7-clean-room.spec.ts)" -eq 1
          test "$(grep -c 'await skip.click();' e2e/gate7-clean-room.spec.ts)" -eq 0
          git diff --check
          if git diff --quiet -- e2e/gate7-clean-room.spec.ts; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Complete Gate 7 spec is already repaired.'
            exit 0
          fi
          git diff -- e2e/gate7-clean-room.spec.ts
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          head_branch='${{ github.event.pull_request.head.ref || github.ref_name }}'
          git fetch --no-tags origin "$head_branch"
          test "$(git rev-parse "origin/$head_branch")" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/gate7-clean-room.spec.ts
          git diff --cached --check
          git commit -m 'Bound the Gate 7 entry transition race'
          git push origin "HEAD:refs/heads/$head_branch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
        if: steps.repair.outputs.changed == 'false'
      - name: TypeScript and focused source contract
        if: steps.repair.outputs.changed == 'false'
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/gate7-entry-transition-contract.test.ts
      - name: Install Chromium
        if: steps.repair.outputs.changed == 'false'
        run: npx playwright install --with-deps chromium
      - name: Prove Gate 7 on desktop and mobile
        if: steps.repair.outputs.changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate7-repair"
          npx playwright test e2e/gate7-clean-room.spec.ts --workers=1 2>&1 | tee "$RUNNER_TEMP/gate7-repair/gate7.log"
      - uses: actions/upload-artifact@v4
        if: always() && steps.repair.outputs.changed == 'false'
        with:
          name: gate7-entry-transition-repair-v2
          path: ${{ runner.temp }}/gate7-repair
          if-no-files-found: warn
          retention-days: 14
