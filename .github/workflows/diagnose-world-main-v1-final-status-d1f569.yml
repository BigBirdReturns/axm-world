name: Diagnose exact World main v1 final status

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-world-main-v1-final-status-d1f569.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-world-main-v1-final-status-d1f569
  cancel-in-progress: true

env:
  WORLD_SHA: d1f569ee41fa92ede64731e3a6a445be6cb9b080
  ARC_SHA: 318faaab6fb1c4b0eefe66516d3573bdb8f97369
  SOURCE_RUN_ID: '30224770182'
  CI: 'true'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact World main
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-world
          ref: ${{ env.WORLD_SHA }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Import only the exact final machine artifact
        uses: actions/download-artifact@v4
        with:
          name: final-world-main-v1-windows-estate-d1f569
          path: imported-windows
          github-token: ${{ github.token }}
          repository: BigBirdReturns/axm-world
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Calculate and print the unfiltered final status
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t receipts < <(find imported-windows -name windows-replication.json -type f | sort)
          test "${#receipts[@]}" -ge 1
          for receipt in "${receipts[@]}"; do
            node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(process.argv[1], JSON.stringify(v));' "$receipt"
          done
          mkdir -p "$RUNNER_TEMP/final-estate/.rodoh-estate/receipts" "$RUNNER_TEMP/final-status"
          cp "${receipts[0]}" "$RUNNER_TEMP/final-estate/.rodoh-estate/receipts/windows-replication.json"
          node scripts/estate/generate-current-status.mjs \
            --repo "$PWD" \
            --estate-root "$RUNNER_TEMP/final-estate" \
            --output-json "$RUNNER_TEMP/final-status/current-estate-status.json" \
            --output-markdown "$RUNNER_TEMP/final-status/CURRENT_ESTATE_STATUS.md"
          cp "${receipts[0]}" "$RUNNER_TEMP/final-status/windows-replication.json"
          echo '--- current-estate-status.json ---'
          cat "$RUNNER_TEMP/final-status/current-estate-status.json"
          echo '--- CURRENT_ESTATE_STATUS.md ---'
          cat "$RUNNER_TEMP/final-status/CURRENT_ESTATE_STATUS.md"
          node - <<'NODE'
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/final-status/current-estate-status.json`;
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          const summary = {
            repositories: value.repositories,
            release: value.release,
            localEvidence: value.localEvidence,
            capabilities: value.capabilities,
            bookIV: value.bookIV,
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/final-status/diagnostic-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          if (value.repositories.world.commit !== process.env.WORLD_SHA) throw new Error('Diagnostic checkout is not exact World main');
          if (value.repositories.arc.releaseEvidenceCommit !== process.env.ARC_SHA) throw new Error('Diagnostic lock is not exact Arc main');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-main-v1-final-status-diagnostic-d1f569
          path: ${{ runner.temp }}/final-status
          if-no-files-found: warn
          retention-days: 14
