name: Finalize qualified Arc release head

# Publish from the same exact pull-request run that performs qualification.
on:
  pull_request:
    paths:
      - '.github/workflows/finalize-arc-release-head.yml'
  push:
    branches: [release/supply-chain-attestation]
    paths:
      - '.github/workflows/finalize-arc-release-head.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-qualified-arc-release-head-${{ github.event_name }}
  cancel-in-progress: true

env:
  ARC_PRODUCT_AUTHORITY: 4b07539a06d40b131591f1e9c7d5b90a96ceec31
  ARC_RELEASE_HEAD: 547c74f4622f63b203d6601173eec6d569c780f3

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Separate product authority from the coordinated Arc release head
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          product = '4b07539a06d40b131591f1e9c7d5b90a96ceec31'
          release = '547c74f4622f63b203d6601173eec6d569c780f3'

          lock_path = Path('estate/estate.lock.json')
          lock = json.loads(lock_path.read_text())
          arc = lock['repositories']['arc']
          if arc.get('requiredAncestor') != product or arc.get('productAuthorityCommit') != product:
              raise SystemExit('Accepted Arc source/execution authority changed unexpectedly')
          arc['requiredCommit'] = release
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          workflow = Path('.github/workflows/local-estate-replication.yml')
          text = re.sub(
              r'ARC_LOCAL_ESTATE_REF:\s*[0-9a-f]{40}',
              f'ARC_LOCAL_ESTATE_REF: {release}',
              workflow.read_text(),
              count=1,
          )
          if f'ARC_LOCAL_ESTATE_REF: {release}' not in text:
              raise SystemExit('Unable to bind local-estate CI to the Arc release head')
          workflow.write_text(text)

          test = Path('tests/world/local-estate-contract.test.ts')
          text = re.sub(
              r'requiredCommit:\s*"[0-9a-f]{40}"',
              f'requiredCommit: "{release}"',
              test.read_text(),
              count=1,
          )
          if f'requiredCommit: "{release}"' not in text:
              raise SystemExit('Unable to bind the machine contract to the Arc release head')
          test.write_text(text)

          doc = Path('docs/SUPPLY_CHAIN_CUSTODY.md')
          text = doc.read_text().rstrip()
          statement = f'The coordinated estate checks out Arc release head `{release}`. The byte-identical source and execution plane remains governed by product-authority commit `{product}`.'
          if statement not in text:
              text += '\n\n' + statement
          doc.write_text(text + '\n')
          PY
          git diff --check
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('estate/estate.lock.json', 'utf8'));
          if (lock.repositories.arc.requiredCommit !== '547c74f4622f63b203d6601173eec6d569c780f3') throw new Error('Arc release head not pinned');
          if (lock.repositories.arc.productAuthorityCommit !== '4b07539a06d40b131591f1e9c7d5b90a96ceec31') throw new Error('Arc product authority moved');
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Qualify the coordinated lock and release evidence
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/local-estate-contract.test.ts tests/world/supply-chain.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish the workflow-neutral Arc release pin
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estate/estate.lock.json .github/workflows/local-estate-replication.yml tests/world/local-estate-contract.test.ts docs/SUPPLY_CHAIN_CUSTODY.md
          git rm .github/workflows/finalize-arc-release-head.yml
          git diff --cached --check
          git commit -m 'Pin the coordinated estate to the qualified Arc release head'
          git push origin HEAD:release/supply-chain-attestation
