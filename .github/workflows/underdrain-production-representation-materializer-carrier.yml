name: UNDERDRAIN representation materializer carrier

on:
  pull_request:
    branches:
      - feature/underdrain-unity6000-player-train-v1
  push:
    branches:
      - feature/underdrain-production-representation-materializer-v1
    paths:
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-00'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-01'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-02'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-03'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-04'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-05'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-06'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-07'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-08'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-09'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-10'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-11'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-12'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-13'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-14'
      - '.github/carriers/underdrain-production-representation-materializer-v1.part-15'
      - '.github/workflows/underdrain-production-representation-materializer-carrier.yml'

permissions:
  contents: write

concurrency:
  group: underdrain-production-representation-materializer-carrier-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact materializer branch
        uses: actions/checkout@v4
        with:
          ref: feature/underdrain-production-representation-materializer-v1
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify and materialize the bounded source payload
        shell: bash
        env:
          BASE_SHA: 7a25a8e20f680528a5ee38b2ed3f1777a0cf318e
          PAYLOAD_SHA256: 85e157f64fefde5bfe7a6feacebcea5fda4fc9dc28f114e9e4c17b17d9713c72
          PAYLOAD_PREFIX: .github/carriers/underdrain-production-representation-materializer-v1.part-
          CARRIER: .github/workflows/underdrain-production-representation-materializer-carrier.yml
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          cat > "$RUNNER_TEMP/expected-carrier-paths" <<'PATHS'
          .github/carriers/underdrain-production-representation-materializer-v1.part-00
          .github/carriers/underdrain-production-representation-materializer-v1.part-01
          .github/carriers/underdrain-production-representation-materializer-v1.part-02
          .github/carriers/underdrain-production-representation-materializer-v1.part-03
          .github/carriers/underdrain-production-representation-materializer-v1.part-04
          .github/carriers/underdrain-production-representation-materializer-v1.part-05
          .github/carriers/underdrain-production-representation-materializer-v1.part-06
          .github/carriers/underdrain-production-representation-materializer-v1.part-07
          .github/carriers/underdrain-production-representation-materializer-v1.part-08
          .github/carriers/underdrain-production-representation-materializer-v1.part-09
          .github/carriers/underdrain-production-representation-materializer-v1.part-10
          .github/carriers/underdrain-production-representation-materializer-v1.part-11
          .github/carriers/underdrain-production-representation-materializer-v1.part-12
          .github/carriers/underdrain-production-representation-materializer-v1.part-13
          .github/carriers/underdrain-production-representation-materializer-v1.part-14
          .github/carriers/underdrain-production-representation-materializer-v1.part-15
          .github/workflows/underdrain-production-representation-materializer-carrier.yml
          PATHS
          git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/observed-carrier-paths"
          diff -u "$RUNNER_TEMP/expected-carrier-paths" "$RUNNER_TEMP/observed-carrier-paths"
          cat "${PAYLOAD_PREFIX}00" "${PAYLOAD_PREFIX}01" "${PAYLOAD_PREFIX}02" "${PAYLOAD_PREFIX}03" "${PAYLOAD_PREFIX}04" "${PAYLOAD_PREFIX}05" "${PAYLOAD_PREFIX}06" "${PAYLOAD_PREFIX}07" "${PAYLOAD_PREFIX}08" "${PAYLOAD_PREFIX}09" "${PAYLOAD_PREFIX}10" "${PAYLOAD_PREFIX}11" "${PAYLOAD_PREFIX}12" "${PAYLOAD_PREFIX}13" "${PAYLOAD_PREFIX}14" "${PAYLOAD_PREFIX}15" > "$RUNNER_TEMP/payload.b64"
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/payload.tar.gz" | sha256sum --check --strict
          cat > "$RUNNER_TEMP/expected-payload-paths" <<'PATHS'
          ./docs/UNDERDRAIN_REPRESENTATION_MATERIALIZATION.md
          ./scripts/extract-underdrain-shine-assets.mjs
          ./scripts/materialize-underdrain-production-representation.ps1
          ./scripts/resolve-underdrain-shine-representation.mjs
          ./tests/world/underdrain-powershell-contract.test.ts
          ./tests/world/underdrain-representation-materializer.test.ts
          ./unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs
          ./unity/Conformance/Axm.Rodoh.Action.UnderdrainRepresentation.Source.csproj
          ./unity/Fixtures/underdrain.representation-source.template.json
          ./unity/Fixtures/underdrain.shine-role-map.template.json
          ./unity/Fixtures/underdrain.shine-source.json
          ./unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs
          ./unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs
          ./unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionFeedbackPulse.cs
          PATHS
          tar -tzf "$RUNNER_TEMP/payload.tar.gz" | LC_ALL=C sort > "$RUNNER_TEMP/observed-payload-paths"
          diff -u "$RUNNER_TEMP/expected-payload-paths" "$RUNNER_TEMP/observed-payload-paths"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/observed-payload-paths"; then
            echo 'Payload contains an unsafe path.' >&2
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C .
          # Retained CI failures repair only their demonstrated source assertions.
          sed -i 's/presentation-only billboard/Presentation-only billboard/' tests/world/underdrain-representation-materializer.test.ts
          sed -i 's/private sealed class AssetRequirement/private class AssetRequirement/' unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs
          git diff --check

      - name: Qualify the materializer source transaction
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check scripts/extract-underdrain-shine-assets.mjs
          node --check scripts/resolve-underdrain-shine-representation.mjs
          npm run typecheck
          npm test -- \
            tests/world/underdrain-representation-materializer.test.ts \
            tests/world/underdrain-powershell-contract.test.ts \
            tests/world/underdrain-player-product-acceptance.test.ts \
            tests/world/underdrain-unity6000-player-train.test.ts
          dotnet build unity/Conformance/Axm.Rodoh.Action.UnderdrainRepresentation.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj --configuration Release
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          find unity/Conformance -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          git diff --check

      - name: Commit only the admitted materializer source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/final-paths" <<'PATHS'
          docs/UNDERDRAIN_REPRESENTATION_MATERIALIZATION.md
          scripts/extract-underdrain-shine-assets.mjs
          scripts/materialize-underdrain-production-representation.ps1
          scripts/resolve-underdrain-shine-representation.mjs
          tests/world/underdrain-powershell-contract.test.ts
          tests/world/underdrain-representation-materializer.test.ts
          unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs
          unity/Conformance/Axm.Rodoh.Action.UnderdrainRepresentation.Source.csproj
          unity/Fixtures/underdrain.representation-source.template.json
          unity/Fixtures/underdrain.shine-role-map.template.json
          unity/Fixtures/underdrain.shine-source.json
          unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs
          unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs
          unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionFeedbackPulse.cs
          PATHS
          mapfile -t paths < "$RUNNER_TEMP/final-paths"
          git add -- "${paths[@]}"
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/observed-final-paths"
          LC_ALL=C sort "$RUNNER_TEMP/final-paths" > "$RUNNER_TEMP/expected-final-paths"
          diff -u "$RUNNER_TEMP/expected-final-paths" "$RUNNER_TEMP/observed-final-paths"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Materialize the UNDERDRAIN production representation source path"
          git push origin HEAD:feature/underdrain-production-representation-materializer-v1
