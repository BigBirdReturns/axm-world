name: UNDERDRAIN materializer path hardening carrier
# trigger the bounded source repair after workflow installation

on:
  push:
    branches:
      - feature/underdrain-production-representation-materializer-v1
    paths:
      - '.github/workflows/underdrain-materializer-path-hardening-carrier.yml'

permissions:
  contents: write

concurrency:
  group: underdrain-materializer-path-hardening-carrier
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/underdrain-production-representation-materializer-v1
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply the bounded source-root and duplicate-byte repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs')
          source = path.read_text()
          old = source
          source = source.replace(
              '            var roles = new HashSet<string>(StringComparer.Ordinal);\n            var ids = new HashSet<string>(StringComparer.Ordinal);',
              '            var roles = new HashSet<string>(StringComparer.Ordinal);\n            var ids = new HashSet<string>(StringComparer.Ordinal);\n            var sourceDigests = new HashSet<string>(StringComparer.Ordinal);',
          )
          source = source.replace(
              '                if (!IsSha(asset.sha256)) throw new InvalidOperationException("Resolved representation source SHA-256 is malformed for " + asset.role + ".");',
              '                if (!IsSha(asset.sha256)) throw new InvalidOperationException("Resolved representation source SHA-256 is malformed for " + asset.role + ".");\n                if (!sourceDigests.Add(asset.sha256)) throw new InvalidOperationException("Distinct UNDERDRAIN production roles may not share prepared PNG bytes: " + asset.sha256 + ".");',
          )
          source = source.replace(
              '                var path = Path.GetFullPath(Path.Combine(sourceRoot, asset.fileName));\n                if (!path.StartsWith(sourceRoot, StringComparison.OrdinalIgnoreCase)) throw new InvalidOperationException("Resolved representation source escapes its source root: " + asset.fileName + ".");',
              '                var path = Path.GetFullPath(Path.Combine(sourceRoot, asset.fileName));\n                if (!IsPathWithinRoot(sourceRoot, path)) throw new InvalidOperationException("Resolved representation source escapes its source root: " + asset.fileName + ".");',
          )
          marker = '        private static MaterializedSource ImportSource(SourceAsset source, string sourceRoot, string importedRoot, string materialRoot)\n'
          helper = '''        private static bool IsPathWithinRoot(string root, string candidate)\n        {\n            var normalizedRoot = Path.GetFullPath(root).TrimEnd(Path.DirectorySeparatorChar, Path.AltDirectorySeparatorChar) + Path.DirectorySeparatorChar;\n            var normalizedCandidate = Path.GetFullPath(candidate);\n            return normalizedCandidate.StartsWith(normalizedRoot, StringComparison.OrdinalIgnoreCase);\n        }\n\n'''
          if helper not in source:
              source = source.replace(marker, helper + marker)
          if source == old:
              raise SystemExit('Materializer source did not expose the expected pre-repair forms.')
          for witness in ('sourceDigests.Add(asset.sha256)', 'IsPathWithinRoot(sourceRoot, path)', 'private static bool IsPathWithinRoot'):
              if witness not in source:
                  raise SystemExit(f'Materializer repair lost witness: {witness}')
          path.write_text(source)
          PY
          git diff --check

      - name: Qualify the exact repair
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- \
            tests/world/underdrain-representation-materializer.test.ts \
            tests/world/underdrain-powershell-contract.test.ts \
            tests/world/underdrain-player-product-acceptance.test.ts \
            tests/world/underdrain-unity6000-player-train.test.ts
          dotnet build unity/Conformance/Axm.Rodoh.Action.UnderdrainRepresentation.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj --configuration Release
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          find unity/Conformance -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          git diff --check

      - name: Publish only the repaired materializer
        shell: bash
        run: |
          set -euo pipefail
          target='unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs'
          git add -- "$target"
          test "$(git diff --cached --name-only)" = "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Refuse duplicate role bytes and sibling source paths'
          git push origin HEAD:feature/underdrain-production-representation-materializer-v1
