name: UNDERDRAIN materializer Unity import closure v2 carrier

on:
  push:
    branches:
      - repair/underdrain-materializer-unity-import-closure-v2
    paths:
      - '.github/workflows/underdrain-materializer-unity-import-closure-v2-carrier.yml'

permissions:
  contents: write

concurrency:
  group: underdrain-materializer-unity-import-closure-v2-carrier
  cancel-in-progress: false

env:
  EXPECTED_PARENT: efab237853c23540d52f367867107ae3865016c7
  TARGET_BRANCH: repair/underdrain-materializer-unity-import-closure-v2
  CARRIER: .github/workflows/underdrain-materializer-unity-import-closure-v2-carrier.yml
  SUPERSEDED_RUNNER: .github/workflows/underdrain-materializer-unity-import-closure-runner.yml
  PATCH_SHA256: 080edb4439ae2f65595e099e33970bfb934cb271e0bd24612c8ff96b31c41699
  PATCH_GZIP_BASE64: 
  EXPECTED_FILES_JSON: '[{"path":"docs/UNDERDRAIN_REPRESENTATION_MATERIALIZATION.md","bytes":10801,"sha256":"22bb890a4acc5725de9146fe54668eb8a1f1f13c339dbdc0685370ac13e35207"},{"path":"scripts/materialize-underdrain-production-representation.ps1","bytes":11215,"sha256":"4248e0a39e22331c3f37f1ea61b7faf434543954d0c1a2873f1f013eaa06c491"},{"path":"tests/world/underdrain-representation-materializer.test.ts","bytes":25623,"sha256":"aa1342a7e4bd47a28485c8c241445ac2017d838e3aad70d254985ca8b25a2fe3"},{"path":"unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs","bytes":17383,"sha256":"da5be97459be32aa3e7c22e53ebdd72414d58b30912696519fd323cc0147c8d0"},{"path":"unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs","bytes":52412,"sha256":"f063f8b1908c34147bccb422411038c456cc4505ae6f294b76c15d0b594386c3"},{"path":"unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs","bytes":2917,"sha256":"57160e0746be4f026492165a69218db64674b91bb01b9cb26982eb1e3c5e4f7"}]'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Admit the exact parent and apply the recovered repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$CARRIER"
          git diff --check "$EXPECTED_PARENT" HEAD
          PATCH_GZIP_BASE64="$PATCH_GZIP_BASE64" PATCH_SHA256="$PATCH_SHA256" python - <<'PY'
          import base64, gzip, hashlib, os
          payload = gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_BASE64'], validate=True))
          actual = hashlib.sha256(payload).hexdigest()
          if actual != os.environ['PATCH_SHA256']:
              raise SystemExit(f'patch-sha-mismatch:{actual}')
          exec(compile(payload, '<underdrain-materializer-unity-import-closure-v2>', 'exec'))
          PY
          EXPECTED_FILES_JSON="$EXPECTED_FILES_JSON" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = json.loads(os.environ['EXPECTED_FILES_JSON'])
          for item in files:
              path = Path(item['path'])
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if len(data) != item['bytes'] or actual != item['sha256']:
                  raise SystemExit(f"source-custody-mismatch:{path}:{len(data)}:{actual}")
          batch = Path('unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs').read_text()
          runner = Path('scripts/materialize-underdrain-production-representation.ps1').read_text()
          stubs = Path('unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs').read_text()
          billboard = Path('unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs').read_text()
          witnesses = {
              'custom sprite alignment': 'spriteAlignment = (int)SpriteAlignment.Custom' in batch,
              'separate facing pivot': 'var facing = Child(root.transform, "Facing")' in batch,
              'nested visual curves': 'clip.SetCurve("Facing/Visual"' in batch,
              'no old visual curves': 'clip.SetCurve("Visual"' not in batch,
              'up-front approval refusal': batch.index('RefuseApprovedRepresentation(presentation)') < batch.index('EnsureFolders(assetRoot'),
              'sprite alignment stub': 'enum SpriteAlignment { Custom = 9 }' in stubs and 'public int spriteAlignment;' in stubs,
              'billboard facing fallback': 'transform.Find("Facing")' in billboard,
              'machine lock': 'MACHINE_LOCK.json' in runner,
              'exact World commit': 'ExpectedWorldCommit' in runner and 'Resolve-CleanGitCommit' in runner,
              'exact Arc commit': 'ExpectedArcCommit' in runner and 'arcCommit = $arcCommit' in runner,
              'Unity before package mutation': runner.index('Get-Process Unity') < runner.index('robocopy.exe'),
          }
          missing = [name for name, present in witnesses.items() if not present]
          if missing:
              raise SystemExit('repair-witness-missing:' + ','.join(missing))
          PY
          git diff --check

      - name: Qualify the repaired source estate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- \
            tests/world/underdrain-representation-materializer.test.ts \
            tests/world/underdrain-powershell-contract.test.ts \
            tests/world/underdrain-machine-preflight.test.ts \
            tests/world/underdrain-player-product-acceptance.test.ts \
            tests/world/underdrain-unity6000-player-train.test.ts
          dotnet build unity/Conformance/Axm.Rodoh.Action.UnderdrainRepresentation.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.Cues.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.Conformance.csproj --configuration Release
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          find unity/Conformance -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          git diff --check

      - name: Publish only the qualified carrier-free repair
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$CARRIER" "$SUPERSEDED_RUNNER"
          EXPECTED_FILES_JSON="$EXPECTED_FILES_JSON" python - <<'PY'
          import json, os, subprocess
          paths = [item['path'] for item in json.loads(os.environ['EXPECTED_FILES_JSON'])]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          cat > "$RUNNER_TEMP/expected-paths" <<'PATHS'
          .github/workflows/underdrain-materializer-unity-import-closure-v2-carrier.yml
          .github/workflows/underdrain-materializer-unity-import-closure-runner.yml
          docs/UNDERDRAIN_REPRESENTATION_MATERIALIZATION.md
          scripts/materialize-underdrain-production-representation.ps1
          tests/world/underdrain-representation-materializer.test.ts
          unity/Conformance/ActionUnderdrainRepresentationUnityStubs.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainRepresentationMaterializerBatch.cs
          unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCameraFacingSprite.cs
          PATHS
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/expected-paths"
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/observed-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/observed-paths"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Close UNDERDRAIN materializer Unity import custody'
          git push origin HEAD:"$TARGET_BRANCH"
