name: Finalize asset release inventory

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-asset-release-inventory.yml'
      - 'docs/canon/**'
  push:
    branches: [release/asset-custody-closure]
    paths:
      - '.github/workflows/finalize-asset-release-inventory.yml'
      - 'docs/canon/**'
      - 'scripts/assets/build-release-asset-inventory.mjs'
      - 'src/assets/rollups/rodoh-v1-programs.json'
      - 'src/assets/descriptions/rodoh-v1-dense-assets.json'
      - 'tests/world/asset-release-custody.test.ts'
      - 'src/assets/**/*.svg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-asset-release-inventory
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check
      - name: Generate deterministic release asset inventory
        run: |
          set -euo pipefail
          mkdir -p docs/release
          node scripts/assets/build-release-asset-inventory.mjs \
            --root "$PWD" \
            --rollups src/assets/rollups/rodoh-v1-programs.json \
            --descriptions src/assets/descriptions/rodoh-v1-dense-assets.json \
            --output docs/release/RODOH_ASSET_INVENTORY.json \
            2>&1 | tee asset-inventory-build.log
          node scripts/assets/build-release-asset-inventory.mjs \
            --root "$PWD" \
            --rollups src/assets/rollups/rodoh-v1-programs.json \
            --descriptions src/assets/descriptions/rodoh-v1-dense-assets.json \
            --output docs/release/RODOH_ASSET_INVENTORY.json \
            --check 2>&1 | tee -a asset-inventory-build.log
      - name: Qualify asset custody and product
        run: |
          set -euo pipefail
          : > asset-qualification.log
          npm run typecheck 2>&1 | tee -a asset-qualification.log
          npm test -- tests/world/asset-release-custody.test.ts tests/world/asset-standard.test.ts tests/world/production-asset-wave-one.test.ts tests/world/lamp-district-assets.test.ts tests/world/relief-circuit-production-assets.test.ts 2>&1 | tee -a asset-qualification.log
          npm test 2>&1 | tee -a asset-qualification.log
          npm run build 2>&1 | tee -a asset-qualification.log
          node scripts/performance/audit-static-build.mjs \
            --build docs/game \
            --budgets docs/performance/RODOH_PERFORMANCE_BUDGETS.json \
            --output asset-performance-receipt.json 2>&1 | tee -a asset-qualification.log
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check 2>&1 | tee -a asset-qualification.log
      - name: Publish the workflow-neutral inventory
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release/RODOH_ASSET_INVENTORY.json
          if git diff --cached --quiet; then
            echo 'Asset inventory is already current.'
          else
            git commit -m 'Publish the RODOH v1 asset custody inventory'
            git push origin HEAD:release/asset-custody-closure
          fi
      - name: Upload finalization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-release-inventory-finalization
          path: |
            asset-inventory-build.log
            asset-qualification.log
            asset-performance-receipt.json
            docs/release/RODOH_ASSET_INVENTORY.json
          if-no-files-found: warn
          retention-days: 14
