name: UNDERDRAIN continuous authored pilot

on:
  pull_request:
    paths:
      - '.github/workflows/underdrain-standalone-demo.yml'
      - 'demos/underdrain-draft/**'
      - 'scripts/demos/build-underdrain-draft.mjs'
      - 'scripts/demos/verify-underdrain-draft.mjs'
      - 'tests/world/underdrain-draft-standalone.test.ts'
      - 'tests/world/action-semantic-objective-contract.test.ts'
      - 'tests/world/one-am-player.test.ts'
      - 'tests/world/one-am-structural-evidence.test.ts'
      - 'e2e/underdrain-draft.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  SOURCE_DATE_EPOCH: '0'
  ARC_UNDERDRAIN_SHA: 395bc539165cc525678ba7eb83434c8cd674437b
  SENTINEL_WORLD_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact World candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: axm-world
          fetch-depth: 0
          show-progress: false

      - name: Check out exact Arc authority
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-arc
          ref: ${{ env.ARC_UNDERDRAIN_SHA }}
          path: axm-arc
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            axm-world/package-lock.json
            axm-arc/package-lock.json

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix axm-world ci --no-audit --no-fund
          npm --prefix axm-arc ci --no-audit --no-fund

      - name: Require exact Arc authoring and source qualification
        shell: bash
        run: |
          set -euo pipefail
          cmp axm-arc/examples/underdrain-draft/authoring.json axm-world/demos/underdrain-draft/authoring.json
          (
            cd axm-arc/examples/underdrain-draft
            sha256sum -c SHA256SUMS
          )
          npm --prefix axm-arc run typecheck
          npm --prefix axm-arc test -- \
            tests/demos/underdrain-draft.test.ts \
            tests/demos/underdrain-root-gate.test.ts \
            tests/action/semantic-objectives.test.ts \
            tests/experience/authored-experience.test.ts

      - name: Build the exact candidate twice and verify custody
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/underdrain-authored-pilot"
          mkdir -p "$root" axm-world/local/underdrain-draft
          world_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          authoring_sha="$(sha256sum axm-world/demos/underdrain-draft/authoring.json | cut -d' ' -f1)"

          node axm-world/scripts/demos/build-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --output axm-world/local/underdrain-draft/index.html \
            --world-commit "$world_sha" \
            --hash-output "$root/exact-build.sha256" \
            | tee "$root/exact-build.json"
          node axm-world/scripts/demos/build-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --output "$root/exact-build-second.html" \
            --world-commit "$world_sha" \
            > "$root/exact-build-second.json"
          cmp axm-world/local/underdrain-draft/index.html "$root/exact-build-second.html"

          node axm-world/scripts/demos/verify-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --html axm-world/local/underdrain-draft/index.html \
            --world-commit "$world_sha" \
            --arc-commit "$ARC_UNDERDRAIN_SHA" \
            --authoring-sha256 "$authoring_sha" \
            --output "$root/static-verification.json" \
            | tee "$root/static-verification.log"

          node axm-world/scripts/demos/build-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --output "$root/sentinel.html" \
            --world-commit "$SENTINEL_WORLD_SHA" \
            > "$root/sentinel-build.json"
          EXPECTED_PATH=axm-world/demos/underdrain-draft/expected-build.json \
          SENTINEL_HTML="$root/sentinel.html" \
          ARC_SHA="$ARC_UNDERDRAIN_SHA" \
          AUTHORING_SHA="$authoring_sha" \
          SENTINEL_SHA="$SENTINEL_WORLD_SHA" \
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync(process.env.EXPECTED_PATH, 'utf8'));
          const digest = createHash('sha256').update(readFileSync(process.env.SENTINEL_HTML)).digest('hex');
          if (expected.format !== 'rodoh-underdrain-expected-build/2') throw new Error('expected-build format mismatch');
          if (expected.worldCommit !== process.env.SENTINEL_SHA) throw new Error('sentinel World identity mismatch');
          if (expected.arcCommit !== process.env.ARC_SHA) throw new Error('expected Arc identity mismatch');
          if (expected.authoringSha256 !== process.env.AUTHORING_SHA) throw new Error('expected authoring identity mismatch');
          if (expected.htmlSha256 !== digest) throw new Error(`sentinel build digest mismatch: ${digest}`);
          console.log(`PASS: deterministic sentinel ${digest}`);
          NODE

      - name: Qualify World law and the complete product
        working-directory: axm-world
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- \
            tests/world/underdrain-draft-standalone.test.ts \
            tests/world/action-semantic-objective-contract.test.ts \
            tests/world/one-am-player.test.ts \
            tests/world/one-am-structural-evidence.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game

      - name: Install Chromium
        working-directory: axm-world
        run: npx playwright install --with-deps chromium

      - name: Cold-walk desktop and mobile
        working-directory: axm-world
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/underdrain-draft.spec.ts \
            --project=desktop \
            --project=mobile

      - name: Assemble exact retained qualification
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/underdrain-authored-pilot"
          cp axm-world/local/underdrain-draft/index.html "$root/"
          cp axm-world/demos/underdrain-draft/authoring.json "$root/"
          cp axm-world/demos/underdrain-draft/expected-build.json "$root/"
          cp axm-world/demos/underdrain-draft/playtest.json "$root/"
          cp axm-world/demos/underdrain-draft/PLAYTEST.md "$root/"
          cp axm-world/demos/underdrain-draft/README.md "$root/"
          if [[ -d axm-world/test-results ]]; then
            cp -a axm-world/test-results "$root/playwright-test-results"
          fi
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > "$root/world-candidate.txt"
          printf '%s\n' "$ARC_UNDERDRAIN_SHA" > "$root/arc-candidate.txt"
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          rm -rf axm-world/local/underdrain-draft axm-world/test-results
          git -C axm-world diff --check
          test -z "$(git -C axm-world status --porcelain)"
          git -C axm-arc diff --check
          test -z "$(git -C axm-arc status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: underdrain-continuous-authored-pilot
          path: ${{ runner.temp }}/underdrain-authored-pilot
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
