name: underdrain-integration-materialize

on:
  push:
    branches:
      - integration/underdrain-unity6000-player-product-v1
    paths:
      - '.github/workflows/underdrain-integration-materialize.yml'
      - '.underdrain/payload.part*.b64'

permissions:
  contents: write

concurrency:
  group: underdrain-integration-materialize
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: integration/underdrain-unity6000-player-product-v1
  BASELINE_SHA: 7a3fb2e32702b4e8e2621d4fce2abb8336da231f
  EXPECTED_PAYLOAD_SHA256: 1879c7f200abbabe61a0a2db9a35e9d0d6af6044296b130a650a97a35d9b7ca8

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Audit sealed carrier and materialize only on exact agreement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"

          mapfile -t parts < <(find .underdrain -maxdepth 1 -type f -name 'payload.part*.b64' -printf '%f\n' | sort)
          test "${#parts[@]}" -eq 7
          for index in 01 02 03 04 05 06 07; do
            test -f ".underdrain/payload.part${index}.b64"
          done

          payload="$RUNNER_TEMP/underdrain-integration-payload.tar.xz"
          expected="$RUNNER_TEMP/underdrain-sealed-files.tsv"
          diagnostic=".underdrain/bootstrap-diagnostic.json"
          cat .underdrain/payload.part*.b64 | base64 --decode > "$payload"
          sha256sum .underdrain/payload.part*.b64 > "$RUNNER_TEMP/underdrain-bootstrap-parts.sha256"

          cat > "$expected" <<'SEALED'
          008738a3c2af3f0aec5b050d18ff150ff27c5c937e93821b67b5e11d5c4151d5	6799	payload	.github/workflows/underdrain-player-product-integration.yml
          81a1c311666c9b24d9ce48679507123a9df7bd1ed227af06942d818e4cb2d637	8909	payload	.github/workflows/underdrain-unity6000-real.yml
          a211d0c146a42fcb67ecbd4b3752c553d33c494b97b69f073d409731cc667079	42968	payload	scripts/accept-underdrain-player-product.ps1
          0ff662e73da7196a90d1bff42f078259afd39fbb54a76452a20e27eff0c09f9d	6178	payload	scripts/augment-underdrain-player-evidence.ps1
          4c82bb5f731c4a33ef6a4700efafc8a49bb58d3106868595980ea0bbd76378e2	6447	payload	scripts/build-underdrain-visual-review.mjs
          6551bc091c0e8990092bb9014efd03ccbadc548254a227621c3117658d00b409	15723	payload	scripts/build-unity-action-player.ps1
          1e79db98afaa7c24a5f8f4494d1221c43f60afac4753eedfbda9245b06eb6ab5	23909	payload	scripts/continue-underdrain-unity6000.ps1
          25529abd0db6d43cbc91234f20a142603eefe53ace40178d8cee05ad3977f5ca	9400	payload	scripts/lib/underdrain-runtime.ps1
          164ad7fe673e8b2624a565b80a7998f1ab56b4ae5c96202ab80925e252f4d2d7	10923	payload	scripts/qualify-unity-action-player-product.ps1
          c088d45cf3b4f98d2ef3ebae71178022103f0487e2b8d309609dc75eafe04923	17331	payload	scripts/record-underdrain-independent-comprehension.ps1
          6ea6a1a6df544c334ada7390405cdbdecf9df889c2519ce98f2a667dbf9d0d7d	6068	payload	scripts/record-underdrain-visual-review.ps1
          dfde2db769ba9ac36fac8c5236aaaca7cbaba30e592bce1e830457704100425a	5642	payload	scripts/run-underdrain-camera-collision-qa.ps1
          0bd2a83c9c116ba13f9a6d703d45cff7166111528519408de241f43e5deca692	26070	payload	scripts/run-underdrain-player-session.ps1
          ca4d6f592a2a248738f4bd9faf16efcf928a122f1b75f62eb6179e16f468887b	6402	payload	scripts/run-underdrain-unity-visual-qa.ps1
          bafdc7bcfb231e112567f7abbca4845d5eb4e5f91fe61ff5d5f592a9d8643a19	14659	payload	scripts/run-underdrain-unity6000-player-product.ps1
          6f0c43323bd06d2fa680dbc695dcc6135cf199d9bbbffd31be75e2605bd91707	22181	payload	scripts/run-underdrain-unity6000-player-train.ps1
          4e788aae3834d71dffb7138bc4e893ab1fe3c09dceaf06416a2b1b6ee0d618cc	9765	payload	scripts/settle-underdrain-player-product-integration.ps1
          10da2960827b4a544aa40a62ad351f1abe47504746d5365d899d4c05c6c6dad9	8137	payload	tests/world/underdrain-player-product-acceptance.test.ts
          c78c77f7d1c0fb384b62bd0d12063ae19a9e513503c9c36eb7bcc2fc1802807c	12492	payload	tests/world/underdrain-player-product-integration.test.ts
          4610ccdc0175ef669726220b26bd021734ea00d729c8bcf11005f9d388ba0378	2087	payload	tests/world/underdrain-powershell-contract.test.ts
          63e8620dd38992b5bcb6537ffec8ba5e98fde77acb28057c88b338a96374b168	7337	payload	tests/world/underdrain-unity6000-player-train.test.ts
          eaf1f4207f17a5a85e775567c3682574571755b55863b02cc5f77c9a0205a111	533	payload	unity/Fixtures/underdrain.arc-execution-authority.json
          6cbce6ad397ef959450ed6b956ea849c1824b59de884f126606e3c13b5cc9d94	6507	checkout	unity/Fixtures/underdrain.authored-presentation.template.json
          637ac033c0cf30120b8c82937e548b7e47d9bbed9947720b4884ca9d1e490eda	2574	payload	unity/Fixtures/underdrain.comprehension-contract.json
          356e1e982b6f2878416b09e861a576495fa480b2c48e35f3f380b01f94150639	4394	payload	unity/Fixtures/underdrain.player-product.integration-lock.json
          c6589d9942eae4b98045bd9f603b3a4e736a2143e91a18f4a705fc3846d4e10d	2198	checkout	unity/Fixtures/underdrain.player-product.json
          ffa5a5902d7859b0c6b6e157b321033d93c59ccb105885bb7a4ec8e0b62a3b20	45045	payload	unity/Packages/com.axm.rodoh-action/Editor/ActionPlayerProductBatch.cs
          44aa3f9cca49932d06a984e50687c800c9f24c99678f14d57a95f6b5556c3599	18861	payload	unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainCameraCollisionQaBatch.cs
          77027eb438f71dd2cff7040d280094952ead5661b0a5543a941d9e7ed5faf76a	16711	payload	unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainEvidenceAugmentBatch.cs
          7ee4cd0c5c9ea2b5620ca7829dd7f857ef1a2a88f8960ed0f61a29f81bbb9f92	20475	payload	unity/Packages/com.axm.rodoh-action/Editor/ActionUnderdrainVisualQaBatch.cs
          dacce8600f3f0af04c44f6aa4e54dae0d11445e292bf5a9d07223e055770f2a9	13259	payload	unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputBindings.cs
          63bc26bb0f05c65b7c0f40ded057f20fea605530ae25e6c42a68ddbb7e32ae50	10716	payload	unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionPlayerProductIdentity.cs
          d4bac659fd397835a8e6b2f40144768d240eddbda50dc7070dd3a2f6cb33db8d	24873	payload	unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionPlayerSessionEvidence.cs
          80b4f438db9a8b5c198e775ad0d5e80777eb297b373d9eb5ac7bf1bc1ee05d89	12587	payload	unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionRebindSessionEvidence.cs
          SEALED
          sed -i 's/^          //' "$expected"

          PAYLOAD="$payload" EXPECTED="$expected" DIAGNOSTIC="$diagnostic" \
          EXPECTED_PAYLOAD_SHA256="$EXPECTED_PAYLOAD_SHA256" GITHUB_SHA="$GITHUB_SHA" \
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import tarfile
          from datetime import datetime, timezone
          from pathlib import Path

          payload = Path(os.environ["PAYLOAD"])
          expected_path = Path(os.environ["EXPECTED"])
          diagnostic_path = Path(os.environ["DIAGNOSTIC"])
          expected_payload_sha = os.environ["EXPECTED_PAYLOAD_SHA256"]

          expected = []
          for raw in expected_path.read_text(encoding="utf-8").splitlines():
              sha, size, source, path = raw.split("\t", 3)
              expected.append({
                  "path": path,
                  "source": source,
                  "expectedSha256": sha,
                  "expectedBytes": int(size),
              })

          payload_bytes = payload.read_bytes()
          actual_payload_sha = hashlib.sha256(payload_bytes).hexdigest()
          errors = []
          observations = []
          payload_names = []
          payload_content = {}

          try:
              with tarfile.open(payload, mode="r:xz") as archive:
                  members = archive.getmembers()
                  for member in members:
                      normalized = member.name.removeprefix("./")
                      if not member.isfile():
                          errors.append(f"non-regular-member:{normalized}:{member.type!r}")
                          continue
                      if normalized.startswith("/") or ".." in Path(normalized).parts:
                          errors.append(f"unsafe-member:{normalized}")
                          continue
                      payload_names.append(normalized)
                      stream = archive.extractfile(member)
                      if stream is None:
                          errors.append(f"unreadable-member:{normalized}")
                          continue
                      payload_content[normalized] = stream.read()
          except Exception as exc:
              errors.append(f"payload-open:{type(exc).__name__}:{exc}")

          expected_payload_names = sorted(item["path"] for item in expected if item["source"] == "payload")
          actual_payload_names = sorted(payload_names)
          if actual_payload_names != expected_payload_names:
              errors.append("payload-path-set-mismatch")

          for item in expected:
              path = item["path"]
              if item["source"] == "payload":
                  content = payload_content.get(path)
              else:
                  candidate = Path(path)
                  content = candidate.read_bytes() if candidate.is_file() else None
              if content is None:
                  actual_sha = None
                  actual_bytes = None
                  match = False
              else:
                  actual_sha = hashlib.sha256(content).hexdigest()
                  actual_bytes = len(content)
                  match = actual_sha == item["expectedSha256"] and actual_bytes == item["expectedBytes"]
              observations.append({
                  **item,
                  "actualSha256": actual_sha,
                  "actualBytes": actual_bytes,
                  "match": match,
              })
              if not match:
                  errors.append(f"sealed-file-mismatch:{path}")

          all_sealed_files_match = not errors and len(observations) == 34 and all(item["match"] for item in observations)
          receipt = {
              "format": "rodoh-underdrain-integration-carrier-audit/1",
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "status": "pass" if all_sealed_files_match else "held",
              "carrierCommit": os.environ["GITHUB_SHA"],
              "expectedPayloadSha256": expected_payload_sha,
              "actualPayloadSha256": actual_payload_sha,
              "payloadDigestMatch": actual_payload_sha == expected_payload_sha,
              "payloadBytes": len(payload_bytes),
              "expectedPayloadPathCount": len(expected_payload_names),
              "actualPayloadPathCount": len(actual_payload_names),
              "payloadPathSetMatch": actual_payload_names == expected_payload_names,
              "sealedFileCount": len(observations),
              "allSealedFilesMatch": all_sealed_files_match,
              "files": observations,
              "errors": sorted(set(errors)),
              "materializationPerformed": False,
              "productAccepted": False,
              "namedPlayerProductAcceptance": "not-issued",
              "aggregateReadinessScore": None,
          }
          diagnostic_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "status": receipt["status"],
              "expectedPayloadSha256": expected_payload_sha,
              "actualPayloadSha256": actual_payload_sha,
              "payloadDigestMatch": receipt["payloadDigestMatch"],
              "payloadPathSetMatch": receipt["payloadPathSetMatch"],
              "allSealedFilesMatch": all_sealed_files_match,
              "errors": receipt["errors"],
          }, sort_keys=True))
          PY

          audit_status="$(python -c 'import json; print(json.load(open(".underdrain/bootstrap-diagnostic.json", encoding="utf-8"))["status"])')"
          digest_match="$(python -c 'import json; print(str(json.load(open(".underdrain/bootstrap-diagnostic.json", encoding="utf-8"))["payloadDigestMatch"]).lower())')"

          if [[ "$audit_status" != "pass" || "$digest_match" != "true" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .underdrain/bootstrap-diagnostic.json
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m 'Retain UNDERDRAIN sealed-carrier audit'
              git push origin HEAD:"$EXPECTED_BRANCH"
            fi
            echo "::error title=UNDERDRAIN carrier held::The carrier did not satisfy both the archive digest and the complete 34-file seal. No source was materialized."
            exit 1
          fi

          tar --no-same-owner --no-same-permissions -xJf "$payload" -C .
          rm -rf .underdrain
          rm -f .github/workflows/underdrain-integration-materialize.yml
          git checkout "$BASELINE_SHA" -- .github/workflows/underdrain-player-product-acceptance-source.yml

          node --check scripts/build-underdrain-visual-review.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for relative in (
              'unity/Fixtures/underdrain.arc-execution-authority.json',
              'unity/Fixtures/underdrain.comprehension-contract.json',
              'unity/Fixtures/underdrain.player-product.integration-lock.json',
          ):
              json.loads(Path(relative).read_text(encoding='utf-8'))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test ! -e .underdrain
          test ! -e .github/workflows/underdrain-integration-materialize.yml
          test "$(git show "$BASELINE_SHA":.github/workflows/underdrain-player-product-acceptance-source.yml | sha256sum | cut -d' ' -f1)" = "$(sha256sum .github/workflows/underdrain-player-product-acceptance-source.yml | cut -d' ' -f1)"
          git commit -m 'Consolidate exact UNDERDRAIN Unity 6000 player product'
          git push origin HEAD:"$EXPECTED_BRANCH"

      - name: Retain reconstructed payload and checksum diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: underdrain-integration-bootstrap-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/underdrain-integration-payload.tar.xz
            ${{ runner.temp }}/underdrain-bootstrap-parts.sha256
            .underdrain/bootstrap-diagnostic.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
