name: Finalize exact browser-support assembly

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-browser-support-assembly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-exact-browser-support-assembly
  cancel-in-progress: true

env:
  BROWSER_DONOR_SHA: 095971265f6c9855ce49cb4c0050a88cbe346aed
  FINAL_AUTHOR_DATE: '2026-07-26T08:00:00Z'
  CI: 'true'
  PW_BASE_URL: http://127.0.0.1:5173

jobs:
  linux-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derive the carrier-free browser candidate
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$source_head"
          git fetch --no-tags origin release/browser-support-performance
          test "$(git rev-parse origin/release/browser-support-performance)" = "$BROWSER_DONOR_SHA"
          git checkout "$BROWSER_DONOR_SHA" -- \
            .github/workflows/browser-support-performance.yml \
            .github/workflows/canon-trace-status.yml \
            docs/SUPPORT_MATRIX.md \
            docs/canon/GODSCAR_CANON_TRACE.json \
            docs/canon/GODSCAR_CANON_TRACE.schema.json \
            docs/performance/RODOH_PERFORMANCE_BUDGETS.json \
            e2e/performance-budget.spec.ts \
            e2e/support-smoke.spec.ts \
            estate/CURRENT_ESTATE_STATUS.schema.json \
            estate/nvda-edge-acceptance.schema.json \
            package.json \
            playwright.support.config.ts \
            scripts/accessibility/Record-NvdaEdgeAcceptance.ps1 \
            scripts/estate/generate-current-status.mjs \
            scripts/performance/audit-static-build.mjs \
            src/world/brand/RodohRuntimeMark.tsx \
            src/world/pixel-ui/PixelIcon.tsx \
            tests/world/browser-support-performance.test.ts \
            tests/world/canon-trace.test.ts
          git rm .github/workflows/finalize-browser-support-assembly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Assemble browser support over exact release provenance' | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_AUTHOR_DATE="$FINAL_AUTHOR_DATE" \
            GIT_COMMITTER_DATE="$FINAL_AUTHOR_DATE" \
            git commit-tree "$tree" -p "$source_head")"
          git reset --hard "$commit"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$commit" | tee "$RUNNER_TEMP/browser-candidate.txt"
      - run: npm ci --no-audit --no-fund
      - name: Exact contracts and complete World product
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/browser-support-performance.test.ts tests/world/canon-trace.test.ts tests/world/local-estate-contract.test.ts tests/world/supply-chain.test.ts tests/world/holder-estate.test.ts
          npm test
          npm run build
          mkdir -p browser-assembly-receipt
          node scripts/performance/audit-static-build.mjs \
            --build docs/game \
            --budgets docs/performance/RODOH_PERFORMANCE_BUDGETS.json \
            --output browser-assembly-receipt/static-build.json
      - name: Install support browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Budgets, compatibility smoke, and complete Chromium estate
        shell: bash
        run: |
          set -euo pipefail
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npx playwright test e2e/performance-budget.spec.ts --project desktop --project mobile 2>&1 | tee browser-assembly-receipt/performance.log
          npx playwright test e2e/support-smoke.spec.ts --config playwright.support.config.ts --project firefox-desktop-smoke --project webkit-desktop-smoke 2>&1 | tee browser-assembly-receipt/firefox-webkit.log
          npx playwright test 2>&1 | tee browser-assembly-receipt/complete-chromium.log
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game test-results
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-assembly-linux
          path: |
            ${{ runner.temp }}/browser-candidate.txt
            browser-assembly-receipt
          if-no-files-found: warn
          retention-days: 30

  hosted-edge:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derive the same carrier-free browser candidate
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$source_head"
          git fetch --no-tags origin release/browser-support-performance
          test "$(git rev-parse origin/release/browser-support-performance)" = "$BROWSER_DONOR_SHA"
          git checkout "$BROWSER_DONOR_SHA" -- \
            .github/workflows/browser-support-performance.yml \
            .github/workflows/canon-trace-status.yml \
            docs/SUPPORT_MATRIX.md \
            docs/canon/GODSCAR_CANON_TRACE.json \
            docs/canon/GODSCAR_CANON_TRACE.schema.json \
            docs/performance/RODOH_PERFORMANCE_BUDGETS.json \
            e2e/performance-budget.spec.ts \
            e2e/support-smoke.spec.ts \
            estate/CURRENT_ESTATE_STATUS.schema.json \
            estate/nvda-edge-acceptance.schema.json \
            package.json \
            playwright.support.config.ts \
            scripts/accessibility/Record-NvdaEdgeAcceptance.ps1 \
            scripts/estate/generate-current-status.mjs \
            scripts/performance/audit-static-build.mjs \
            src/world/brand/RodohRuntimeMark.tsx \
            src/world/pixel-ui/PixelIcon.tsx \
            tests/world/browser-support-performance.test.ts \
            tests/world/canon-trace.test.ts
          git rm .github/workflows/finalize-browser-support-assembly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Assemble browser support over exact release provenance' | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_AUTHOR_DATE="$FINAL_AUTHOR_DATE" \
            GIT_COMMITTER_DATE="$FINAL_AUTHOR_DATE" \
            git commit-tree "$tree" -p "$source_head")"
          git reset --hard "$commit"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$commit" | tee "$RUNNER_TEMP/browser-candidate.txt"
      - run: npm ci --no-audit --no-fund
      - name: Hosted Microsoft Edge and recorder parsing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force browser-edge-receipt | Out-Null
          npx playwright test e2e/support-smoke.spec.ts --config playwright.support.config.ts --project edge-desktop --project edge-mobile *>&1 | Tee-Object browser-edge-receipt\edge.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/accessibility/Record-NvdaEdgeAcceptance.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-assembly-hosted-edge
          path: |
            ${{ runner.temp }}/browser-candidate.txt
            browser-edge-receipt
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [linux-product, hosted-edge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Publish the exact carrier-free browser candidate
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin release/browser-support-performance
          test "$(git rev-parse origin/release/browser-support-performance)" = "$BROWSER_DONOR_SHA"
          git checkout "$BROWSER_DONOR_SHA" -- \
            .github/workflows/browser-support-performance.yml \
            .github/workflows/canon-trace-status.yml \
            docs/SUPPORT_MATRIX.md \
            docs/canon/GODSCAR_CANON_TRACE.json \
            docs/canon/GODSCAR_CANON_TRACE.schema.json \
            docs/performance/RODOH_PERFORMANCE_BUDGETS.json \
            e2e/performance-budget.spec.ts \
            e2e/support-smoke.spec.ts \
            estate/CURRENT_ESTATE_STATUS.schema.json \
            estate/nvda-edge-acceptance.schema.json \
            package.json \
            playwright.support.config.ts \
            scripts/accessibility/Record-NvdaEdgeAcceptance.ps1 \
            scripts/estate/generate-current-status.mjs \
            scripts/performance/audit-static-build.mjs \
            src/world/brand/RodohRuntimeMark.tsx \
            src/world/pixel-ui/PixelIcon.tsx \
            tests/world/browser-support-performance.test.ts \
            tests/world/canon-trace.test.ts
          git rm .github/workflows/finalize-browser-support-assembly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Assemble browser support over exact release provenance' | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_AUTHOR_DATE="$FINAL_AUTHOR_DATE" \
            GIT_COMMITTER_DATE="$FINAL_AUTHOR_DATE" \
            git commit-tree "$tree" -p "$source_head")"
          git push origin "$commit":qualify/browser-support-assembled-v1
          printf '%s\n' "$commit"
