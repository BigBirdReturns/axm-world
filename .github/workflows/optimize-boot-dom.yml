name: Optimize cold-shelf DOM

on:
  pull_request:
    paths:
      - '.github/workflows/optimize-boot-dom.yml'
  push:
    branches: [release/browser-support-performance]
    paths:
      - '.github/workflows/optimize-boot-dom.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-cold-shelf-dom
  cancel-in-progress: true

env:
  CI: 'true'
  PW_BASE_URL: http://127.0.0.1:5173

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Coalesce exact pixel grids into same-color SVG paths
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          icon = Path('src/world/pixel-ui/PixelIcon.tsx')
          text = icon.read_text()
          old = '''const OUTLINE_COLOR = "#1b1b1b";
          const DETAIL_COLOR = "#f6efe3";

          function PixelGlyph({ name }: { name: PixelIconName }): JSX.Element {
            const rows = GRIDS[name];
            const cells: JSX.Element[] = [];
            for (let y = 0; y < rows.length; y++) {
              const row = rows[y] ?? "";
              for (let x = 0; x < row.length; x++) {
                const ch = row[x];
                if (ch === ".") continue;
                const fill = ch === "o" ? OUTLINE_COLOR : ch === "w" ? DETAIL_COLOR : "currentColor";
                cells.push(<rect key={`${y}-${x}`} x={x} y={y} width={1} height={1} fill={fill} />);
              }
            }
            return (
              <svg viewBox="0 0 32 32" width="100%" height="100%" style={{ shapeRendering: "crispEdges", display: "block" }}>
                {cells}
              </svg>
            );
          }
          '''
          new = '''const OUTLINE_COLOR = "#1b1b1b";
          const DETAIL_COLOR = "#f6efe3";

          interface GlyphPaths {
            fill: string;
            outline: string;
            detail: string;
          }

          function pathForTone(rows: readonly string[], tone: "#" | "o" | "w"): string {
            const segments: string[] = [];
            for (let y = 0; y < rows.length; y += 1) {
              const row = rows[y] ?? "";
              for (let x = 0; x < row.length; x += 1) {
                if (row[x] === tone) segments.push(`M${x} ${y}h1v1h-1z`);
              }
            }
            return segments.join("");
          }

          // The source grids remain the exact pixel ledger. Coalescing each tone into
          // one path changes no coordinate or palette value while bounding browser DOM.
          const GLYPH_PATHS = Object.fromEntries(PIXEL_ICON_NAMES.map((name) => {
            const rows = GRIDS[name];
            return [name, {
              fill: pathForTone(rows, "#"),
              outline: pathForTone(rows, "o"),
              detail: pathForTone(rows, "w"),
            }] as const;
          })) as Record<PixelIconName, GlyphPaths>;

          function PixelGlyph({ name }: { name: PixelIconName }): JSX.Element {
            const paths = GLYPH_PATHS[name];
            return (
              <svg viewBox="0 0 32 32" width="100%" height="100%" style={{ shapeRendering: "crispEdges", display: "block" }}>
                {paths.fill && <path d={paths.fill} fill="currentColor" />}
                {paths.outline && <path d={paths.outline} fill={OUTLINE_COLOR} />}
                {paths.detail && <path d={paths.detail} fill={DETAIL_COLOR} />}
              </svg>
            );
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'PixelIcon renderer anchor count: {text.count(old)}')
          icon.write_text(text.replace(old, new))

          mark = Path('src/world/brand/RodohRuntimeMark.tsx')
          text = mark.read_text()
          old = '''type PaintedRootMarkToken = Exclude<RodohRootMarkToken, ".">;

          function paintedCells(): Array<{ x: number; y: number; token: PaintedRootMarkToken }> {
            const cells: Array<{ x: number; y: number; token: PaintedRootMarkToken }> = [];
            for (const [y, row] of RODOH_ROOT_MARK_MAP.entries()) {
              for (const [x, token] of [...row].entries()) {
                if (token === ".") continue;
                cells.push({ x, y, token: token as PaintedRootMarkToken });
              }
            }
            return cells;
          }

          const PAINTED_CELLS = paintedCells();
          '''
          new = '''type PaintedRootMarkToken = Exclude<RodohRootMarkToken, ".">;

          function rootPath(token: PaintedRootMarkToken): string {
            const segments: string[] = [];
            for (const [y, row] of RODOH_ROOT_MARK_MAP.entries()) {
              for (const [x, value] of [...row].entries()) {
                if (value === token) segments.push(`M${x} ${y}h1v1h-1z`);
              }
            }
            return segments.join("");
          }

          // Two paths preserve the frozen coordinate ledger and palette while avoiding
          // one DOM node for every transparent or painted source cell.
          const ROOT_PATHS = Object.freeze({ W: rootPath("W"), M: rootPath("M") });
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Rodoh path-source anchor count: {text.count(old)}')
          text = text.replace(old, new)
          old = '''      {PAINTED_CELLS.map(({ x, y, token }) => (
                  <rect key={`${x}-${y}`} x={x} y={y} width={1} height={1} fill={rootMarkColor(token) ?? undefined} />
                ))}
          '''
          new = '''      <path d={ROOT_PATHS.W} fill={rootMarkColor("W") ?? undefined} />
                <path d={ROOT_PATHS.M} fill={rootMarkColor("M") ?? undefined} />
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Rodoh glyph renderer anchor count: {text.count(old)}')
          text = text.replace(old, new)
          old = '''  const pixelWrapStyle: CSSProperties = {
              display: "grid",
              gridTemplateColumns: `repeat(${RODOH_ROOT_MARK_WIDTH}, ${cell}px)`,
              gridTemplateRows: `repeat(${RODOH_ROOT_MARK_HEIGHT}, ${cell}px)`,
              width: RODOH_ROOT_MARK_WIDTH * cell,
              height: RODOH_ROOT_MARK_HEIGHT * cell,
              gap: 0,
              background: RODOH_ROOT_MARK_PALETTE.charcoal,
              flex: "0 0 auto",
            };
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Rodoh span-wrapper anchor count: {text.count(old)}')
          text = text.replace(old, '')
          old = '''      <div style={pixelWrapStyle} aria-hidden="true">
                  {RODOH_ROOT_MARK_MAP.flatMap((row, y) => [...row].map((token, x) => (
                    <span
                      key={`${x}-${y}`}
                      style={{
                        width: cell,
                        height: cell,
                        background: rootMarkColor(token as RodohRootMarkToken) ?? "transparent",
                      }}
                    />
                  )))}
                </div>
          '''
          new = '''      <RodohDandelionGlyph size={RODOH_ROOT_MARK_WIDTH * cell} />
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Rodoh runtime renderer anchor count: {text.count(old)}')
          mark.write_text(text.replace(old, new))

          test = Path('tests/world/browser-support-performance.test.ts')
          text = test.read_text()
          anchor = '''  it("refuses every valid-looking acceptance receipt that names a different repository pair", () => {
          '''
          insert = '''  it("coalesces exact pixel ledgers instead of emitting one cold-shelf node per pixel", () => {
            const icons = readFileSync(resolve(ROOT, "src/world/pixel-ui/PixelIcon.tsx"), "utf8");
            const mark = readFileSync(resolve(ROOT, "src/world/brand/RodohRuntimeMark.tsx"), "utf8");
            expect(icons).toContain("const GLYPH_PATHS");
            expect(icons).toContain("pathForTone");
            expect(icons).not.toContain("cells.push(<rect");
            expect(mark).toContain("const ROOT_PATHS");
            expect(mark).toContain("<RodohDandelionGlyph size={RODOH_ROOT_MARK_WIDTH * cell} />");
            expect(mark).not.toContain("RODOH_ROOT_MARK_MAP.flatMap");
          });

          ''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f'performance test anchor count: {text.count(anchor)}')
          test.write_text(text.replace(anchor, insert))
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and exact asset contracts
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/browser-support-performance.test.ts tests/world/asset-standard.test.ts tests/world/rodoh-root-mark.test.ts
          npm test
      - name: Production build and unchanged cold-boot budget
        run: |
          set -euo pipefail
          npm run build
          npx playwright install --with-deps chromium
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npx playwright test e2e/performance-budget.spec.ts --project desktop --project mobile
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game test-results
          git diff --check
      - name: Publish the workflow-neutral optimization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/pixel-ui/PixelIcon.tsx src/world/brand/RodohRuntimeMark.tsx tests/world/browser-support-performance.test.ts
          git rm .github/workflows/optimize-boot-dom.yml
          git diff --cached --check
          git commit -m 'Coalesce exact pixel grids for the cold shelf'
          git push origin HEAD:release/browser-support-performance
