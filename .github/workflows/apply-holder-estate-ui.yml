name: Finalize holder-estate hardening

on:
  pull_request:
    paths:
      - '.github/workflows/apply-holder-estate-ui.yml'
  push:
    branches: [release/holder-estate-v1]
    paths:
      - '.github/workflows/apply-holder-estate-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-holder-estate-hardening
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      PW_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Check out exact holder-estate candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize and apply the reviewed hardening patch
        run: |
          set -euo pipefail
          cat .github/holder-hardening/patch-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/holder-hardening.patch
          printf '%s  %s\n' '06cc4de449af16c4e62a71c9edfff9139d2968a87b54c05138cc30df10786f9a' '/tmp/holder-hardening.patch' | sha256sum --check -
          git apply --check \
            --exclude=.github/workflows/apply-holder-estate-ui.yml \
            --exclude=.github/workflows/holder-estate.yml \
            /tmp/holder-hardening.patch
          git apply \
            --exclude=.github/workflows/apply-holder-estate-ui.yml \
            --exclude=.github/workflows/holder-estate.yml \
            /tmp/holder-hardening.patch
          rm -rf .github/holder-hardening
          git diff --check

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Bounded input, transaction, rollback, and localization contracts
        run: npm test -- tests/world/holder-estate.test.ts tests/world/locale.test.ts

      - name: Complete World regression suite
        run: npm test

      - name: Production build and clean source tree
        run: |
          set -euo pipefail
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile whole-holder journey
        run: |
          set -euo pipefail
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npx playwright test e2e/holder-estate.spec.ts

      - name: Publish permanent non-workflow bytes
        run: |
          set -euo pipefail
          rm -rf test-results holder-estate-receipt
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/HOLDER_ESTATE_V1.md \
            src/world/Player.tsx \
            src/world/components/HolderEstatePanel.tsx \
            src/world/holder-estate.ts \
            src/world/i18n/messages.ts \
            tests/world/holder-estate.test.ts
          git add -A .github/holder-hardening
          git diff --cached --check
          git commit -m 'Harden whole-holder estate transactions and input custody'
          git push origin HEAD:release/holder-estate-v1
