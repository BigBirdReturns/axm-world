name: UNDERDRAIN v2 settled-base recovery

on:
  push:
    branches:
      - recovery/underdrain-v2-base-1a6255
    paths:
      - '.github/workflows/underdrain-v2-base-recovery.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/underdrain-v2-base-recovery.yml'

permissions:
  contents: read

concurrency:
  group: underdrain-v2-settled-base-recovery
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact recovery carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Retain exact settled base as a Git bundle
        shell: bash
        env:
          EXPECTED_BASE: 1a6255d7dcff7b8e0096c49321f00d51d114a71c
          CARRIER: .github/workflows/underdrain-v2-base-recovery.yml
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD)" = "$CARRIER"
          git diff --check "$EXPECTED_BASE" HEAD
          git branch underdrain-v2-settled-base "$EXPECTED_BASE"
          bundle="$RUNNER_TEMP/UNDERDRAIN_v2_Settled_Base_1a6255d7.bundle"
          git bundle create "$bundle" underdrain-v2-settled-base
          git bundle verify "$bundle" | tee "$RUNNER_TEMP/bundle-verify.txt"
          sha256sum "$bundle" | tee "$RUNNER_TEMP/bundle.sha256"
          git show -s --format='%H %P %T %s' "$EXPECTED_BASE" | tee "$RUNNER_TEMP/base-identity.txt"

      - name: Upload exact settled-base bundle
        uses: actions/upload-artifact@v4
        with:
          name: underdrain-v2-settled-base-1a6255d7
          path: |
            ${{ runner.temp }}/UNDERDRAIN_v2_Settled_Base_1a6255d7.bundle
            ${{ runner.temp }}/bundle-verify.txt
            ${{ runner.temp }}/bundle.sha256
            ${{ runner.temp }}/base-identity.txt
          if-no-files-found: error
          retention-days: 30
