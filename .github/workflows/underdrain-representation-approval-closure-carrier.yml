name: UNDERDRAIN representation approval closure carrier

on:
  pull_request:
    branches:
      - feature/underdrain-unity6000-player-train-v1
    paths:
      - '.github/carriers/underdrain-representation-approval-closure-v1.part-*'
      - '.github/workflows/underdrain-representation-approval-closure-carrier.yml'

permissions:
  contents: write

concurrency:
  group: underdrain-representation-approval-closure-carrier
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact carrier branch
        uses: actions/checkout@v4
        with:
          ref: repair/underdrain-representation-approval-closure-v1
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify and materialize the bounded payload
        shell: bash
        env:
          BASE_SHA: 05db5401e055e74eecb28533ba2708f422479cc3
          PAYLOAD_SHA256: f69226d47cf2251257e761d7aa50cdbb083d112288645a67f1bc5da3f3464ab1
          PAYLOAD_PREFIX: .github/carriers/underdrain-representation-approval-closure-v1.part-
          CARRIER: .github/workflows/underdrain-representation-approval-closure-carrier.yml
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          cat > "$RUNNER_TEMP/expected-carrier-paths" <<'PATHS'
          .github/carriers/underdrain-representation-approval-closure-v1.part-00
          .github/carriers/underdrain-representation-approval-closure-v1.part-01
          .github/carriers/underdrain-representation-approval-closure-v1.part-02
          .github/carriers/underdrain-representation-approval-closure-v1.part-03
          .github/carriers/underdrain-representation-approval-closure-v1.part-04
          .github/carriers/underdrain-representation-approval-closure-v1.part-05
          .github/carriers/underdrain-representation-approval-closure-v1.part-06
          .github/carriers/underdrain-representation-approval-closure-v1.part-07
          .github/workflows/underdrain-representation-approval-closure-carrier.yml
          PATHS
          git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/observed-carrier-paths"
          diff -u "$RUNNER_TEMP/expected-carrier-paths" "$RUNNER_TEMP/observed-carrier-paths"

          cat "${PAYLOAD_PREFIX}00" "${PAYLOAD_PREFIX}01" "${PAYLOAD_PREFIX}02" "${PAYLOAD_PREFIX}03" "${PAYLOAD_PREFIX}04" "${PAYLOAD_PREFIX}05" "${PAYLOAD_PREFIX}06" "${PAYLOAD_PREFIX}07" > "$RUNNER_TEMP/payload.b64"
          base64 --decode "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/payload.tar.gz" | sha256sum --check --strict

          cat > "$RUNNER_TEMP/expected-payload-paths" <<'PATHS'
          .github/workflows/underdrain-player-product-acceptance-source.yml
          .github/workflows/underdrain-unity6000-player-source.yml
          docs/UNDERDRAIN_PRODUCTION_ASSET_APPROVAL.md
          scripts/accept-underdrain-player-product.ps1
          scripts/approve-underdrain-production-assets.ps1
          scripts/audit-underdrain-production-assets.ps1
          scripts/prepare-underdrain-production-assets.ps1
          scripts/run-underdrain-unity6000-player-product.ps1
          tests/world/underdrain-player-product-acceptance.test.ts
          tests/world/underdrain-unity6000-player-train.test.ts
          unity/Conformance/ActionProductionAssetUnityStubs.cs
          unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetApprovalBatch.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetAuditBatch.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetDigest.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetIntakeBatch.cs
          unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProductionAssetMarker.cs
          PATHS
          tar -tzf "$RUNNER_TEMP/payload.tar.gz" | LC_ALL=C sort > "$RUNNER_TEMP/observed-payload-paths"
          diff -u "$RUNNER_TEMP/expected-payload-paths" "$RUNNER_TEMP/observed-payload-paths"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/observed-payload-paths"; then
            echo 'Payload contains an unsafe path.' >&2
            exit 1
          fi

          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C .
          git diff --check

      - name: Qualify the materialized source transaction
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- \
            tests/world/underdrain-player-product-acceptance.test.ts \
            tests/world/underdrain-powershell-contract.test.ts \
            tests/world/underdrain-unity6000-player-train.test.ts \
            tests/world/action-natural-player.test.ts \
            tests/world/action-semantic-cue-receiver.test.ts \
            tests/world/action-unity-source-contract.test.ts
          dotnet build unity/Conformance/Axm.Rodoh.Action.Cues.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.Conformance.csproj --configuration Release
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          find unity/Conformance -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          git diff --check

      - name: Commit only the admitted representation-closure repair
        shell: bash
        env:
          BASE_SHA: 05db5401e055e74eecb28533ba2708f422479cc3
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- \
            .github/workflows/underdrain-player-product-acceptance-source.yml \
            .github/workflows/underdrain-unity6000-player-source.yml
          cat > "$RUNNER_TEMP/expected-final-paths" <<'PATHS'
          docs/UNDERDRAIN_PRODUCTION_ASSET_APPROVAL.md
          scripts/accept-underdrain-player-product.ps1
          scripts/approve-underdrain-production-assets.ps1
          scripts/audit-underdrain-production-assets.ps1
          scripts/prepare-underdrain-production-assets.ps1
          scripts/run-underdrain-unity6000-player-product.ps1
          tests/world/underdrain-player-product-acceptance.test.ts
          tests/world/underdrain-unity6000-player-train.test.ts
          unity/Conformance/ActionProductionAssetUnityStubs.cs
          unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetApprovalBatch.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetAuditBatch.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetDigest.cs
          unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetIntakeBatch.cs
          unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProductionAssetMarker.cs
          PATHS
          git add -- \
            docs/UNDERDRAIN_PRODUCTION_ASSET_APPROVAL.md \
            scripts/accept-underdrain-player-product.ps1 \
            scripts/approve-underdrain-production-assets.ps1 \
            scripts/audit-underdrain-production-assets.ps1 \
            scripts/prepare-underdrain-production-assets.ps1 \
            scripts/run-underdrain-unity6000-player-product.ps1 \
            tests/world/underdrain-player-product-acceptance.test.ts \
            tests/world/underdrain-unity6000-player-train.test.ts \
            unity/Conformance/ActionProductionAssetUnityStubs.cs \
            unity/Conformance/Axm.Rodoh.Action.AssetCustody.Source.csproj \
            unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetApprovalBatch.cs \
            unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetAuditBatch.cs \
            unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetDigest.cs \
            unity/Packages/com.axm.rodoh-action/Editor/ActionProductionAssetIntakeBatch.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProductionAssetMarker.cs
          git diff --cached --name-only HEAD | LC_ALL=C sort > "$RUNNER_TEMP/observed-final-paths"
          diff -u "$RUNNER_TEMP/expected-final-paths" "$RUNNER_TEMP/observed-final-paths"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Bind UNDERDRAIN approval to the exact representation closure"
          git push origin HEAD:repair/underdrain-representation-approval-closure-v1
