name: Unity natural action player

on:
  pull_request:
    paths:
      - '.github/workflows/unity-natural-player.yml'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionBufferedInput.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/IActionPresentationAdapter.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionPrimitivePresentation.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProductionPresentation.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCombatCamera.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionGameFeelController.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputRouter.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionMinimalHud.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionNaturalPlayerInput.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionRuntimeBehaviour.cs'
      - 'unity/Packages/com.axm.rodoh-action/Editor/ActionPolishAugmentBatch.cs'
      - 'unity/Conformance/Axm.Rodoh.Action.Conformance.csproj'
      - 'unity/Conformance/Program.cs'
      - 'tests/world/action-natural-player.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install exact JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Qualify player-plane source and complete TypeScript law
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- \
            tests/world/action-natural-player.test.ts \
            tests/world/action-unity-source-contract.test.ts

      - name: Prove buffered ingress in the dependency-free C# mirror
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-natural-player"
          dotnet run \
            --project unity/Conformance/Axm.Rodoh.Action.Conformance.csproj \
            --configuration Release \
            -- \
            unity/Fixtures/frog-pit.unity-action-spec.json \
            "$RUNNER_TEMP/unity-natural-player/conformance.json"
          grep -F '"naturalInputBuffer": true' "$RUNNER_TEMP/unity-natural-player/conformance.json"
          grep -F '"heldMechanismInput": true' "$RUNNER_TEMP/unity-natural-player/conformance.json"
          grep -F '"defensiveInputPriority": true' "$RUNNER_TEMP/unity-natural-player/conformance.json"

      - name: Retain exact source identity and cleanliness
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/unity-natural-player/world-head.txt"
          sha256sum \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionBufferedInput.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/IActionPresentationAdapter.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionPrimitivePresentation.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProductionPresentation.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionCombatCamera.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionNaturalPlayerInput.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputRouter.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionGameFeelController.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionMinimalHud.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionRuntimeBehaviour.cs \
            > "$RUNNER_TEMP/unity-natural-player/SHA256SUMS"
          git diff --check
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: unity-natural-action-player
          path: ${{ runner.temp }}/unity-natural-player
          if-no-files-found: error
          retention-days: 30
