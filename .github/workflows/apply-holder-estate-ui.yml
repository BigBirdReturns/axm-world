name: Apply holder-estate UI

# One-shot publication workflow. It commits the permanent binding and removes
# itself from the review candidate after the exact product qualification passes.
on:
  push:
    branches: [release/holder-estate-v1]
    paths:
      - '.github/workflows/apply-holder-estate-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-holder-estate-ui
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind the holder-estate surface and localization
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          player = Path('src/world/Player.tsx')
          text = player.read_text()
          import_line = 'import { HolderEstatePanel } from "./components/HolderEstatePanel.js";\n'
          if import_line not in text:
              anchor = 'import { CartridgeEnterTransition } from "./components/CartridgeEnterTransition.js";\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'Player import anchor count: {text.count(anchor)}')
              text = text.replace(anchor, anchor + import_line)
          panel = '        <HolderEstatePanel />\n\n'
          if panel not in text:
              anchor = '''        <p style={{ color: "#a59c8b", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, marginTop: 18 }}>
          {t("boot.footerNote")}
        </p>'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'Player footer anchor count: {text.count(anchor)}')
              text = text.replace(anchor, panel + anchor)
          player.write_text(text)

          messages = Path('src/world/i18n/messages.ts')
          text = messages.read_text()
          if '  | "boot.holderEstateHeading"' not in text:
              anchor = '  | "boot.openCartridge"'
              insert = '''  | "boot.openCartridge"
  | "boot.holderEstateHeading"
  | "boot.exportHolderEstate"
  | "boot.restoreHolderEstate"
  | "boot.holderEstateExported"
  | "boot.holderEstateRestored"
  | "boot.holderEstatePreflight"
  | "boot.holderEstateSummary"
  | "boot.holderEstateOpaque"
  | "boot.holderEstateMerge"
  | "boot.holderEstateReplace"
  | "boot.holderEstateCancel"
  | "boot.holderEstateFailed"'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'Message ID anchor count: {text.count(anchor)}')
              text = text.replace(anchor, insert)
          if '    "boot.holderEstateHeading": "Holder estate",' not in text:
              anchor = '    "boot.openCartridge": "Open cartridge…",'
              insert = '''    "boot.openCartridge": "Open cartridge…",
    "boot.holderEstateHeading": "Holder estate",
    "boot.exportHolderEstate": "Export holder estate",
    "boot.restoreHolderEstate": "Restore holder estate",
    "boot.holderEstateExported": (params) => `Holder estate exported · ${num(params, "count")} records.`,
    "boot.holderEstateRestored": (params) => `Holder estate restored · ${num(params, "count")} records. Reloading…`,
    "boot.holderEstatePreflight": "Holder-estate preflight",
    "boot.holderEstateSummary": (params) => `${num(params, "count")} records · add ${num(params, "add")} · change ${num(params, "change")} · exact-remove ${num(params, "remove")} · opaque ${num(params, "opaque")}`,
    "boot.holderEstateOpaque": (params) => `${num(params, "count")} opaque future namespace${num(params, "count") === 1 ? "" : "s"}`,
    "boot.holderEstateMerge": "Merge held records",
    "boot.holderEstateReplace": "Restore exactly",
    "boot.holderEstateCancel": "Cancel",
    "boot.holderEstateFailed": "Holder-estate operation failed:",'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'English message anchor count: {text.count(anchor)}')
              text = text.replace(anchor, insert)
          if '    "boot.holderEstateHeading": "持有者資產",' not in text:
              anchor = '    "boot.openCartridge": "開啟卡匣…",'
              insert = '''    "boot.openCartridge": "開啟卡匣…",
    "boot.holderEstateHeading": "持有者資產",
    "boot.exportHolderEstate": "匯出持有者資產",
    "boot.restoreHolderEstate": "還原持有者資產",
    "boot.holderEstateExported": (params) => `持有者資產已匯出 · ${num(params, "count")} 筆記錄。`,
    "boot.holderEstateRestored": (params) => `持有者資產已還原 · ${num(params, "count")} 筆記錄。正在重新載入…`,
    "boot.holderEstatePreflight": "持有者資產預檢",
    "boot.holderEstateSummary": (params) => `${num(params, "count")} 筆記錄 · 新增 ${num(params, "add")} · 變更 ${num(params, "change")} · 精確移除 ${num(params, "remove")} · 不透明 ${num(params, "opaque")}`,
    "boot.holderEstateOpaque": (params) => `${num(params, "count")} 個不透明的未來命名空間`,
    "boot.holderEstateMerge": "合併持有記錄",
    "boot.holderEstateReplace": "精確還原",
    "boot.holderEstateCancel": "取消",
    "boot.holderEstateFailed": "持有者資產操作失敗：",'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'zh-Hant message anchor count: {text.count(anchor)}')
              text = text.replace(anchor, insert)
          messages.write_text(text)
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify holder-estate law and product
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/holder-estate.test.ts tests/world/locale.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish permanent UI binding and remove carrier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/Player.tsx src/world/i18n/messages.ts
          git rm .github/workflows/apply-holder-estate-ui.yml
          git commit -m 'Expose whole-holder estate custody in Rodoh'
          git push origin HEAD:release/holder-estate-v1
