name: Finalize Gate 7 map semantics

on:
  push:
    branches: [codex/second-recension-books-1-3-clean]
    paths:
      - '.github/workflows/fix-gate7-map-semantics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-gate7-map-semantics
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bind the test to the map's actual recorded-state contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/gate7-clean-room.spec.ts')
          text = path.read_text()

          old = '''async function expectClearedMapNodes(page: Page, count: number): Promise<void> {
  await page.getByTestId("view-map").click();
  await expect(page.getByTestId("world-map")).toBeVisible();
  const cleared = page.getByTestId("world-map").locator('[data-status="cleared"]');
  await expect.poll(async () => cleared.count(), {
    message: `Expected ${count} cleared Orchard nodes after the committed run state propagated`,
    timeout: 30_000,
  }).toBe(count);
}'''
          new = '''async function revealMobileRepresentation(page: Page): Promise<void> {
  for (let attempt = 0; attempt < 3; attempt += 1) {
    if (await page.getByTestId("mobile-step-board").isVisible().catch(() => false)) return;
    const back = page.getByTestId("mobile-step-back");
    if (!(await back.isVisible().catch(() => false))) return;
    await back.click();
  }
}

async function expectClearedMapNodes(page: Page, count: number): Promise<void> {
  await page.getByTestId("view-map").click();
  await revealMobileRepresentation(page);
  const map = page.getByTestId("world-map");
  await expect(map).toBeVisible({ timeout: 15_000 });
  await expect(map.getByTestId("wm-progress")).toHaveAttribute("data-recorded", String(count));
  await expect(map.locator('[data-state="recorded"]')).toHaveCount(count);
}'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one map helper, found {text.count(old)}')
          text = text.replace(old, new)

          old_sequence = '''  await page.getByTestId("view-run-graph").click();
  await expect(page.getByTestId("contract-board")).toBeVisible();
  await page.getByTestId("view-map").click();
  await expect(page.getByTestId("world-map")).toBeVisible();
  await page.getByTestId("view-hall").click();
  await expect(page.getByTestId("hall-scene")).toBeVisible();
  await page.getByTestId("view-aperture").click();
  await expect(page.getByTestId("rodoh-aperture")).toBeVisible();
  await page.getByTestId("view-planet").click();
  await expect(page.getByTestId("walkable-world")).toBeVisible({ timeout: 20_000 });'''
          new_sequence = '''  await page.getByTestId("view-run-graph").click();
  await revealMobileRepresentation(page);
  await expect(page.getByTestId("contract-board")).toBeVisible();
  await page.getByTestId("view-map").click();
  await revealMobileRepresentation(page);
  await expect(page.getByTestId("world-map")).toBeVisible();
  await page.getByTestId("view-hall").click();
  await revealMobileRepresentation(page);
  await expect(page.getByTestId("hall-scene")).toBeVisible();
  await page.getByTestId("view-aperture").click();
  await revealMobileRepresentation(page);
  await expect(page.getByTestId("rodoh-aperture")).toBeVisible();
  await page.getByTestId("view-planet").click();
  await revealMobileRepresentation(page);
  await expect(page.getByTestId("walkable-world")).toBeVisible({ timeout: 20_000 });'''
          if text.count(old_sequence) != 1:
              raise SystemExit(f'expected one representation sequence, found {text.count(old_sequence)}')
          path.write_text(text.replace(old_sequence, new_sequence))
          PY
          git diff --check
      - name: Qualify the exact Gate 7 journey
        run: |
          npm run typecheck
          npm test -- tests/world/gate7-clean-room.test.ts
          npm run build
          npx playwright install --with-deps chromium
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npm run test:e2e -- e2e/gate7-clean-room.spec.ts
      - name: Publish permanent acceptance correction
        run: |
          git restore --source=HEAD --staged --worktree -- docs/game 2>/dev/null || true
          git clean -fdx -- docs/game 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/gate7-clean-room.spec.ts
          git commit -m "Assert Gate 7 against recorded map semantics"
          git push origin HEAD:codex/second-recension-books-1-3-clean
