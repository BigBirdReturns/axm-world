name: Harvest exact v1 receipt-validator failure

on:
  pull_request:
    paths:
      - '.github/workflows/harvest-v1-receipt-validator-failure.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-24.04
    steps:
      - name: Download failed-step log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt-validator-diagnostic"
          gh run view 30216927953 \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed \
            > "$RUNNER_TEMP/receipt-validator-diagnostic/failure.log"
          test -s "$RUNNER_TEMP/receipt-validator-diagnostic/failure.log"
      - uses: actions/upload-artifact@v4
        with:
          name: v1-receipt-validator-failure
          path: ${{ runner.temp }}/receipt-validator-diagnostic
          if-no-files-found: error
          retention-days: 7
