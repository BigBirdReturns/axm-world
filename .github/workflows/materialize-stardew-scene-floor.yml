name: Materialize Stardew scene floor

on:
  push:
    branches:
      - 'agent/stardew-host-seam-commodity-v1'
    paths:
      - 'labs/stardew-scene-floor-v0.2.0-bootstrap/**'
      - '.github/workflows/materialize-stardew-scene-floor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-stardew-scene-floor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-qualify:
    if: github.repository == 'BigBirdReturns/axm-world'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize content-addressed reviewable source
        run: node ./labs/stardew-scene-floor-v0.2.0-bootstrap/materialize.mjs
      - name: Verify source custody
        working-directory: labs/stardew-scene-floor-v0.2.0
        run: npm run verify-source
      - name: Check JavaScript sources
        working-directory: labs/stardew-scene-floor-v0.2.0
        run: npm run check
      - name: Run admission and refusal contracts
        working-directory: labs/stardew-scene-floor-v0.2.0
        run: npm test
      - name: Run bounded selftest
        working-directory: labs/stardew-scene-floor-v0.2.0
        run: npm run selftest
      - name: Commit the reviewable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/stardew-scene-floor-v0.2.0 .github/workflows/stardew-scene-floor.yml
          if git diff --cached --quiet; then
            echo 'The reviewable Stardew scene floor already matches the verified carrier.'
            exit 0
          fi
          git commit -m 'Fan out Stardew scene commodity floor'
          git push origin "HEAD:${GITHUB_REF_NAME}"
