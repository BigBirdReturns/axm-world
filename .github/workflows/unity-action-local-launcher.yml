name: Unity action local launcher

on:
  pull_request:
    paths:
      - 'scripts/run-first-charter-action.ps1'
      - 'scripts/complete-embodied-action-session.ps1'
      - 'scripts/generate-unity-action-production.ps1'
      - 'scripts/run-unity-action-estate.ps1'
      - 'scripts/run-unity-action-estate-v2.ps1'
      - 'scripts/run-unity-action-estate-v3.ps1'
      - 'scripts/build-unity-action-player.ps1'
      - 'scripts/build-unity-action-quest.ps1'
      - 'unity/Packages/com.axm.rodoh-action/Editor/ActionGovernedProductionBatch.cs'
      - 'unity/Packages/com.axm.rodoh-action/Editor/ActionGovernedMotionAugmentBatch.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProductionPresentation.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProceduralMotionDriver.cs'
      - 'docs/FIRST_CHARTER_ACTION_LOCAL_ACCEPTANCE.md'
      - 'tests/world/action-local-launcher.test.ts'
      - 'tests/world/action-unity-source-contract.test.ts'
      - '.github/workflows/unity-action-local-launcher.yml'
  push:
    branches:
      - feature/action-runtime-v1
    paths:
      - 'scripts/run-first-charter-action.ps1'
      - 'scripts/complete-embodied-action-session.ps1'
      - 'scripts/generate-unity-action-production.ps1'
      - 'scripts/run-unity-action-estate.ps1'
      - 'scripts/run-unity-action-estate-v2.ps1'
      - 'scripts/run-unity-action-estate-v3.ps1'
      - 'scripts/build-unity-action-player.ps1'
      - 'scripts/build-unity-action-quest.ps1'
      - 'unity/Packages/com.axm.rodoh-action/Editor/ActionGovernedProductionBatch.cs'
      - 'unity/Packages/com.axm.rodoh-action/Editor/ActionGovernedMotionAugmentBatch.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProductionPresentation.cs'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionProceduralMotionDriver.cs'
      - 'docs/FIRST_CHARTER_ACTION_LOCAL_ACCEPTANCE.md'
      - 'tests/world/action-local-launcher.test.ts'
      - 'tests/world/action-unity-source-contract.test.ts'
      - '.github/workflows/unity-action-local-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-action-local-launcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  ARC_ACTION_AUTHORITY_SHA: 6eef311836ee7cb3a43a94ce51f448a2699c3b04

jobs:
  windows-contract:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record exact World identity
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Expected $expected, checked out $actual." }
          if (git status --porcelain) { throw 'World checkout is dirty.' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\launcher-receipt" | Out-Null
          Set-Content -Encoding utf8 "$env:RUNNER_TEMP\launcher-receipt\candidate-sha.txt" $actual
      - run: npm ci --no-audit --no-fund
      - name: Parse every maintained PowerShell action runner
        shell: pwsh
        run: |
          $paths = @(
            'scripts/run-first-charter-action.ps1',
            'scripts/complete-embodied-action-session.ps1',
            'scripts/generate-unity-action-production.ps1',
            'scripts/run-unity-action-estate.ps1',
            'scripts/run-unity-action-estate-v2.ps1',
            'scripts/run-unity-action-estate-v3.ps1',
            'scripts/build-unity-action-player.ps1',
            'scripts/build-unity-action-quest.ps1'
          )
          $results = @()
          $failures = @()
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $errorRecords = @($errors | ForEach-Object {
              [ordered]@{
                message = $_.Message
                startLine = $_.Extent.StartLineNumber
                startColumn = $_.Extent.StartColumnNumber
                text = $_.Extent.Text
                errorId = $_.ErrorId
              }
            })
            $results += [ordered]@{
              path = $path
              parseErrors = $errorRecords.Count
              errors = $errorRecords
            }
            if ($errorRecords.Count -gt 0) { $failures += $path }
          }
          $receipt = [ordered]@{
            format = 'rodoh-unity-action-local-launcher-qualification/1'
            status = if ($failures.Count -eq 0) { 'pass' } else { 'fail' }
            worldCandidate = (git rev-parse HEAD).Trim()
            arcActionAuthorityCommit = $env:ARC_ACTION_AUTHORITY_SHA
            operatingSystem = [Environment]::OSVersion.VersionString
            powershell = $PSVersionTable.PSVersion.ToString()
            scripts = $results
          }
          $receiptPath = "$env:RUNNER_TEMP\launcher-receipt\powershell.json"
          $receipt | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 $receiptPath
          if ($failures.Count -gt 0) {
            Get-Content -Raw $receiptPath | Write-Error
            throw "PowerShell parse errors remain in: $($failures -join ', ')"
          }
      - name: Run the launcher, governed-production, and complete World contracts
        shell: pwsh
        run: |
          npm test -- tests/world/action-local-launcher.test.ts tests/world/action-unity-source-contract.test.ts *>&1 | Tee-Object "$env:RUNNER_TEMP\launcher-receipt\focused.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test *>&1 | Tee-Object "$env:RUNNER_TEMP\launcher-receipt\complete.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if (git status --porcelain) { throw 'World checkout changed during launcher qualification.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rodoh-unity-action-local-launcher
          path: ${{ runner.temp }}/launcher-receipt
          if-no-files-found: warn
          retention-days: 30
