name: Materialize MotionDeck Stardew cabinet runtime

on:
  pull_request:
    paths:
      - 'labs/motiondeck-stardew-cabinet-runtime-v0.1.0-bootstrap/**'
      - '.github/workflows/materialize-motiondeck-stardew-cabinet-runtime.yml'
  push:
    branches:
      - 'agent/stardew-host-seam-commodity-v1'
    paths:
      - 'labs/motiondeck-stardew-cabinet-runtime-v0.1.0-bootstrap/**'
      - '.github/workflows/materialize-motiondeck-stardew-cabinet-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-motiondeck-stardew-cabinet-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/axm-world' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize content-addressed source
        run: node ./labs/motiondeck-stardew-cabinet-runtime-v0.1.0-bootstrap/materialize.mjs
      - name: Verify source custody
        working-directory: labs/motiondeck-stardew-cabinet-runtime-v0.1.0
        run: npm run verify-source
      - name: Check source and protocol contracts
        working-directory: labs/motiondeck-stardew-cabinet-runtime-v0.1.0
        run: npm run check
      - name: Run admission and refusal contracts
        working-directory: labs/motiondeck-stardew-cabinet-runtime-v0.1.0
        run: npm test
      - name: Run bounded source transaction
        working-directory: labs/motiondeck-stardew-cabinet-runtime-v0.1.0
        run: npm run selftest
      - name: Commit ordinary reviewable source when absent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/motiondeck-stardew-cabinet-runtime-v0.1.0
          if git diff --cached --quiet; then
            echo 'The ordinary MotionDeck Stardew cabinet runtime already matches the verified carrier.'
            exit 0
          fi
          git commit -m 'Materialize MotionDeck Stardew cabinet runtime source'
          git push origin "HEAD:${TARGET_BRANCH}"
