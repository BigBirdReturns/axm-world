name: Repair Gate 6 browser resolution

on:
  push:
    branches: [release/local-estate-replication]
    paths:
      - '.github/workflows/repair-gate6-browser-resolution.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-gate6-browser-resolution
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/local-estate-replication
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore the exact reviewed verifier and patch only executable resolution
        run: |
          set -euo pipefail
          git show 12b0aeb3c6f955070c979e97d13f3bcdd8de6e30:scripts/verify-relief-circuit-gate6.mjs > scripts/verify-relief-circuit-gate6.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-relief-circuit-gate6.mjs')
          source = path.read_text()
          old = 'const CHROMIUM = process.env.PW_CHROMIUM_PATH ?? "/usr/bin/chromium";'
          new = '''// Permanent CI may pin an explicit executable. Local-estate runs bind
          // PLAYWRIGHT_BROWSERS_PATH to their holder-owned cache, so ask Playwright for
          // the exact installed browser rather than falling through to a Linux-only path.
          const CHROMIUM = process.env.PW_CHROMIUM_PATH ?? chromium.executablePath();'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one Chromium fallback, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          test "$(git diff --numstat -- scripts/verify-relief-circuit-gate6.mjs | awk '{print $1":"$2}')" = '4:1'
      - run: npm ci --no-audit --no-fund
      - name: Qualify the repaired boundary
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/gate6-review-regressions.test.ts
      - name: Publish the exact non-workflow repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-relief-circuit-gate6.mjs
          git diff --cached --check
          git commit -m 'Resolve holder-cached Chromium in the Gate 6 verifier'
          git push origin HEAD:release/local-estate-replication
