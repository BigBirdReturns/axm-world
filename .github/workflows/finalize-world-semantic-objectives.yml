name: Finalize World semantic action objectives

# Observable child-carrier qualification. Publication remains fail-closed.
on:
  pull_request:
    paths:
      - '.github/workflows/finalize-world-semantic-objectives.yml'
  push:
    branches:
      - feature/action-semantic-objectives-v1
    paths:
      - '.github/workflows/finalize-world-semantic-objectives.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-world-semantic-action-objectives
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Integrate runtime-1.1 law into the dependency-free C# receiver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new)

          contract_path = Path('unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionContract.cs')
          contract = contract_path.read_text()
          contract = replace_once(
              contract,
              '''        public const string RuntimeVersion = "1.0.0";
        public const int TickRate = 30;
        public const int ButtonMask = 15;

        public const int Light = 1;
        public const int Heavy = 2;
        public const int Dodge = 4;
        public const int Parry = 8;
''',
              '''        public const string RuntimeVersion = "1.0.0";
        public const string SemanticRuntimeVersion = "1.1.0";
        public const int TickRate = 30;
        public const int ButtonMask = 31;

        public const int Light = 1;
        public const int Heavy = 2;
        public const int Dodge = 4;
        public const int Parry = 8;
        public const int Interact = 16;

        public static bool IsRuntimeVersion(string value)
        {
            return value == RuntimeVersion || value == SemanticRuntimeVersion;
        }
''',
              'action constants',
          )
          contract = replace_once(
              contract,
              '''    [Serializable]
    public sealed class ActionObjectiveSpec
''',
              '''    [Serializable]
    public sealed class ActionObjectiveTarget
    {
        public string id = string.Empty;
        public int x;
        public int y;
        public int radius;
    }

    [Serializable]
    public sealed class ActionObjectiveSemanticCompletion
    {
        public string kind = string.Empty;
        public int targetCount;
        public int targetTicks;
        public ActionObjectiveTarget[] targets = Array.Empty<ActionObjectiveTarget>();
        public ActionObjectiveTarget target;
    }

    [Serializable]
    public sealed class ActionObjectiveSpec
''',
              'semantic contract classes',
          )
          contract = replace_once(
              contract,
              '''        public string failureKind = string.Empty;
        public double severity;
''',
              '''        public string failureKind = string.Empty;
        public double severity;
        public ActionObjectiveSemanticCompletion semanticCompletion;
''',
              'objective semantic field',
          )
          contract = replace_once(
              contract,
              '            if (runtimeVersion != ActionContract.RuntimeVersion) errors.Add("Unsupported action runtime version.");\n',
              '            if (!ActionContract.IsRuntimeVersion(runtimeVersion)) errors.Add("Unsupported action runtime version.");\n',
              'runtime validation',
          )
          contract = replace_once(
              contract,
              '''            var objectiveIds = new HashSet<string>(StringComparer.Ordinal);
            if (objectives == null || objectives.Length == 0) errors.Add("Action encounter has no objectives.");
''',
              '''            var objectiveIds = new HashSet<string>(StringComparer.Ordinal);
            var semanticObjectives = 0;
            if (objectives == null || objectives.Length == 0) errors.Add("Action encounter has no objectives.");
''',
              'semantic objective counter',
          )
          contract = replace_once(
              contract,
              '''                    if (objective == null || !ActionContract.IsEnemyKit(objective.enemyKit) || !enemyIds.Contains(objective.enemyKit)) errors.Add("Action objective references an unavailable enemy law.");
                    if (objective == null || objective.enemyCount < 1 || objective.enemyCount > 12 || objective.targetDefeats < 1 || objective.targetDefeats > objective.enemyCount) errors.Add("Action objective population is outside the v1 bound.");
                    if (objective != null && (double.IsNaN(objective.severity) || double.IsInfinity(objective.severity) || objective.severity < 0 || objective.severity > 1)) errors.Add("Action objective severity is invalid.");
''',
              '''                    if (objective == null || !ActionContract.IsEnemyKit(objective.enemyKit) || !enemyIds.Contains(objective.enemyKit)) errors.Add("Action objective references an unavailable enemy law.");
                    if (objective != null && objective.semanticCompletion == null)
                    {
                        if (objective.enemyCount < 1 || objective.enemyCount > 12 || objective.targetDefeats < 1 || objective.targetDefeats > objective.enemyCount) errors.Add("Legacy action objective population is outside the v1 bound.");
                    }
                    else if (objective != null && (objective.enemyCount < 0 || objective.enemyCount > 12 || objective.targetDefeats < 0 || objective.targetDefeats > objective.enemyCount))
                    {
                        errors.Add("Semantic action objective pressure population is outside the v1.1 bound.");
                    }
                    if (objective != null && (double.IsNaN(objective.severity) || double.IsInfinity(objective.severity) || objective.severity < 0 || objective.severity > 1)) errors.Add("Action objective severity is invalid.");
''',
              'population validation',
          )
          contract = replace_once(
              contract,
              '''                    if (objective != null && (double.IsNaN(objective.severity) || double.IsInfinity(objective.severity) || objective.severity < 0 || objective.severity > 1)) errors.Add("Action objective severity is invalid.");
''',
              '''                    if (objective != null && (double.IsNaN(objective.severity) || double.IsInfinity(objective.severity) || objective.severity < 0 || objective.severity > 1)) errors.Add("Action objective severity is invalid.");
                    if (objective != null && objective.semanticCompletion != null)
                    {
                        semanticObjectives += 1;
                        if (runtimeVersion == ActionContract.RuntimeVersion) errors.Add("Action runtime 1.0 cannot carry semantic objective law.");
                        var semantic = objective.semanticCompletion;
                        var arenaRadius = arena == null ? 0 : arena.radius;
                        if (semantic.kind == "interact_count")
                        {
                            if (semantic.targetCount < 1 || semantic.targetCount > 16) errors.Add("Interact objective target count is outside the v1.1 bound.");
                            if (semantic.targets == null || semantic.targets.Length != semantic.targetCount) errors.Add("Interact objective target set does not match targetCount.");
                            var targetIds = new HashSet<string>(StringComparer.Ordinal);
                            foreach (var target in semantic.targets ?? Array.Empty<ActionObjectiveTarget>())
                            {
                                if (target == null || string.IsNullOrWhiteSpace(target.id)) errors.Add("Interact objective target identity is absent.");
                                else if (!targetIds.Add(target.id)) errors.Add("Interact objective target identity is duplicated.");
                                if (target == null || target.radius < 300 || target.radius > 3000) errors.Add("Interact objective target radius is outside the v1.1 bound.");
                                if (target != null && (Math.Abs(target.x) > arenaRadius || Math.Abs(target.y) > arenaRadius)) errors.Add("Interact objective target lies outside the arena.");
                            }
                        }
                        else if (semantic.kind == "hold_ticks")
                        {
                            if (semantic.targetTicks < 1 || semantic.targetTicks > 18000) errors.Add("Hold objective duration is outside the v1.1 bound.");
                            if (semantic.target == null || string.IsNullOrWhiteSpace(semantic.target.id)) errors.Add("Hold objective target identity is absent.");
                            if (semantic.target == null || semantic.target.radius < 300 || semantic.target.radius > 3000) errors.Add("Hold objective target radius is outside the v1.1 bound.");
                            if (semantic.target != null && (Math.Abs(semantic.target.x) > arenaRadius || Math.Abs(semantic.target.y) > arenaRadius)) errors.Add("Hold objective target lies outside the arena.");
                        }
                        else errors.Add("Unknown semantic objective completion law.");
                    }
''',
              'semantic objective validation',
          )
          contract = replace_once(
              contract,
              '''                }
            }

            if (completion == null || (completion.kind != "clear" && completion.kind != "survive")) errors.Add("Unknown action completion law.");
''',
              '''                }
            }
            if (runtimeVersion == ActionContract.SemanticRuntimeVersion && semanticObjectives == 0) errors.Add("Action runtime 1.1 requires at least one semantic objective.");

            if (completion == null || (completion.kind != "clear" && completion.kind != "survive")) errors.Add("Unknown action completion law.");
''',
              'runtime semantic requirement',
          )
          contract = replace_once(
              contract,
              '''        public int target;
        public bool completed;
''',
              '''        public int target;
        public bool completed;
        public string kind;
        public int progress;
''',
              'semantic progress fields',
          )
          contract = replace_once(
              contract,
              '''        public int dodgedAttacks;
        public int enemiesDefeated;
''',
              '''        public int dodgedAttacks;
        public int enemiesDefeated;
        public int objectiveInteractions;
        public int objectiveHoldTicks;
''',
              'semantic stats',
          )
          contract = replace_once(
              contract,
              '''        public string outcome;
        public int damage;
''',
              '''        public string outcome;
        public string targetId;
        public int progress;
        public int target;
        public int damage;
''',
              'semantic events',
          )
          contract = replace_once(
              contract,
              '''        public readonly List<string> completedObjectiveIds = new List<string>();
        public ActionStats stats = new ActionStats();
''',
              '''        public readonly List<string> completedObjectiveIds = new List<string>();
        public readonly Dictionary<string, int> objectiveProgress = new Dictionary<string, int>(StringComparer.Ordinal);
        public readonly HashSet<string> completedInteractionTargetIds = new HashSet<string>(StringComparer.Ordinal);
        public ActionStats stats = new ActionStats();
''',
              'semantic state custody',
          )
          contract_path.write_text(contract)

          kernel_path = Path('unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs')
          kernel = kernel_path.read_text()
          kernel = replace_once(
              kernel,
              '''            StepEnemies(spec, state);
            state.tick += 1;
            state.previousButtons = input.buttons;
            AdvanceWave(spec, state);
''',
              '''            StepEnemies(spec, state);
            state.tick += 1;
            StepSemanticObjective(spec, state, input);
            state.previousButtons = input.buttons;
            AdvanceWave(spec, state);
''',
              'semantic fixed-step order',
          )
          helper = '''        private static bool WithinTarget(ActionSimulationState state, ActionObjectiveTarget target)
        {
            return target != null && DistanceSquared(state.player.x, state.player.y, target.x, target.y) <= (long)target.radius * target.radius;
        }

        private static void StepSemanticObjective(ActionSpecProjection spec, ActionSimulationState state, ActionInputFrame input)
        {
            if (state.activeObjectiveIndex < 0 || state.activeObjectiveIndex >= spec.objectives.Length) return;
            var objective = spec.objectives[state.activeObjectiveIndex];
            var semantic = objective.semanticCompletion;
            if (semantic == null) return;
            state.objectiveProgress.TryGetValue(objective.id, out var amount);
            string targetId = null;
            if (semantic.kind == "interact_count")
            {
                var rising = (input.buttons & ActionContract.Interact) != 0 && (state.previousButtons & ActionContract.Interact) == 0;
                if (!rising) return;
                ActionObjectiveTarget selected = null;
                foreach (var target in semantic.targets ?? Array.Empty<ActionObjectiveTarget>())
                {
                    if (target == null || state.completedInteractionTargetIds.Contains(target.id) || !WithinTarget(state, target)) continue;
                    selected = target;
                    break;
                }
                if (selected == null) return;
                state.completedInteractionTargetIds.Add(selected.id);
                amount = 0;
                foreach (var target in semantic.targets ?? Array.Empty<ActionObjectiveTarget>())
                {
                    if (target != null && state.completedInteractionTargetIds.Contains(target.id)) amount += 1;
                }
                targetId = selected.id;
                state.stats.objectiveInteractions += 1;
            }
            else if (semantic.kind == "hold_ticks")
            {
                if ((input.buttons & ActionContract.Interact) == 0 || !WithinTarget(state, semantic.target)) return;
                amount = Math.Min(semantic.targetTicks, amount + 1);
                targetId = semantic.target.id;
                state.stats.objectiveHoldTicks += 1;
            }
            else return;
            state.objectiveProgress[objective.id] = amount;
            state.events.Add(new ActionEvent
            {
                type = "objective_progress",
                objectiveId = objective.id,
                targetId = targetId,
                progress = amount,
                target = semantic.kind == "interact_count" ? semantic.targetCount : semantic.targetTicks
            });
        }

        private static bool ObjectiveComplete(ActionSimulationState state, ActionObjectiveSpec objective)
        {
            var semantic = objective.semanticCompletion;
            if (semantic == null)
            {
                foreach (var enemy in state.enemies)
                {
                    if (enemy.objectiveId == objective.id && enemy.mode != ActionEnemyMode.Defeated) return false;
                }
                return true;
            }
            state.objectiveProgress.TryGetValue(objective.id, out var amount);
            return semantic.kind == "interact_count"
                ? amount >= semantic.targetCount
                : amount >= semantic.targetTicks;
        }

'''
          kernel = replace_once(
              kernel,
              '        private static void AdvanceWave(ActionSpecProjection spec, ActionSimulationState state)\n',
              helper + '        private static void AdvanceWave(ActionSpecProjection spec, ActionSimulationState state)\n',
              'semantic kernel helpers',
          )
          kernel = replace_once(
              kernel,
              '''        {
            foreach (var enemy in state.enemies)
            {
                if (enemy.mode != ActionEnemyMode.Defeated) return;
            }
            if (state.activeObjectiveIndex < 0 || state.activeObjectiveIndex >= spec.objectives.Length) return;

            var objective = spec.objectives[state.activeObjectiveIndex];
''',
              '''        {
            if (state.activeObjectiveIndex < 0 || state.activeObjectiveIndex >= spec.objectives.Length) return;

            var objective = spec.objectives[state.activeObjectiveIndex];
            if (!ObjectiveComplete(state, objective)) return;
''',
              'semantic wave completion',
          )
          kernel, count = re.subn(
              r'        private static ActionObjectiveProgress\[\] ObjectiveProgress\(ActionSpecProjection spec, ActionSimulationState state\)\n        \{.*?\n        \}\n\n        private static void ClassifyTerminal',
              '''        private static ActionObjectiveProgress[] ObjectiveProgress(ActionSpecProjection spec, ActionSimulationState state)
        {
            var progress = new ActionObjectiveProgress[spec.objectives.Length];
            for (var index = 0; index < spec.objectives.Length; index += 1)
            {
                var objective = spec.objectives[index];
                var completed = state.completedObjectiveIds.Contains(objective.id);
                if (objective.semanticCompletion != null)
                {
                    state.objectiveProgress.TryGetValue(objective.id, out var amount);
                    var target = objective.semanticCompletion.kind == "interact_count"
                        ? objective.semanticCompletion.targetCount
                        : objective.semanticCompletion.targetTicks;
                    progress[index] = new ActionObjectiveProgress
                    {
                        id = objective.id,
                        defeated = completed ? target : amount,
                        target = target,
                        completed = completed,
                        kind = objective.semanticCompletion.kind,
                        progress = completed ? target : amount
                    };
                    continue;
                }
                if (completed)
                {
                    progress[index] = new ActionObjectiveProgress
                    {
                        id = objective.id,
                        defeated = objective.targetDefeats,
                        target = objective.targetDefeats,
                        completed = true
                    };
                    continue;
                }
                if (index != state.activeObjectiveIndex)
                {
                    progress[index] = new ActionObjectiveProgress
                    {
                        id = objective.id,
                        defeated = 0,
                        target = objective.targetDefeats,
                        completed = false
                    };
                    continue;
                }
                var living = 0;
                foreach (var enemy in state.enemies)
                {
                    if (enemy.objectiveId == objective.id && enemy.mode != ActionEnemyMode.Defeated) living += 1;
                }
                progress[index] = new ActionObjectiveProgress
                {
                    id = objective.id,
                    defeated = Math.Max(0, objective.enemyCount - living),
                    target = objective.targetDefeats,
                    completed = false
                };
            }
            return progress;
        }

        private static void ClassifyTerminal''',
              kernel,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'semantic objective projection: expected one function, found {count}')
          kernel_path.write_text(kernel)

          trace_path = Path('unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionTrace.cs')
          trace = trace_path.read_text()
          trace = replace_once(
              trace,
              '''            text.Append("completed:").Append(string.Join(",", completed)).Append('\n');
            text.Append("stats:").Append(state.stats.hitsLanded).Append(',').Append(state.stats.heavyHits).Append(',')
                .Append(state.stats.damageTaken).Append(',').Append(state.stats.parries).Append(',')
                .Append(state.stats.dodgedAttacks).Append(',').Append(state.stats.enemiesDefeated).Append('\n');
''',
              '''            text.Append("completed:").Append(string.Join(",", completed)).Append('\n');
            if (spec.runtimeVersion == ActionContract.SemanticRuntimeVersion)
            {
                var progressIds = new List<string>(state.objectiveProgress.Keys);
                progressIds.Sort(StringComparer.Ordinal);
                foreach (var id in progressIds) text.Append("progress:").Append(id).Append('=').Append(state.objectiveProgress[id]).Append('\n');
                var targetIds = new List<string>(state.completedInteractionTargetIds);
                targetIds.Sort(StringComparer.Ordinal);
                text.Append("interaction-targets:").Append(string.Join(",", targetIds)).Append('\n');
            }
            text.Append("stats:").Append(state.stats.hitsLanded).Append(',').Append(state.stats.heavyHits).Append(',')
                .Append(state.stats.damageTaken).Append(',').Append(state.stats.parries).Append(',')
                .Append(state.stats.dodgedAttacks).Append(',').Append(state.stats.enemiesDefeated);
            if (spec.runtimeVersion == ActionContract.SemanticRuntimeVersion)
                text.Append(',').Append(state.stats.objectiveInteractions).Append(',').Append(state.stats.objectiveHoldTicks);
            text.Append('\n');
''',
              'semantic state fingerprint',
          )
          trace = replace_once(
              trace,
              '''            return new ActionExecutionCandidate
            {
                arcDigest = spec.sourceArcDigest,
''',
              '''            return new ActionExecutionCandidate
            {
                runtimeVersion = spec.runtimeVersion,
                arcDigest = spec.sourceArcDigest,
''',
              'candidate runtime custody',
          )
          trace_path.write_text(trace)

          router_path = Path('unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputRouter.cs')
          router = router_path.read_text()
          router = replace_once(
              router,
              '''        public void PressDodge() => Latch(ActionContract.Dodge);
        public void PressParry() => Latch(ActionContract.Parry);
''',
              '''        public void PressDodge() => Latch(ActionContract.Dodge);
        public void PressParry() => Latch(ActionContract.Parry);
        public void PressInteract() => Latch(ActionContract.Interact);
''',
              'interact input ingress',
          )
          router = replace_once(
              router,
              '''                if (Input.GetKeyDown(KeyCode.Space)) Latch(ActionContract.Dodge);
                if (Input.GetKeyDown(KeyCode.L)) Latch(ActionContract.Parry);
''',
              '''                if (Input.GetKeyDown(KeyCode.Space)) Latch(ActionContract.Dodge);
                if (Input.GetKeyDown(KeyCode.L)) Latch(ActionContract.Parry);
                if (Input.GetKeyDown(KeyCode.E)) Latch(ActionContract.Interact);
''',
              'desktop interact ingress',
          )
          router_path.write_text(router)
          PY
          git diff --check

      - run: npm ci --no-audit --no-fund

      - name: Compile and qualify the exact receiver
        shell: bash
        run: |
          set -euo pipefail
          dotnet build unity/Conformance/Axm.Rodoh.Action.Conformance.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.ArcParity.csproj --configuration Release
          dotnet build unity/Conformance/Axm.Rodoh.Action.SemanticParity.csproj --configuration Release
          npm run typecheck
          npm test -- \
            tests/world/action-semantic-objective-contract.test.ts \
            tests/world/action-unity-source-contract.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check

      - name: Publish only permanent runtime-1.1 receiver changes
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin feature/action-semantic-objectives-v1
          test "$(git rev-parse origin/feature/action-semantic-objectives-v1)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionContract.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionKernel.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Core/ActionTrace.cs \
            unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputRouter.cs
          git diff --cached --check
          git commit -m 'Mirror semantic action objectives in World and Unity'
          git push origin HEAD:feature/action-semantic-objectives-v1
