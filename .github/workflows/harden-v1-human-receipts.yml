name: Harden exact v1 human receipt custody

on:
  pull_request:
    paths:
      - '.github/workflows/harden-v1-human-receipts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-exact-v1-human-receipt-custody
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind every automated receipt to the current exact estate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          estate_path = Path('scripts/local-estate/Invoke-RodohEstate.ps1')
          estate = estate_path.read_text()
          marker = '''    $verification = $receipts['verification.json']
              Assert-ReceiptValue 'Verification receipt World head' $verification.worldHead $estate.worldHead
              Assert-ReceiptValue 'Verification receipt Arc head' $verification.arcHead $estate.arcHead

              $builds = $receipts['builds.json']
          '''
          replacement = '''    $dependencies = $receipts['dependencies.json']
              Assert-ReceiptValue 'Dependency receipt World lock SHA-256' $dependencies.world.packageLockSha256 (Get-Sha256 (Join-Path $Script:WorldRoot 'package-lock.json'))
              Assert-ReceiptValue 'Dependency receipt Arc lock SHA-256' $dependencies.arc.packageLockSha256 (Get-Sha256 (Join-Path $Script:ArcRoot 'package-lock.json'))

              $verification = $receipts['verification.json']
              Assert-ReceiptValue 'Verification receipt World head' $verification.worldHead $estate.worldHead
              Assert-ReceiptValue 'Verification receipt Arc head' $verification.arcHead $estate.arcHead
              Assert-ReceiptValue 'Verification receipt estate lock SHA-256' $verification.lockSha256 (Get-Sha256 $Script:LockPath)
              Assert-ReceiptValue 'Verification receipt publication manifest SHA-256' $verification.publicationManifestSha256 (Get-Sha256 (Join-Parts $Script:WorldRoot 'estate' 'publication' 'PUBLICATION_MANIFEST.json'))

              $builds = $receipts['builds.json']
          '''
          if marker not in estate:
              raise SystemExit('verification receipt insertion marker not found')
          estate = estate.replace(marker, replacement, 1)

          marker = '''    Assert-ReceiptValue 'Build receipt World head' $builds.world.sourceHead $estate.worldHead
              Assert-ReceiptValue 'Build receipt Arc head' $builds.arc.sourceHead $estate.arcHead
              Assert-ReceiptValue 'Arc test receipt head' $receipts['tests-arc.json'].head $estate.arcHead
              Assert-ReceiptValue 'World test receipt head' $receipts['tests-world.json'].head $estate.worldHead
              Assert-ReceiptValue 'Browser test receipt head' $receipts['tests-browser.json'].head $estate.worldHead

              $snapshot = $receipts['snapshot.json']
          '''
          replacement = '''    Assert-ReceiptValue 'Build receipt World head' $builds.world.sourceHead $estate.worldHead
              Assert-ReceiptValue 'Build receipt Arc head' $builds.arc.sourceHead $estate.arcHead
              Assert-ReceiptValue 'World build SOURCE_DATE_EPOCH' $builds.world.sourceDateEpoch '0'
              Assert-ReceiptValue 'Arc build SOURCE_DATE_EPOCH' $builds.arc.sourceDateEpoch '0'
              Assert-ReceiptValue 'Arc test receipt head' $receipts['tests-arc.json'].head $estate.arcHead
              Assert-ReceiptValue 'World test receipt head' $receipts['tests-world.json'].head $estate.worldHead
              Assert-ReceiptValue 'Browser test receipt head' $receipts['tests-browser.json'].head $estate.worldHead
              Assert-ReceiptValue 'Browser test receipt mode' $receipts['tests-browser.json'].mode 'complete-desktop-mobile'

              $snapshot = $receipts['snapshot.json']
          '''
          if marker not in estate:
              raise SystemExit('build and browser receipt insertion marker not found')
          estate = estate.replace(marker, replacement, 1)

          marker = '''    Assert-ReceiptValue 'Snapshot receipt World head' $snapshot.worldHead $estate.worldHead
              Assert-ReceiptValue 'Snapshot receipt Arc head' $snapshot.arcHead $estate.arcHead
              if (-not (Test-Path -LiteralPath $snapshot.archive -PathType Leaf)) {
          '''
          replacement = '''    Assert-ReceiptValue 'Snapshot receipt World head' $snapshot.worldHead $estate.worldHead
              Assert-ReceiptValue 'Snapshot receipt Arc head' $snapshot.arcHead $estate.arcHead
              Assert-ReceiptValue 'Snapshot publication SHA-256' $snapshot.publicationSha256 ([string]$Script:Lock.publication.sha256)
              if (-not (Test-Path -LiteralPath $snapshot.archive -PathType Leaf)) {
          '''
          if marker not in estate:
              raise SystemExit('snapshot publication insertion marker not found')
          estate = estate.replace(marker, replacement, 1)
          estate_path.write_text(estate)

          test_path = Path('tests/world/local-estate-contract.test.ts')
          test = test_path.read_text()
          marker = '''    expect(powershell).toContain("Automated repository receipt World head");
              expect(powershell).toContain("Browser test receipt head");
              expect(powershell).toContain("Snapshot archive SHA-256");
          '''
          replacement = '''    expect(powershell).toContain("Automated repository receipt World head");
              expect(powershell).toContain("Dependency receipt World lock SHA-256");
              expect(powershell).toContain("Dependency receipt Arc lock SHA-256");
              expect(powershell).toContain("Verification receipt estate lock SHA-256");
              expect(powershell).toContain("Verification receipt publication manifest SHA-256");
              expect(powershell).toContain("World build SOURCE_DATE_EPOCH");
              expect(powershell).toContain("Arc build SOURCE_DATE_EPOCH");
              expect(powershell).toContain("Browser test receipt head");
              expect(powershell).toContain("Browser test receipt mode");
              expect(powershell).toContain("Snapshot publication SHA-256");
              expect(powershell).toContain("Snapshot archive SHA-256");
          '''
          if marker not in test:
              raise SystemExit('local estate stale-receipt test marker not found')
          test = test.replace(marker, replacement, 1)
          test_path.write_text(test)
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify complete stale-receipt refusal
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw 'scripts/local-estate/Invoke-RodohEstate.ps1')) | Out-Null"
          npm run typecheck
          npm test -- tests/world/local-estate-contract.test.ts tests/world/browser-support-performance.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish only permanent stale-receipt custody
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin release/world-v1-candidate
          test "$(git rev-parse origin/release/world-v1-candidate)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/local-estate/Invoke-RodohEstate.ps1 tests/world/local-estate-contract.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Refuse mixed-era automated receipts before v1 acceptance'
          git push origin HEAD:release/world-v1-candidate
