name: Unity action cross-language parity

on:
  pull_request:
    paths:
      - 'unity/Conformance/arc-vector.test.ts'
      - 'unity/Conformance/ArcParityProgram.cs'
      - 'unity/Conformance/Axm.Rodoh.Action.ArcParity.csproj'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Core/**'
      - 'unity/Fixtures/**'
      - '.github/workflows/unity-action-cross-language.yml'
  push:
    branches:
      - feature/action-runtime-v1
    paths:
      - 'unity/Conformance/arc-vector.test.ts'
      - 'unity/Conformance/ArcParityProgram.cs'
      - 'unity/Conformance/Axm.Rodoh.Action.ArcParity.csproj'
      - 'unity/Packages/com.axm.rodoh-action/Runtime/Core/**'
      - 'unity/Fixtures/**'
      - '.github/workflows/unity-action-cross-language.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-action-cross-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARC_ACTION_AUTHORITY_SHA: 6eef311836ee7cb3a43a94ce51f448a2699c3b04

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact World candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: axm-world
          fetch-depth: 0
          show-progress: false

      - name: Check out exact Arc action authority
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-arc
          ref: ${{ env.ARC_ACTION_AUTHORITY_SHA }}
          path: axm-arc
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: axm-arc/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install exact Arc dependencies
        run: npm --prefix axm-arc ci --no-audit --no-fund

      - name: Generate terminal vector with the pinned Arc kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          cp axm-world/unity/Conformance/arc-vector.test.ts axm-arc/tests/action/unity-vector.test.ts
          export AXM_UNITY_NATIVE_SPEC="$GITHUB_WORKSPACE/axm-world/unity/Fixtures/frog-pit.action-spec.json"
          export AXM_UNITY_PROJECTION="$GITHUB_WORKSPACE/axm-world/unity/Fixtures/frog-pit.unity-action-spec.json"
          export AXM_UNITY_VECTOR_OUT="$GITHUB_WORKSPACE/receipts/arc-vector.json"
          (
            cd axm-arc
            npx vitest run tests/action/unity-vector.test.ts --reporter=verbose
          ) 2>&1 | tee receipts/arc-vector.log
          test -s receipts/arc-vector.json

      - name: Require exact Csharp terminal-state parity
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --configuration Release \
            --project axm-world/unity/Conformance/Axm.Rodoh.Action.ArcParity.csproj \
            -- \
            receipts/arc-vector.json \
            receipts/arc-csharp-parity.json \
            2>&1 | tee receipts/arc-csharp-parity.log
          grep -q '"status": "pass"' receipts/arc-csharp-parity.json
          grep -q '"parity": true' receipts/arc-csharp-parity.json

      - name: Clean temporary Arc test and preserve source identity
        if: always()
        shell: bash
        run: |
          rm -f axm-arc/tests/action/unity-vector.test.ts
          test "$(git -C axm-arc rev-parse HEAD)" = "$ARC_ACTION_AUTHORITY_SHA"
          test -z "$(git -C axm-arc status --porcelain)"
          git -C axm-world diff --check

      - name: Upload cross-language evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-unity-action-cross-language
          path: receipts
          if-no-files-found: warn
          retention-days: 30
