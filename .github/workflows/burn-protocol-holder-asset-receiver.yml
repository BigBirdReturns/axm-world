name: Burn Protocol holder asset receiver

on:
  pull_request:
    paths:
      - '.github/workflows/burn-protocol-holder-asset-receiver.yml'
      - 'src/world/WorldHost.tsx'
      - 'src/world/external-assets.ts'
      - 'src/world/external-assets-context.tsx'
      - 'src/world/components/ExternalAssetDock.tsx'
      - 'tools/build-burn-protocol-holder-asset-fixture.mjs'
      - 'tests/world/burn-protocol-holder-assets.test.ts'
      - 'e2e/burn-protocol-holder-assets.spec.ts'
      - 'docs/BURN_PROTOCOL_HOLDER_ASSET_RECEIVER.md'
  push:
    branches: [probe/burn-protocol-holder-asset-receiver-v1]
    paths:
      - '.github/workflows/burn-protocol-holder-asset-receiver.yml'
      - 'src/world/WorldHost.tsx'
      - 'src/world/external-assets.ts'
      - 'src/world/external-assets-context.tsx'
      - 'src/world/components/ExternalAssetDock.tsx'
      - 'tools/build-burn-protocol-holder-asset-fixture.mjs'
      - 'tests/world/burn-protocol-holder-assets.test.ts'
      - 'e2e/burn-protocol-holder-assets.spec.ts'
      - 'docs/BURN_PROTOCOL_HOLDER_ASSET_RECEIVER.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-holder-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      PW_BASE_URL: http://127.0.0.1:5173
      BURN_PROTOCOL_ARC_REPOSITORY: BigBirdReturns/axm-arc
      BURN_PROTOCOL_ARC_HEAD: 9bcf2a1c65e75b7c414c0a74f73888cf2699be14
      BURN_PROTOCOL_EXPECTED_DIGEST: cart1_870f3dfcab909fc9aace115e2c46cd30268339f80bc87a14f0eebcc4e2c28c3e
      BURN_PROTOCOL_EXPECTED_PARENT: b3b299e14d8c22cde88629eb6bc4d197b8f8015eec7bf46b95f0de2a31b5f0df
    steps:
      - name: Check out World candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install World dependencies
        run: npm ci --no-audit --no-fund

      - name: Check out exact Arc activation authority
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BURN_PROTOCOL_ARC_REPOSITORY }}
          ref: ${{ env.BURN_PROTOCOL_ARC_HEAD }}
          path: upstream/axm-arc
          fetch-depth: 1
          show-progress: false

      - name: Install Arc dependencies
        working-directory: upstream/axm-arc
        run: npm ci --no-audit --no-fund

      - name: Build exact calibrated Arc publication
        run: |
          set -euo pipefail
          test "$(git -C upstream/axm-arc rev-parse HEAD)" = "$BURN_PROTOCOL_ARC_HEAD"
          output="$RUNNER_TEMP/burn-protocol-publication"
          mkdir -p "$output"
          (
            cd upstream/axm-arc
            npx vite-node tools/build-burn-protocol-disclosure-probe.ts "$output"
          ) | tee "$RUNNER_TEMP/publication.log"
          printf 'BURN_PROTOCOL_ARC_PATH=%s\n' "$output/burn-protocol-disclosure-probe.arc.json" >> "$GITHUB_ENV"
          printf 'BURN_PROTOCOL_SOURCE_PATH=%s\n' "$output/burn-protocol-disclosure-probe.ship.json" >> "$GITHUB_ENV"
          printf 'BURN_PROTOCOL_CORPUS_PATH=%s\n' "$output/burn-protocol-v0.58.0.corpus.json" >> "$GITHUB_ENV"
          printf 'BURN_PROTOCOL_PUBLICATION_RECEIPT_PATH=%s\n' "$output/publication-receipt.json" >> "$GITHUB_ENV"
          printf 'BURN_PROTOCOL_PUBLICATION_DIR=%s\n' "$output" >> "$GITHUB_ENV"

      - name: Verify publication through World's receiver contract
        run: npm test -- tests/world/burn-protocol-corpus-receiver.test.ts | tee "$RUNNER_TEMP/publication-contract.log"

      - name: Build deterministic holder-controlled evidence folders
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/burn-holder-assets"
          node tools/build-burn-protocol-holder-asset-fixture.mjs \
            --output "$root" \
            --production-contract upstream/axm-arc/docs/contracts/burn-protocol-handoff-publication.activation.json \
            --publication-receipt "$BURN_PROTOCOL_PUBLICATION_RECEIPT_PATH" \
            | tee "$RUNNER_TEMP/fixture.log"
          printf 'BURN_PROTOCOL_HOLDER_ASSET_FIXTURE_DIR=%s\n' "$root/valid" >> "$GITHUB_ENV"
          printf 'BURN_PROTOCOL_HOLDER_ASSET_TAMPER_DIR=%s\n' "$root/tampered-asset" >> "$GITHUB_ENV"
          printf 'BURN_PROTOCOL_HOLDER_ASSET_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: TypeScript
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused custody-chain and asset-byte tests
        run: npm test -- tests/world/burn-protocol-holder-assets.test.ts | tee "$RUNNER_TEMP/holder-assets-tests.log"

      - name: Production World build
        run: npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Prove fixture bytes are not bundled into World
        run: |
          set -euo pipefail
          if find docs/game -type f -name '*E12-C3-P01*' -print | grep -q .; then
            echo 'The holder fixture asset entered the production bundle.' >&2
            exit 1
          fi
          if grep -R -F 'MECHANISM FIXTURE · EXTERNAL CUSTODY' docs/game >/dev/null; then
            echo 'The holder fixture image bytes entered the production bundle.' >&2
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile holder-asset journey
        run: |
          set -euo pipefail
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npx playwright test e2e/burn-protocol-holder-assets.spec.ts | tee "$RUNNER_TEMP/browser.log"

      - name: Retain holder-asset qualification
        if: always()
        run: |
          set -euo pipefail
          evidence=burn-protocol-holder-asset-receiver-qualification
          mkdir -p "$evidence"
          for log in publication publication-contract fixture typecheck holder-assets-tests build browser; do
            cp "$RUNNER_TEMP/$log.log" "$evidence/" 2>/dev/null || true
          done
          cp "$BURN_PROTOCOL_HOLDER_ASSET_ROOT/fixture-set.json" "$evidence/" 2>/dev/null || true
          cp "$BURN_PROTOCOL_HOLDER_ASSET_FIXTURE_DIR"/*.json "$evidence/" 2>/dev/null || true
          mkdir -p "$evidence/assets"
          cp "$BURN_PROTOCOL_HOLDER_ASSET_FIXTURE_DIR"/assets/* "$evidence/assets/" 2>/dev/null || true
          cp "$BURN_PROTOCOL_PUBLICATION_RECEIPT_PATH" "$evidence/" 2>/dev/null || true
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$evidence/world-candidate-sha.txt"
          printf '%s\n' "$BURN_PROTOCOL_ARC_HEAD" > "$evidence/arc-activation-authority-sha.txt"
          (cd "$evidence" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload holder-asset qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-holder-asset-receiver-qualification
          path: |
            burn-protocol-holder-asset-receiver-qualification
            test-results
          if-no-files-found: error
          retention-days: 30
