name: Converge UNDERDRAIN Unity 6000 player train

on:
  pull_request:
    paths:
      - '.github/workflows/converge-underdrain-unity6000-player-train.yml'
  push:
    branches:
      - feature/underdrain-unity6000-player-train-v1
    paths:
      - '.github/workflows/converge-underdrain-unity6000-player-train.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: converge-underdrain-unity6000-player-train-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/underdrain-unity6000-player-train-v1
          fetch-depth: 0
          show-progress: false

      - name: Apply and publish the bounded source repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value, before, after):
              path = Path(path_value)
              text = path.read_text(encoding='utf-8')
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {before!r}')
              path.write_text(text.replace(before, after), encoding='utf-8', newline='\n')

          replace_once(
              'unity/Packages/com.axm.rodoh-action/Editor/ActionPlayerProductBatch.cs',
              '        private sealed class AssetRequirement\n',
              '        private class AssetRequirement\n',
          )
          replace_once(
              'unity/Packages/com.axm.rodoh-action/Editor/ActionPlayerProductBatch.cs',
              '                    if (!bindingByKit.TryAdd(binding.kit, binding)) throw new InvalidOperationException("Serialized production presentation contains duplicate enemy kit " + binding.kit + ".");\n',
              '                    if (bindingByKit.ContainsKey(binding.kit)) throw new InvalidOperationException("Serialized production presentation contains duplicate enemy kit " + binding.kit + ".");\n'
              '                    bindingByKit.Add(binding.kit, binding);\n',
          )
          replace_once(
              'unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionInputBindings.cs',
              '                + Short(interactPrimary) + " work   F10 rebind";\n',
              '                + Short(interactPrimary) + " work";\n',
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/converge-underdrain-unity6000-player-train.yml
          git add -A
          git diff --cached --check
          git commit -m 'Harden the UNDERDRAIN Unity 6000 player-product source plane'
          git push origin HEAD:feature/underdrain-unity6000-player-train-v1
