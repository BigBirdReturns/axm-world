name: Asset release custody

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain)"
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Derive obligations and record actual candidate production coverage
        run: |
          set -euo pipefail
          mkdir -p asset-release-receipt
          node scripts/assets/scaffold-authored-pilot-representation.mjs \
            --authoring demos/underdrain-draft/authoring.json \
            --presentation demos/underdrain-draft/presentation.json \
            --production demos/underdrain-draft/production.json \
            --namespace underdrain \
            --repository BigBirdReturns/axm-world \
            --authored-identity underdrain-continuous-pilot-v2 \
            --experience-id underdrain-continuous-pilot-v2 \
            --people marta-sump,morrowcap,mrs-kett,dax-venn \
            --state-ids town-water-pressure,kett-water,fungus-contact,crown-grievance,rhea-status,evidence-custody,root-gate-open \
            | tee asset-release-receipt/representation-scaffold-check.json
          cat > asset-release-receipt/underdrain-release-boundary.json <<JSON
          {
            "format": "rodoh-underdrain-asset-release-boundary/1",
            "status": "representation-rework",
            "declaredRepresentationRoles": 48,
            "productionRoles": 1,
            "prototypeRoles": 47,
            "productionCoverageComplete": false,
            "releaseRepresentationGate": "fail-closed-mixed-coverage",
            "machineQualifiedAuthoredPilot": false
          }
          JSON
      - name: Deterministic v1 inventory and candidate refusal contracts
        run: |
          set -euo pipefail
          node scripts/assets/build-release-asset-inventory.mjs \
            --root "$PWD" \
            --rollups src/assets/rollups/rodoh-v1-programs.json \
            --descriptions src/assets/descriptions/rodoh-v1-dense-assets.json \
            --output docs/release/RODOH_ASSET_INVENTORY.json \
            --check
          npm run typecheck
          npm test -- \
            tests/world/asset-release-custody.test.ts \
            tests/world/asset-release-workflow.test.ts \
            tests/world/authored-pilot-representation-discovery.test.ts \
            tests/world/authored-pilot-representation-scaffold.test.ts \
            tests/world/representation-completeness.test.ts \
            tests/world/playable-product-completeness.test.ts \
            tests/world/underdrain-presentation-completeness.test.ts \
            tests/world/asset-standard.test.ts \
            tests/world/production-asset-wave-one.test.ts \
            tests/world/lamp-district-assets.test.ts \
            tests/world/relief-circuit-production-assets.test.ts
      - name: Complete product and static performance acceptance
        run: |
          set -euo pipefail
          npm test
          npm run build
          mkdir -p asset-release-receipt
          node scripts/performance/audit-static-build.mjs \
            --build docs/game \
            --budgets docs/performance/RODOH_PERFORMANCE_BUDGETS.json \
            --output asset-release-receipt/static-performance.json
          cp docs/release/RODOH_ASSET_INVENTORY.json asset-release-receipt/asset-inventory.json
          cp demos/underdrain-draft/presentation.json asset-release-receipt/underdrain-role-plan.json
          cp demos/underdrain-draft/production.json asset-release-receipt/underdrain-production-coverage.json
          cp -a demos/underdrain-draft/assets/production asset-release-receipt/underdrain-production-source
          cp demos/underdrain-draft/assets/provenance.json asset-release-receipt/underdrain-provenance.json
          cp demos/underdrain-draft/assets/underdrain-art.js asset-release-receipt/underdrain-prototype-role-renderer.js
          cp docs/design/UNDERDRAIN_ASSET_BIBLE.md asset-release-receipt/UNDERDRAIN_ASSET_BIBLE.md
          cp docs/design/UNDERDRAIN_REPRESENTATION_FAILURE_ANALYSIS.md asset-release-receipt/UNDERDRAIN_REPRESENTATION_FAILURE_ANALYSIS.md
          cp scripts/assets/scaffold-authored-pilot-representation.mjs asset-release-receipt/scaffold-authored-pilot-representation.mjs
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > asset-release-receipt/world-candidate-sha.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Complete desktop and mobile browser product
        env:
          PW_CHROMIUM_PATH: ${{ runner.temp }}/pw-chromium-placeholder
        run: |
          set -euo pipefail
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npx playwright test 2>&1 | tee asset-release-receipt/complete-browser.log
      - name: Retain represented browser and geometry evidence
        if: always()
        run: |
          set -euo pipefail
          if [[ -d test-results ]]; then
            rm -rf asset-release-receipt/playwright-test-results
            cp -a test-results asset-release-receipt/playwright-test-results
          fi
          if [[ -d playwright-report ]]; then
            rm -rf asset-release-receipt/playwright-report
            cp -a playwright-report asset-release-receipt/playwright-report
          fi
      - name: Preserve clean source tree
        if: always()
        run: |
          set -euo pipefail
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game test-results playwright-report local/playwright-underdrain
          git diff --check
      - name: Upload asset release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-asset-release-custody
          path: asset-release-receipt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
