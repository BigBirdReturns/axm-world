<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>UNDERDRAIN: The Bloom Below</title>
<style>
:root{
  --ink:#f6f1df;--muted:#bbb5a4;--deep:#08100c;--paper:#121914;--panel:#1a241d;--panel2:#222f26;
  --mint:#8ce5b8;--spore:#c1f078;--brass:#e6bd63;--rust:#dd7d56;--danger:#ff7878;--blue:#8ac7d9;
  --line:rgba(246,241,223,.15);--soft:rgba(140,229,184,.11);--shadow:0 24px 70px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 15% -5%,rgba(140,229,184,.11),transparent 34rem),
  radial-gradient(circle at 100% 15%,rgba(230,189,99,.08),transparent 30rem),
  var(--deep);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.48}
.app{width:min(1260px,100%);min-height:100vh;padding:14px 14px 72px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(12,18,14,.92);backdrop-filter:blur(14px);position:sticky;top:8px;z-index:30;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.brandmark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;border:1px solid rgba(230,189,99,.5);background:linear-gradient(145deg,rgba(140,229,184,.16),rgba(230,189,99,.13));font-family:ui-monospace,monospace;font-weight:900;color:var(--brass)}
.brand h1{font-size:clamp(18px,2.5vw,29px);line-height:1;margin:2px 0 0;letter-spacing:-.035em}.eyebrow,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.075em;text-transform:uppercase}.eyebrow{font-size:10px;color:var(--mint)}
.statusline{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.status{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:11px;color:var(--muted);background:#101712}.status.live{color:var(--mint);border-color:rgba(140,229,184,.35)}.status.accepted{color:var(--brass);border-color:rgba(230,189,99,.45)}
main{padding-top:14px}.view{display:none}.view.active{display:block}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(31,43,35,.97),rgba(17,24,19,.97));box-shadow:var(--shadow);padding:clamp(18px,3vw,30px)}
.cold-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);gap:14px}.cold-title{font-size:clamp(38px,7vw,82px);letter-spacing:-.06em;line-height:.88;margin:10px 0 20px;max-width:10ch}.lead{font-size:clamp(16px,2vw,20px);line-height:1.55;color:#e4ddc9;max-width:62ch}.plain-goal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0}.plain-goal div{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(0,0,0,.13)}.plain-goal b{display:block;font-size:12px;color:var(--brass);margin-bottom:5px}.plain-goal span{font-size:13px;line-height:1.4;color:#ddd6c5}
.primary,.secondary,.choice,.navbutton{border-radius:13px;border:1px solid var(--line);padding:12px 16px;background:#172019;color:var(--ink);font-weight:750}.primary{background:linear-gradient(135deg,var(--mint),#4bb780);color:#07110b;border:0}.primary:hover,.primary:focus-visible{filter:brightness(1.08)}.secondary:hover,.choice:hover,.navbutton:hover{border-color:var(--mint)}.big-primary{font-size:17px;padding:15px 20px}.buttonrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hint{color:var(--muted);font-size:12px;line-height:1.5}
.call-sheet{display:grid;gap:10px}.person{border:1px solid var(--line);border-radius:15px;padding:13px;background:rgba(0,0,0,.12)}.person-head{display:flex;justify-content:space-between;gap:10px}.person b{color:var(--ink)}.method{font:11px ui-monospace,monospace;color:var(--mint)}.person p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.action-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.stage{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;min-height:540px;background:#07100b;box-shadow:var(--shadow)}canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#07100b}.hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;align-items:flex-start;gap:9px;pointer-events:none}.hudbox{background:rgba(7,14,10,.86);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(8px);font-size:12px}.hudbox strong{display:block}.meter{width:min(210px,26vw);height:8px;border-radius:99px;background:#313630;overflow:hidden;margin-top:5px}.meter i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--danger),var(--mint))}.objective-ribbon{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(700px,calc(100% - 28px));background:rgba(7,14,10,.9);border:1px solid rgba(140,229,184,.36);border-radius:15px;padding:10px 14px;text-align:center;pointer-events:none}.objective-ribbon b{display:block;font-size:14px}.objective-ribbon span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.recovery-panel{position:absolute;inset:0;z-index:22;background:rgba(4,8,6,.86);display:grid;place-items:center;padding:20px}.recovery-panel .card{width:min(620px,100%);border-color:rgba(255,120,120,.5)}
.side{display:flex;flex-direction:column;gap:12px}.story-thread{min-height:232px;max-height:300px;overflow:auto}.story-thread p{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}.story-thread p:last-child{border-bottom:0}.speaker{color:var(--brass);font-family:ui-monospace,monospace;font-size:11px}.reveal{border-left:3px solid var(--spore);padding-left:10px!important;color:#edf6d8}.route-note{border-left:3px solid var(--blue);padding-left:10px!important}.objective-list{margin:8px 0 0;padding-left:20px}.objective-list li{padding:5px 0;color:var(--muted);font-size:13px}.objective-list li.current{color:var(--ink);font-weight:700}.objective-list li.done{color:var(--mint);text-decoration:line-through}
.touch{display:none;position:absolute;inset:auto 10px 76px;justify-content:space-between;pointer-events:none}.touch-dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:5px;pointer-events:auto}.touch button{touch-action:none;border:1px solid rgba(246,241,223,.28);background:rgba(7,14,10,.82);border-radius:15px;color:var(--ink);font-size:18px}.touch .up{grid-column:2}.touch .left{grid-column:1}.touch .down{grid-column:2}.touch .right{grid-column:3}.touch-actions{display:flex;gap:8px;align-items:end;pointer-events:auto}.touch-actions button{width:68px;height:68px;border-radius:50%;font-size:12px;font-weight:850}.touch-actions .work{border-color:var(--mint);color:var(--mint)}
.draft-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px}.dialogue{display:grid;gap:10px}.line{border:1px solid var(--line);border-radius:15px;padding:13px;background:rgba(0,0,0,.12)}.line b{color:var(--brass)}.line p{margin:5px 0 0;color:#ded7c7;line-height:1.45}.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{text-align:left;min-height:180px}.choice[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 2px rgba(230,189,99,.14) inset}.choice b{display:block;font-size:15px;margin:7px 0}.choice span{display:block;color:var(--muted);font-size:12px;line-height:1.45}.route-delta{margin-top:10px;color:var(--blue)!important}
.consequence-grid{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:14px}.outcome{font-size:clamp(34px,5vw,62px);line-height:.95;letter-spacing:-.04em;margin:7px 0 15px}.world-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.world-cell{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(0,0,0,.13)}.world-cell b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.world-cell strong{font-size:18px}.delta-up{color:var(--mint)}.delta-down{color:var(--rust)}.accepted-box{border:1px solid rgba(230,189,99,.45);background:rgba(230,189,99,.08);border-radius:15px;padding:13px;margin:14px 0}.accepted-box b{color:var(--brass)}
.root-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:14px}.compact-choice{display:block;width:100%;text-align:left;margin-top:9px}.compact-choice b{display:block}.compact-choice span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.record-grid{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:14px}pre{white-space:pre-wrap;word-break:break-word;background:#08100b;border:1px solid var(--line);border-radius:14px;padding:14px;color:#dcebdc;max-height:580px;overflow:auto;font-size:11px}.record-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.nav-drawer{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.navbutton{font-size:12px;padding:8px 11px}.navbutton[hidden]{display:none}.autotest{display:none}.fatal{border:1px solid var(--danger);background:rgba(255,120,120,.1);padding:14px;border-radius:15px;color:#ffd5d5}
@media(max-width:960px){.cold-grid,.draft-grid,.action-grid,.consequence-grid,.root-grid,.record-grid{grid-template-columns:1fr}.choice-grid,.plain-goal,.world-grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.stage{min-height:420px}.touch{display:flex}.objective-ribbon{bottom:150px}}
@media(max-width:620px){.app{padding:8px 8px 54px}.topline{position:relative;top:0;align-items:flex-start}.statusline{display:none}.cold-title{font-size:48px}.side{grid-template-columns:1fr}.stage{min-height:390px}.hud{flex-wrap:wrap}.objective-ribbon{bottom:148px}.touch-dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}.touch-actions button{width:62px;height:62px}.card{padding:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
</style>
</head>
<body>
