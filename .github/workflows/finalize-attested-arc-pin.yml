name: Finalize exact attested Arc custody pin

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-attested-arc-pin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-exact-attested-arc-custody-pin
  cancel-in-progress: true

env:
  OLD_ARC_SHA: ec997705131e517fc8b4be6325453c4e14ae815a
  ARC_SHA: 318faaab6fb1c4b0eefe66516d3573bdb8f97369
  CI: 'true'
  SOURCE_DATE_EPOCH: '0'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/pin-restored-arc-v1-main
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derive the exact four non-workflow files
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          test ! -e PLACEHOLDER
          if grep -q "$ARC_SHA" estate/estate.lock.json; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          old = os.environ['OLD_ARC_SHA']
          new = os.environ['ARC_SHA']
          expected = {
              Path('estate/estate.lock.json'): 1,
              Path('tests/world/local-estate-contract.test.ts'): 1,
              Path('tests/world/browser-support-performance.test.ts'): 2,
              Path('docs/SUPPLY_CHAIN_CUSTODY.md'): 1,
          }
          for path, required in expected.items():
              text = path.read_text()
              count = text.count(old)
              if count != required:
                  raise SystemExit(f'{path}: expected {required} occurrences of {old}, found {count}')
              updated = text.replace(old, new)
              if old in updated or updated.count(new) < required:
                  raise SystemExit(f'{path}: exact replacement did not complete')
              path.write_text(updated)
          PY
          cat > "$RUNNER_TEMP/EXPECTED_SHA256SUMS" <<'SUMS'
          31b586c92085bd75d923762ebd7f1e98cd62e1a8a5fe375c5545904e7f7f97f5  estate/estate.lock.json
          7fa8199f8f2741a0812891640d53f265d3b40862f4e994c9734e3e44fe6834de  docs/SUPPLY_CHAIN_CUSTODY.md
          cae806540fee3d8b4aef2ea8d43f4e1c400a1c572090d6fda4bca7b3c03bdd12  tests/world/local-estate-contract.test.ts
          dc7e6e7c5868ff37a5535f6b8faeb301ca5259beba7fc0f54351bf6ac39fac10  tests/world/browser-support-performance.test.ts
          SUMS
          sha256sum -c "$RUNNER_TEMP/EXPECTED_SHA256SUMS"
          git diff --check
          echo 'required=true' >> "$GITHUB_OUTPUT"
          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
      - name: Install exact dependencies
        if: steps.derive.outputs.required == 'true'
        run: npm ci --no-audit --no-fund
      - name: Qualify the exact attested-Arc product
        if: steps.derive.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/local-estate-contract.test.ts tests/world/browser-support-performance.test.ts tests/world/supply-chain.test.ts tests/world/holder-estate.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish only the four qualified non-workflow files
        if: steps.derive.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ steps.derive.outputs.source_head }}'
          git fetch --no-tags origin release/pin-restored-arc-v1-main
          test "$(git rev-parse origin/release/pin-restored-arc-v1-main)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estate/estate.lock.json docs/SUPPLY_CHAIN_CUSTODY.md tests/world/local-estate-contract.test.ts tests/world/browser-support-performance.test.ts
          expected="$(printf '%s\n' docs/SUPPLY_CHAIN_CUSTODY.md estate/estate.lock.json tests/world/browser-support-performance.test.ts tests/world/local-estate-contract.test.ts)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Pin World v1 custody to attested Arc main'
          git push origin HEAD:release/pin-restored-arc-v1-main
      - name: Confirm already-published custody
        if: steps.derive.outputs.required != 'true'
        run: test "$(node -p 'JSON.parse(require("fs").readFileSync("estate/estate.lock.json", "utf8")).repositories.arc.requiredCommit')" = "$ARC_SHA"
