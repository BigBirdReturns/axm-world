name: Harden exact v1 human receipt custody

on:
  pull_request:
    paths:
      - '.github/workflows/harden-v1-human-receipts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-exact-v1-human-receipt-custody
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate complete receipt contracts before clearing blockers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          status_path = Path('scripts/estate/generate-current-status.mjs')
          status = status_path.read_text()
          old = '''function receipt(path, expectedFormat) {
            const value = optionalJson(resolve(estateRoot, path));
            return {
              path,
              present: value !== null,
              valid: !!value && !value.invalid && value.format === expectedFormat && value.status === "pass",
              format: value && !value.invalid ? value.format ?? null : null,
              worldCommit: value && !value.invalid ? value.worldCommit ?? value.worldHead ?? value.world?.head ?? null : null,
              arcCommit: value && !value.invalid ? value.arcCommit ?? value.arcHead ?? value.arc?.head ?? null : null,
              operatingSystem: value && !value.invalid ? value.operatingSystem ?? null : null,
              edgeVersion: value && !value.invalid ? value.edgeVersion ?? null : null,
              nvdaVersion: value && !value.invalid ? value.nvdaVersion ?? null : null,
              nodeVersion: value && !value.invalid ? value.nodeVersion ?? value.node ?? null : null,
              npmVersion: value && !value.invalid ? value.npmVersion ?? value.npm ?? null : null,
              playwrightVersion: value && !value.invalid ? value.playwrightVersion ?? null : null,
            };
          }
          '''
          new = '''const COMMIT_PATTERN = /^[0-9a-f]{40}$/;
          const SHA256_PATTERN = /^[0-9a-f]{64}$/;
          const OPERATOR_CHECKS = [
            "arcOpens",
            "worldOpens",
            "bundledPlay",
            "cleanRoomImport",
            "portableRunRoundtrip",
            "publicationLibrary",
            "snapshotRecovery",
          ];
          const NVDA_CHECKS = [
            "shelfAndIdentity",
            "keyboardEntry",
            "viewSwitcher",
            "contractAndParty",
            "decisionAndConsequence",
            "encounterAndRecord",
            "runExportRestore",
            "holderEstate",
            "forcedColorsAndMotion",
            "semanticRedundancy",
          ];
          const WINDOWS_CHECKS = [
            "doctor",
            "hydrate",
            "vendored-plane",
            "double-build",
            "arc-suite",
            "world-suite",
            "gate6",
            "gate7",
            "complete-playwright",
            "static-health",
          ];

          function nonEmptyString(value) {
            return typeof value === "string" && value.trim().length > 0;
          }
          function allChecksTrue(value, required) {
            return !!value && typeof value === "object" && required.every((key) => value[key] === true);
          }
          function includesChecks(value, required) {
            return Array.isArray(value) && required.every((check) => value.includes(check));
          }
          function receiptCommits(value) {
            return {
              worldCommit: value?.worldCommit ?? value?.worldHead ?? value?.world?.head ?? null,
              arcCommit: value?.arcCommit ?? value?.arcHead ?? value?.arc?.head ?? null,
            };
          }
          function receiptContractValid(value, expectedFormat) {
            if (!value || value.invalid || value.format !== expectedFormat || value.status !== "pass") return false;
            const { worldCommit: receiptWorld, arcCommit: receiptArc } = receiptCommits(value);
            if (!COMMIT_PATTERN.test(receiptWorld ?? "") || !COMMIT_PATTERN.test(receiptArc ?? "")) return false;

            if (expectedFormat === "rodoh-windows-replication-receipt/1") {
              return nonEmptyString(value.generatedAt) &&
                nonEmptyString(value.node) &&
                nonEmptyString(value.npm) &&
                nonEmptyString(value.operatingSystem) &&
                includesChecks(value.checks, WINDOWS_CHECKS);
            }
            if (expectedFormat === "rodoh-local-operator-acceptance/1") {
              return nonEmptyString(value.acceptedAt) &&
                value.releaseTarget === lock.releaseTarget &&
                SHA256_PATTERN.test(value.machineFingerprintSha256 ?? "") &&
                value.worldPackageVersion === pkg.version &&
                value.arcPackageVersion === arcPackageVersion &&
                value.publicationSha256 === lock.publication.sha256 &&
                nonEmptyString(value.snapshot?.archive) &&
                SHA256_PATTERN.test(value.snapshot?.archiveSha256 ?? "") &&
                SHA256_PATTERN.test(value.snapshot?.manifestSha256 ?? "") &&
                allChecksTrue(value.checks, OPERATOR_CHECKS);
            }
            if (expectedFormat === "rodoh-nvda-edge-acceptance/1") {
              return nonEmptyString(value.acceptedAt) &&
                SHA256_PATTERN.test(value.machineFingerprintSha256 ?? "") &&
                nonEmptyString(value.operatingSystem) &&
                nonEmptyString(value.edgeVersion) &&
                nonEmptyString(value.nvdaVersion) &&
                nonEmptyString(value.nodeVersion) &&
                nonEmptyString(value.npmVersion) &&
                nonEmptyString(value.playwrightVersion) &&
                allChecksTrue(value.checks, NVDA_CHECKS);
            }
            return false;
          }
          function receipt(path, expectedFormat) {
            const value = optionalJson(resolve(estateRoot, path));
            const commits = value && !value.invalid ? receiptCommits(value) : { worldCommit: null, arcCommit: null };
            return {
              path,
              present: value !== null,
              valid: receiptContractValid(value, expectedFormat),
              format: value && !value.invalid ? value.format ?? null : null,
              worldCommit: commits.worldCommit,
              arcCommit: commits.arcCommit,
              operatingSystem: value && !value.invalid ? value.operatingSystem ?? null : null,
              edgeVersion: value && !value.invalid ? value.edgeVersion ?? null : null,
              nvdaVersion: value && !value.invalid ? value.nvdaVersion ?? null : null,
              nodeVersion: value && !value.invalid ? value.nodeVersion ?? value.node ?? null : null,
              npmVersion: value && !value.invalid ? value.npmVersion ?? value.npm ?? null : null,
              playwrightVersion: value && !value.invalid ? value.playwrightVersion ?? null : null,
            };
          }
          '''
          if old not in status:
              raise SystemExit('generic receipt validator block not found')
          status = status.replace(old, new, 1)
          status_path.write_text(status)

          test_path = Path('tests/world/browser-support-performance.test.ts')
          test = test_path.read_text()
          start = test.index('  it("refuses every valid-looking acceptance receipt that names a different repository pair"')
          end = test.index('\n  });\n});', start) + len('\n  });')
          replacement = '''  it("refuses every fully valid acceptance receipt that names a different repository pair", () => {
            const estateRoot = mkdtempSync(join(tmpdir(), "rodoh-status-"));
            const receipts = resolve(estateRoot, ".rodoh-estate/receipts");
            const wrongWorld = "0".repeat(40);
            const wrongArc = "1".repeat(40);
            const hash = "a".repeat(64);
            writeReceipt(resolve(receipts, "windows-replication.json"), {
              format: "rodoh-windows-replication-receipt/1",
              generatedAt: new Date().toISOString(),
              status: "pass",
              worldHead: wrongWorld,
              arcHead: wrongArc,
              node: "v22.0.0",
              npm: "10.0.0",
              operatingSystem: "Windows 11",
              checks: ["doctor", "hydrate", "vendored-plane", "double-build", "arc-suite", "world-suite", "gate6", "gate7", "complete-playwright", "static-health"],
            });
            writeReceipt(resolve(receipts, "local-operator-acceptance.json"), {
              format: "rodoh-local-operator-acceptance/1",
              acceptedAt: new Date().toISOString(),
              status: "pass",
              releaseTarget: "RODOH v1.0.0",
              machineFingerprintSha256: hash,
              worldPackageVersion: "1.0.0",
              arcPackageVersion: "1.0.0",
              world: { head: wrongWorld, branch: "main" },
              arc: { head: wrongArc, branch: "main" },
              snapshot: { archive: "rodoh-estate.zip", archiveSha256: hash, manifestSha256: hash },
              publicationSha256: "4c969b20bda7eacd062077a71da2c552aa4c6521abaaef186d01b0c13468822a",
              checks: {
                arcOpens: true,
                worldOpens: true,
                bundledPlay: true,
                cleanRoomImport: true,
                portableRunRoundtrip: true,
                publicationLibrary: true,
                snapshotRecovery: true,
              },
            });
            writeReceipt(resolve(receipts, "nvda-edge-acceptance.json"), {
              format: "rodoh-nvda-edge-acceptance/1",
              acceptedAt: new Date().toISOString(),
              status: "pass",
              machineFingerprintSha256: hash,
              operatingSystem: "Windows 11",
              edgeVersion: "150.0.0",
              nvdaVersion: "2026.1",
              nodeVersion: "v22.0.0",
              npmVersion: "10.0.0",
              playwrightVersion: "1.49.0",
              worldCommit: wrongWorld,
              arcCommit: wrongArc,
              checks: {
                shelfAndIdentity: true,
                keyboardEntry: true,
                viewSwitcher: true,
                contractAndParty: true,
                decisionAndConsequence: true,
                encounterAndRecord: true,
                runExportRestore: true,
                holderEstate: true,
                forcedColorsAndMotion: true,
                semanticRedundancy: true,
              },
            });

            const output = resolve(receipts, "status.json");
            const markdown = resolve(receipts, "status.md");
            const result = runNode(STATUS_GENERATOR, [
              "--repo", ROOT,
              "--estate-root", estateRoot,
              "--output-json", output,
              "--output-markdown", markdown,
            ]);
            expect(result.status, result.stderr || result.stdout).toBe(0);
            const status = JSON.parse(readFileSync(output, "utf8"));
            expect(status.localEvidence.windowsReplication.valid).toBe(true);
            expect(status.localEvidence.localOperator.valid).toBe(true);
            expect(status.localEvidence.nvdaEdge.valid).toBe(true);
            expect(status.release.ready).toBe(false);
            expect(status.release.blockers).toEqual(expect.arrayContaining([
              expect.stringMatching(/^Local operator receipt names World /),
              expect.stringMatching(/^Local operator receipt names Arc /),
              expect.stringMatching(/^Windows replication receipt names World /),
              expect.stringMatching(/^Windows replication receipt names Arc /),
              expect.stringMatching(/^NVDA and Edge receipt names World /),
              expect.stringMatching(/^NVDA and Edge receipt names Arc /),
            ]));
            expect(status.release.blockers).not.toEqual(expect.arrayContaining([
              expect.stringMatching(/^Vendored Arc product authority /),
              "One or more required estate capabilities are not present in this checkout.",
            ]));
            expect(status.capabilities).toMatchObject({
              boundedJsonImports: true,
              cart1Canonicalization: true,
            });
            expect(status.release).toMatchObject({
              packageVersion: "1.0.0",
              arcPackageVersion: "1.0.0",
            });
            expect(status.repositories.arc).toMatchObject({
              vendoredCommit: "4b07539a06d40b131591f1e9c7d5b90a96ceec31",
              productAuthorityCommit: "4b07539a06d40b131591f1e9c7d5b90a96ceec31",
              releaseEvidenceCommit: "7b576898f7a82409669a97187bcd836296a77e24",
            });
            expect(status.repositories.world.commit).toBe(git("rev-parse", "HEAD"));
          });

          it("rejects structurally incomplete pass receipts even when their commits are exact", () => {
            const estateRoot = mkdtempSync(join(tmpdir(), "rodoh-status-incomplete-"));
            const receipts = resolve(estateRoot, ".rodoh-estate/receipts");
            const exactWorld = git("rev-parse", "HEAD");
            const exactArc = "7b576898f7a82409669a97187bcd836296a77e24";
            writeReceipt(resolve(receipts, "windows-replication.json"), {
              format: "rodoh-windows-replication-receipt/1",
              status: "pass",
              worldHead: exactWorld,
              arcHead: exactArc,
            });
            writeReceipt(resolve(receipts, "local-operator-acceptance.json"), {
              format: "rodoh-local-operator-acceptance/1",
              status: "pass",
              worldCommit: exactWorld,
              arcCommit: exactArc,
            });
            writeReceipt(resolve(receipts, "nvda-edge-acceptance.json"), {
              format: "rodoh-nvda-edge-acceptance/1",
              status: "pass",
              worldCommit: exactWorld,
              arcCommit: exactArc,
            });

            const output = resolve(receipts, "status.json");
            const result = runNode(STATUS_GENERATOR, [
              "--repo", ROOT,
              "--estate-root", estateRoot,
              "--output-json", output,
              "--output-markdown", resolve(receipts, "status.md"),
            ]);
            expect(result.status, result.stderr || result.stdout).toBe(0);
            const status = JSON.parse(readFileSync(output, "utf8"));
            expect(status.localEvidence.windowsReplication.valid).toBe(false);
            expect(status.localEvidence.localOperator.valid).toBe(false);
            expect(status.localEvidence.nvdaEdge.valid).toBe(false);
            expect(status.release.blockers).toEqual(expect.arrayContaining([
              "Windows replication receipt is absent or invalid.",
              "Local operator acceptance receipt is absent or invalid.",
              "NVDA and Edge acceptance receipt is absent or invalid.",
            ]));
          });'''
          test = test[:start] + replacement + test[end:]
          test_path.write_text(test)
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify complete receipt validation
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/browser-support-performance.test.ts tests/world/local-estate-contract.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish only permanent receipt validation
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin release/world-v1-candidate
          test "$(git rev-parse origin/release/world-v1-candidate)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/estate/generate-current-status.mjs tests/world/browser-support-performance.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Validate complete v1 receipt contracts before release readiness'
          git push origin HEAD:release/world-v1-candidate
