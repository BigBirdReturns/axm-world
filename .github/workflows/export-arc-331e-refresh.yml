name: Export Arc 331e custody refresh

on:
  pull_request:
    paths:
      - '.github/workflows/export-arc-331e-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-arc-331e-custody-refresh
  cancel-in-progress: true

env:
  ARC_RELEASE_SHA: 331e9693d3210a1b66de0c5ee3931645bfcbc053
  ARC_PRODUCT_AUTHORITY: 4b07539a06d40b131591f1e9c7d5b90a96ceec31

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Materialize exact coordinated custody files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          release = '331e9693d3210a1b66de0c5ee3931645bfcbc053'
          product = '4b07539a06d40b131591f1e9c7d5b90a96ceec31'

          lock_path = Path('estate/estate.lock.json')
          lock = json.loads(lock_path.read_text())
          arc = lock['repositories']['arc']
          if arc.get('requiredAncestor') != product or arc.get('productAuthorityCommit') != product:
              raise SystemExit('Arc product authority moved unexpectedly')
          arc['requiredCommit'] = release
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          workflow_path = Path('.github/workflows/local-estate-replication.yml')
          workflow, count = re.subn(
              r'(?m)^(\s*ARC_LOCAL_ESTATE_REF:)\s*[0-9a-f]{40}\s*$',
              rf'\1 {release}',
              workflow_path.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one ARC_LOCAL_ESTATE_REF, found {count}')
          workflow_path.write_text(workflow)

          test_path = Path('tests/world/local-estate-contract.test.ts')
          test, count = re.subn(
              r'requiredCommit:\s*"[0-9a-f]{40}"',
              f'requiredCommit: "{release}"',
              test_path.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one Arc requiredCommit assertion, found {count}')
          test_path.write_text(test)

          doc_path = Path('docs/SUPPLY_CHAIN_CUSTODY.md')
          doc, count = re.subn(
              r'Arc release-evidence head `[0-9a-f]{40}`',
              f'Arc release-evidence head `{release}`',
              doc_path.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one Arc release-evidence statement, found {count}')
          doc_path.write_text(doc)
          PY
          git diff --check
          mkdir -p "$RUNNER_TEMP/arc-331e-refresh/.github/workflows" "$RUNNER_TEMP/arc-331e-refresh/estate" "$RUNNER_TEMP/arc-331e-refresh/tests/world" "$RUNNER_TEMP/arc-331e-refresh/docs"
          cp .github/workflows/local-estate-replication.yml "$RUNNER_TEMP/arc-331e-refresh/.github/workflows/"
          cp estate/estate.lock.json "$RUNNER_TEMP/arc-331e-refresh/estate/"
          cp tests/world/local-estate-contract.test.ts "$RUNNER_TEMP/arc-331e-refresh/tests/world/"
          cp docs/SUPPLY_CHAIN_CUSTODY.md "$RUNNER_TEMP/arc-331e-refresh/docs/"
      - uses: actions/upload-artifact@v4
        with:
          name: arc-331e-refresh-files
          path: ${{ runner.temp }}/arc-331e-refresh
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
