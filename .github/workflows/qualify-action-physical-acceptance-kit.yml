name: Qualify action physical acceptance kit

on:
  pull_request:
    paths:
      - 'tools/action-physical-acceptance/**'
      - 'tests/world/action-physical-acceptance-kit.test.ts'
      - '.github/workflows/qualify-action-physical-acceptance-kit.yml'
  push:
    branches:
      - qualify/action-runtime-physical-acceptance-kit-v1
    paths:
      - 'tools/action-physical-acceptance/**'
      - 'tests/world/action-physical-acceptance-kit.test.ts'
      - '.github/workflows/qualify-action-physical-acceptance-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-physical-acceptance-kit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_CANDIDATE: 52162c757f905aae5c2383f6896de3b258e7cf8f
  ARC_ACTION_AUTHORITY: 6eef311836ee7cb3a43a94ce51f448a2699c3b04
  EMBODIED_CUSTODY_DONOR: 69b7f9a7bad5b4a94210313ca267a9b479402f09
  GENESIS_KERNEL: 9074e7fb2e9cedde692b248cdd0c6a805e77d8ac

jobs:
  kit:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record exact carrier and bounded diff
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Expected $expected, checked out $actual." }
          if (git status --porcelain) { throw 'Kit carrier checkout is dirty.' }
          git fetch origin qualify/action-runtime-closure-v1 --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the frozen closure base.' }
          $changed = @(git diff --name-only origin/qualify/action-runtime-closure-v1...HEAD)
          $allowed = @(
            '.github/workflows/qualify-action-physical-acceptance-kit.yml',
            'tests/world/action-physical-acceptance-kit.test.ts',
            'tools/action-physical-acceptance/Invoke-RodohActionPhysicalAcceptance.ps1',
            'tools/action-physical-acceptance/README.md'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            throw "Physical kit diff is not bounded. Unexpected: $($unexpected -join ', '); missing: $($missing -join ', ')"
          }
          if ((git rev-parse origin/qualify/action-runtime-closure-v1).Trim() -ne $env:WORLD_CANDIDATE) {
            throw 'The physical kit no longer points at the exact qualified World closure.'
          }

      - run: npm ci --no-audit --no-fund

      - name: Parse the Windows PowerShell acceptance driver
        shell: pwsh
        run: |
          $script = Resolve-Path 'tools/action-physical-acceptance/Invoke-RodohActionPhysicalAcceptance.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          $records = @($errors | ForEach-Object {
            [ordered]@{
              message = $_.Message
              startLine = $_.Extent.StartLineNumber
              startColumn = $_.Extent.StartColumnNumber
              text = $_.Extent.Text
              errorId = $_.ErrorId
            }
          })
          $receipt = [ordered]@{
            format = 'rodoh-action-physical-acceptance-kit-parse/1'
            status = if ($records.Count -eq 0) { 'pass' } else { 'fail' }
            carrier = (git rev-parse HEAD).Trim()
            powershell = $PSVersionTable.PSVersion.ToString()
            errors = $records
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\physical-kit" | Out-Null
          $receipt | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\physical-kit\powershell-parse.json"
          if ($records.Count -gt 0) {
            $receipt | ConvertTo-Json -Depth 10 | Write-Error
            throw 'Physical acceptance driver contains PowerShell parse errors.'
          }

      - name: Run the authority and phase contracts
        shell: pwsh
        run: |
          npm test -- tests/world/action-physical-acceptance-kit.test.ts *>&1 | Tee-Object "$env:RUNNER_TEMP\physical-kit\focused.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck *>&1 | Tee-Object "$env:RUNNER_TEMP\physical-kit\typecheck.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if (git status --porcelain) { throw 'Kit carrier changed during qualification.' }

      - name: Package the exact offline acceptance kit
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\physical-kit\rodoh-action-physical-acceptance-kit"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item 'tools/action-physical-acceptance/Invoke-RodohActionPhysicalAcceptance.ps1' $root
          Copy-Item 'tools/action-physical-acceptance/README.md' $root
          $manifest = [ordered]@{
            format = 'rodoh-action-physical-acceptance-kit/1'
            status = 'pass'
            carrier = (git rev-parse HEAD).Trim()
            worldCandidate = $env:WORLD_CANDIDATE
            arcActionAuthority = $env:ARC_ACTION_AUTHORITY
            embodiedCustodyDonor = $env:EMBODIED_CUSTODY_DONOR
            genesisKernel = $env:GENESIS_KERNEL
            unityVersion = '6000.0.66f2'
            files = @('Invoke-RodohActionPhysicalAcceptance.ps1', 'README.md')
            authority = 'External acceptance orchestration only; frozen World and Arc snapshots remain product and action authority'
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 (Join-Path $root 'MANIFEST.json')
          Push-Location $root
          try {
            Get-ChildItem -File | Sort-Object Name | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
            } | Set-Content -Encoding ascii 'SHA256SUMS'
          } finally {
            Pop-Location
          }
          $archive = "$env:RUNNER_TEMP\physical-kit\rodoh-action-physical-acceptance-kit.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rodoh-action-physical-acceptance-kit
          path: |
            ${{ runner.temp }}/physical-kit/rodoh-action-physical-acceptance-kit.zip
            ${{ runner.temp }}/physical-kit/rodoh-action-physical-acceptance-kit.zip.sha256
            ${{ runner.temp }}/physical-kit/powershell-parse.json
            ${{ runner.temp }}/physical-kit/focused.log
            ${{ runner.temp }}/physical-kit/typecheck.log
          if-no-files-found: warn
          retention-days: 30
