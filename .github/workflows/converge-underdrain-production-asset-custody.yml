name: Converge UNDERDRAIN production asset custody

on:
  push:
    branches:
      - feature/underdrain-unity6000-player-train-v1
    paths:
      - '.github/workflows/converge-underdrain-production-asset-custody.yml'
  pull_request:
    paths:
      - '.github/workflows/converge-underdrain-production-asset-custody.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: converge-underdrain-production-asset-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/underdrain-unity6000-player-train-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind imported-source custody into the exact product train
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value, before, after):
              path = Path(path_value)
              text = path.read_text(encoding='utf-8')
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {before!r}')
              path.write_text(text.replace(before, after), encoding='utf-8', newline='\n')

          replace_once(
              'unity/Packages/com.axm.rodoh-action/Editor/ActionPlayerProductBatch.cs',
              '''            var visualPaths = VisualSourcePaths(prefab, forbiddenRoots);
            if (visualPaths.Count == 0) throw new InvalidOperationException("Production prefab has no imported mesh or sprite source: " + path);
''',
              '''            var sourceSha256 = ActionProductionAssetDigest.Compute(prefab, forbiddenRoots, out var visualPaths);
            if (marker.SourceSha256 != sourceSha256) throw new InvalidOperationException("Production asset source digest differs from its current imported visual sources: " + path + ".");
''',
          )
          replace_once(
              'unity/Packages/com.axm.rodoh-action/Editor/ActionPlayerProductBatch.cs',
              '                prefabSha256 = Sha256File(Path.GetFullPath(path)),\n                sourceSha256 = marker.SourceSha256,\n',
              '                prefabSha256 = Sha256File(ActionProductionAssetDigest.ProjectFilePath(path)),\n                sourceSha256 = sourceSha256,\n',
          )

          replace_once(
              'scripts/run-underdrain-unity6000-player-train.ps1',
              '''$estateScript = Join-Path $worldRoot "scripts\run-unity-action-estate-v3.ps1"
$qualifierScript = Join-Path $worldRoot "scripts\qualify-unity-action-player-product.ps1"
$buildScript = Join-Path $worldRoot "scripts\build-unity-action-player.ps1"
foreach ($script in @($estateScript, $qualifierScript, $buildScript)) { if (-not (Test-Path $script)) { throw "Required UNDERDRAIN player-train script is absent: $script" } }

Invoke-CheckedPowerShell $estateScript @{
''',
              '''$intakeScript = Join-Path $worldRoot "scripts\prepare-underdrain-production-assets.ps1"
$estateScript = Join-Path $worldRoot "scripts\run-unity-action-estate-v3.ps1"
$qualifierScript = Join-Path $worldRoot "scripts\qualify-unity-action-player-product.ps1"
$buildScript = Join-Path $worldRoot "scripts\build-unity-action-player.ps1"
foreach ($script in @($intakeScript, $estateScript, $qualifierScript, $buildScript)) { if (-not (Test-Path $script)) { throw "Required UNDERDRAIN player-train script is absent: $script" } }

$intakeRoot = Join-Path $trainRoot "production-assets"
Invoke-CheckedPowerShell $intakeScript @{
    EmbodiedArLabRoot = $projectRoot
    PresentationManifest = $effectivePresentationPath
    ProductProfile = $profilePath
    OutputRoot = $intakeRoot
    UnityVersion = $UnityVersion
    UnityEditor = $unityPath
    ForceCloseUnity = $ForceCloseUnity
} "Admitting real UNDERDRAIN prefabs through imported-source custody..."
$intakeRunPath = Join-Path $intakeRoot "production-asset-intake-run.json"
if (-not (Test-Path $intakeRunPath)) { throw "UNDERDRAIN production-asset intake receipt is absent: $intakeRunPath" }

Invoke-CheckedPowerShell $estateScript @{
''',
          )
          replace_once(
              'scripts/run-underdrain-unity6000-player-train.ps1',
              '''$productRun = Get-Content $productRunPath -Raw | ConvertFrom-Json
if ($estateRun.status -ne "pass" -or $productRun.status -ne "pass" -or $productRun.buildEligible -ne $true) { throw "UNDERDRAIN Unity player train contains a failing estate or product receipt." }
''',
              '''$productRun = Get-Content $productRunPath -Raw | ConvertFrom-Json
$intakeRun = Get-Content $intakeRunPath -Raw | ConvertFrom-Json
if ($intakeRun.status -ne "pass" -or $intakeRun.assetCount -ne 7 -or $intakeRun.generatedPrimitive -ne $false -or $intakeRun.activePhysicsAuthority -ne $false) { throw "UNDERDRAIN production-asset intake did not pass." }
if ($estateRun.status -ne "pass" -or $productRun.status -ne "pass" -or $productRun.buildEligible -ne $true) { throw "UNDERDRAIN Unity player train contains a failing estate or product receipt." }
''',
          )
          replace_once(
              'scripts/run-underdrain-unity6000-player-train.ps1',
              '    format = "rodoh-underdrain-unity6000-player-train/1"\n',
              '    format = "rodoh-underdrain-unity6000-player-train/2"\n',
          )
          replace_once(
              'scripts/run-underdrain-unity6000-player-train.ps1',
              '''    productionAssetIds = $productRun.productionAssetIds
    primitiveFallback = $false
''',
              '''    productionAssetIds = $productRun.productionAssetIds
    productionAssetIntake = $intakeRunPath
    productionSourceDigests = $intakeRun.sourceDigests
    primitiveFallback = $false
''',
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/converge-underdrain-production-asset-custody.yml
          git add -A
          git diff --cached --check
          git commit -m 'Bind UNDERDRAIN production prefabs to imported-source custody'
          git push origin HEAD:feature/underdrain-unity6000-player-train-v1
