name: UNDERDRAIN authored pilot

on:
  pull_request:
    paths:
      - '.github/workflows/underdrain-standalone-demo.yml'
      - '.github/workflows/asset-release-custody.yml'
      - 'demos/underdrain-draft/**'
      - 'docs/design/AUTHORED_PILOT_REPRESENTATION_RUNBOOK.md'
      - 'docs/design/UNDERDRAIN_ASSET_BIBLE.md'
      - 'docs/design/UNDERDRAIN_REPRESENTATION_FAILURE_ANALYSIS.md'
      - 'docs/schemas/rodoh-representation-plan-v1.schema.json'
      - 'scripts/assets/scaffold-authored-pilot-representation.mjs'
      - 'scripts/demos/build-underdrain-arc-capsule.mjs'
      - 'scripts/demos/build-underdrain-draft.mjs'
      - 'scripts/demos/verify-underdrain-draft.mjs'
      - 'src/world/acceptance/representation-completeness.ts'
      - 'src/world/acceptance/playable-product.ts'
      - 'tests/world/authored-pilot-representation-discovery.test.ts'
      - 'tests/world/authored-pilot-representation-scaffold.test.ts'
      - 'tests/world/representation-completeness.test.ts'
      - 'tests/world/playable-product-completeness.test.ts'
      - 'tests/world/underdrain-presentation-completeness.test.ts'
      - 'tests/world/underdrain-draft-standalone.test.ts'
      - 'e2e/underdrain-draft.spec.ts'
      - 'e2e/underdrain-mobile-layout.spec.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  SOURCE_DATE_EPOCH: '0'
  ARC_UNDERDRAIN_SHA: ea16757fe9df65405b322af13d95351896f43157
  PILOT_BRANCH: demo/underdrain-authored-pilot-v2

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact World candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: axm-world
          fetch-depth: 0
          show-progress: false

      - name: Check out exact Arc authority
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-arc
          ref: ${{ env.ARC_UNDERDRAIN_SHA }}
          path: axm-arc
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            axm-world/package-lock.json
            axm-arc/package-lock.json

      - name: Prepare retained evidence surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/underdrain-pilot"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > "$RUNNER_TEMP/underdrain-pilot/world-requested.txt"
          printf '%s\n' "$ARC_UNDERDRAIN_SHA" > "$RUNNER_TEMP/underdrain-pilot/arc-requested.txt"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix axm-world ci --no-audit --no-fund
          npm --prefix axm-arc ci --no-audit --no-fund

      - name: Prove exact checkout identities
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          world_head="$(git -C axm-world rev-parse HEAD)"
          arc_head="$(git -C axm-arc rev-parse HEAD)"
          test "$world_head" = "$source_head"
          test "$arc_head" = "$ARC_UNDERDRAIN_SHA"
          cat > "$RUNNER_TEMP/underdrain-pilot/source-identities.json" <<JSON
          {
            "format": "rodoh-underdrain-source-identities/1",
            "status": "pass",
            "worldCommit": "$world_head",
            "arcCommit": "$arc_head"
          }
          JSON

      - name: Verify Arc seal and focused authority
        shell: bash
        run: |
          set -euo pipefail
          (
            cd axm-arc/examples/underdrain-draft
            sha256sum -c SHA256SUMS
          ) | tee "$RUNNER_TEMP/underdrain-pilot/arc-seal.log"
          npm --prefix axm-arc run typecheck \
            | tee "$RUNNER_TEMP/underdrain-pilot/arc-typecheck.log"
          npm --prefix axm-arc test -- \
            tests/demos/underdrain-root-gate.test.ts \
            tests/demos/underdrain-draft.test.ts \
            | tee "$RUNNER_TEMP/underdrain-pilot/arc-focused-tests.log"

      - name: Materialize exact Arc source custody
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          cp \
            axm-arc/examples/underdrain-draft/authoring.json \
            axm-world/demos/underdrain-draft/authoring.json
          node axm-world/scripts/demos/build-underdrain-arc-capsule.mjs \
            --arc-root axm-arc \
            --arc-commit "$ARC_UNDERDRAIN_SHA" \
            --authoring axm-world/demos/underdrain-draft/authoring.json \
            --output axm-world/demos/underdrain-draft/source/arc-capsule.js \
            | tee "$RUNNER_TEMP/underdrain-pilot/arc-capsule-build.json"
          rm -f \
            axm-world/demos/underdrain-draft/source/authoring-block.html \
            axm-world/demos/underdrain-draft/PLAYTEST.md \
            axm-world/demos/underdrain-draft/playtest.json
          git -C axm-world diff --check
          git -C axm-world add -A -- demos/underdrain-draft
          git -C axm-world diff --cached --stat \
            | tee "$RUNNER_TEMP/underdrain-pilot/materialized-source.stat"
          if git -C axm-world diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish exact Arc source custody
        id: publish
        if: steps.materialize.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          if [[ '${{ github.event_name }}' != 'pull_request' \
            || '${{ github.event.pull_request.head.repo.full_name }}' != '${{ github.repository }}' \
            || '${{ github.event.pull_request.head.ref }}' != "$PILOT_BRANCH" ]]; then
            echo 'Exact Arc sources differ, but this event is not authorized to publish the pilot branch.' >&2
            exit 1
          fi
          git -C axm-world fetch --no-tags origin "$PILOT_BRANCH"
          test "$(git -C axm-world rev-parse "origin/$PILOT_BRANCH")" = "$source_head"
          git -C axm-world config user.name 'github-actions[bot]'
          git -C axm-world config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C axm-world diff --cached --check
          git -C axm-world commit -m 'Materialize exact Arc Underdrain v2 authority'
          published_head="$(git -C axm-world rev-parse HEAD)"
          git -C axm-world push origin "HEAD:$PILOT_BRANCH"
          echo "published_head=$published_head" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/underdrain-pilot/publication-handoff.json" <<JSON
          {
            "format": "rodoh-underdrain-source-publication/1",
            "status": "published",
            "sourceWorldCommit": "$source_head",
            "publishedWorldCommit": "$published_head",
            "arcCommit": "$ARC_UNDERDRAIN_SHA",
            "branch": "$PILOT_BRANCH",
            "qualification": "qualified-in-current-run"
          }
          JSON

      - name: Derive and check exact representation obligations
        shell: bash
        run: |
          set -euo pipefail
          node axm-world/scripts/assets/scaffold-authored-pilot-representation.mjs \
            --authoring axm-world/demos/underdrain-draft/authoring.json \
            --presentation axm-world/demos/underdrain-draft/presentation.json \
            --namespace underdrain \
            --repository BigBirdReturns/axm-world \
            --authored-identity underdrain-continuous-pilot-v2 \
            --experience-id underdrain-continuous-pilot-v2 \
            --people marta-sump,morrowcap,mrs-kett,dax-venn \
            --state-ids town-water-pressure,kett-water,fungus-contact,crown-grievance,rhea-status,evidence-custody,root-gate-open \
            | tee "$RUNNER_TEMP/underdrain-pilot/representation-scaffold-check.json"

      - name: Build and verify the exact represented standalone
        id: standalone
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git -C axm-world rev-parse HEAD)"
          authoring_sha="$(sha256sum axm-world/demos/underdrain-draft/authoring.json | awk '{print $1}')"
          presentation_sha="$(sha256sum axm-world/demos/underdrain-draft/presentation.json | awk '{print $1}')"
          cmp \
            axm-arc/examples/underdrain-draft/authoring.json \
            axm-world/demos/underdrain-draft/authoring.json
          mkdir -p axm-world/local/underdrain-draft
          node axm-world/scripts/demos/build-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --output axm-world/local/underdrain-draft/index.html \
            --hash-output "$RUNNER_TEMP/underdrain-pilot/INDEX_SHA256SUMS" \
            --world-commit "$source_head" \
            | tee "$RUNNER_TEMP/underdrain-pilot/build.json"
          node axm-world/scripts/demos/verify-underdrain-draft.mjs \
            --root axm-world/demos/underdrain-draft \
            --html axm-world/local/underdrain-draft/index.html \
            --world-commit "$source_head" \
            --arc-commit "$ARC_UNDERDRAIN_SHA" \
            --authoring-sha256 "$authoring_sha" \
            --presentation-sha256 "$presentation_sha" \
            --output "$RUNNER_TEMP/underdrain-pilot/static-verification.json" \
            | tee "$RUNNER_TEMP/underdrain-pilot/static-verification.log"
          echo "authoring_sha=$authoring_sha" >> "$GITHUB_OUTPUT"
          echo "presentation_sha=$presentation_sha" >> "$GITHUB_OUTPUT"
          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"

      - name: Qualify authored law, representation, and the complete product
        working-directory: axm-world
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- \
            tests/world/underdrain-draft-standalone.test.ts \
            tests/world/representation-completeness.test.ts \
            tests/world/playable-product-completeness.test.ts \
            tests/world/authored-pilot-representation-discovery.test.ts \
            tests/world/authored-pilot-representation-scaffold.test.ts \
            tests/world/underdrain-presentation-completeness.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game

      - name: Install Chromium
        working-directory: axm-world
        run: npx playwright install --with-deps chromium

      - name: Cold-walk desktop and mobile through the represented product
        working-directory: axm-world
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test \
            e2e/underdrain-draft.spec.ts \
            e2e/underdrain-mobile-layout.spec.ts \
            --project=desktop \
            --project=mobile \
            2>&1 | tee "$RUNNER_TEMP/underdrain-pilot/playwright.log"

      - name: Retain browser evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/underdrain-pilot"
          if [[ -d axm-world/test-results ]]; then
            rm -rf "$root/playwright-test-results"
            cp -a axm-world/test-results "$root/playwright-test-results"
          fi
          if [[ -d axm-world/playwright-report ]]; then
            rm -rf "$root/playwright-report"
            cp -a axm-world/playwright-report "$root/playwright-report"
          fi

      - name: Assemble retained represented authored-pilot receipt
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/underdrain-pilot"
          cp axm-world/local/underdrain-draft/index.html "$root/"
          cp axm-world/demos/underdrain-draft/authoring.json "$root/"
          cp axm-world/demos/underdrain-draft/presentation.json "$root/"
          cp axm-world/demos/underdrain-draft/assets/provenance.json "$root/representation-provenance.json"
          cp axm-world/demos/underdrain-draft/assets/underdrain-art.js "$root/underdrain-art.js"
          cp axm-world/demos/underdrain-draft/source/arc-capsule.js "$root/"
          cp axm-world/demos/underdrain-draft/README.md "$root/"
          cp axm-world/docs/design/AUTHORED_PILOT_REPRESENTATION_RUNBOOK.md "$root/"
          cp axm-world/docs/design/UNDERDRAIN_ASSET_BIBLE.md "$root/"
          cp axm-world/docs/design/UNDERDRAIN_REPRESENTATION_FAILURE_ANALYSIS.md "$root/"
          cp axm-world/scripts/assets/scaffold-authored-pilot-representation.mjs "$root/"
          printf '%s\n' '${{ steps.standalone.outputs.source_head }}' > "$root/world-candidate.txt"
          printf '%s\n' "$ARC_UNDERDRAIN_SHA" > "$root/arc-candidate.txt"
          printf '%s\n' '${{ steps.standalone.outputs.authoring_sha }}' > "$root/authoring-sha256.txt"
          printf '%s\n' '${{ steps.standalone.outputs.presentation_sha }}' > "$root/presentation-sha256.txt"
          cat > "$root/acceptance-boundary.json" <<JSON
          {
            "format": "rodoh-underdrain-authored-pilot-acceptance/3",
            "status": "machine-qualified-authored-pilot",
            "worldCommit": "${{ steps.standalone.outputs.source_head }}",
            "arcCommit": "$ARC_UNDERDRAIN_SHA",
            "authoringSha256": "${{ steps.standalone.outputs.authoring_sha }}",
            "presentation": {
              "format": "rodoh-representation-plan/1",
              "planId": "underdrain-white-label-v1",
              "sha256": "${{ steps.standalone.outputs.presentation_sha }}",
              "derivedObligationsGate": "pass",
              "actionRenderer": "cartridge-assets",
              "neutralFallbackUsed": false,
              "automatedGate": "pass",
              "mobileControlGeometry": "pass"
            },
            "authoredStructureGate": "pass",
            "automatedProductGate": "pass",
            "blindPlayerReceipt": {
              "status": "not-issued-by-runtime",
              "requiredForFinalAuthoredEpisodeClaim": true
            }
          }
          JSON
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          rm -rf axm-world/local/underdrain-draft
          git -C axm-world diff --check
          test -z "$(git -C axm-world status --porcelain --untracked-files=all)"
          git -C axm-arc diff --check
          test -z "$(git -C axm-arc status --porcelain --untracked-files=all)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: underdrain-authored-pilot
          path: ${{ runner.temp }}/underdrain-pilot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
