name: Converge action semantic cue receiver

on:
  pull_request:
    paths:
      - '.github/workflows/converge-action-semantic-cue-receiver.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: converge-action-semantic-cue-receiver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/action-semantic-cue-receiver-v1
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply the bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/converge-action-semantic-cue-receiver.py')
          text = path.read_text(encoding='utf-8')
          before = """        (
                      '  const difficultyModeId = candidate.difficultyModeId ?? null;\\n',
                      '  const difficultyModeId = candidate.difficultyModeId ?? null;\\n'
                      '  const timingProfileId = candidate.timingProfileId ?? null;\\n',
                      1,
                  ),
          """
          after = """        (
                      'function findAuthority(spec: any, candidate: any): { arc: Arc; challenge: Challenge } {\\n'
                      '  const difficultyModeId = candidate.difficultyModeId ?? null;\\n',
                      'function findAuthority(spec: any, candidate: any): { arc: Arc; challenge: Challenge } {\\n'
                      '  const difficultyModeId = candidate.difficultyModeId ?? null;\\n'
                      '  const timingProfileId = candidate.timingProfileId ?? null;\\n',
                      1,
                  ),
          """
          if text.count(before) != 1:
              raise SystemExit(f'expected one ambiguous Arc timing-profile replacement, found {text.count(before)}')
          path.write_text(text.replace(before, after), encoding='utf-8', newline='\n')
          PY
          python scripts/converge-action-semantic-cue-receiver.py
          python - <<'PY'
          from pathlib import Path

          path = Path('unity/Packages/com.axm.rodoh-action/Runtime/Unity/ActionRuntimeBehaviour.cs')
          text = path.read_text(encoding='utf-8')
          needle = '            return ActionBridgeJson.SerializeCandidate(candidate, true);\n'
          replacement = (
              '            if (candidate.authority != "Arc replay required")\n'
              '            {\n'
              '                throw new InvalidOperationException("Action execution candidate lost provisional Arc replay authority.");\n'
              '            }\n'
              + needle
          )
          if text.count(needle) != 1:
              raise SystemExit(f'expected one candidate serialization boundary, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement), encoding='utf-8', newline='\n')
          PY
          python -m py_compile scripts/converge-action-semantic-cue-receiver.py
          git diff --check

      - name: Compile the patched source contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- tests/world/action-semantic-cue-receiver.test.ts
          dotnet build unity/Conformance/Axm.Rodoh.Action.Cues.csproj --configuration Release
          find unity/Conformance -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +

      - name: Publish the bounded receiver implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/converge-action-semantic-cue-receiver.py
          git add -A
          git diff --cached --check
          git commit -m 'Consume exact Arc semantic cues through the production player adapter'
          git push origin HEAD:feature/action-semantic-cue-receiver-v1

# The workflow remains until the published receiver implementation is independently qualified.
