name: Refresh Arc signed-evidence head for asset candidate

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-arc-release-evidence-head.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-asset-candidate-arc-evidence-head
  cancel-in-progress: true

env:
  ARC_RELEASE_SHA: eb3fd7f53fd72641814cb3939648790e64e9adcf
  ARC_PRODUCT_AUTHORITY: 4b07539a06d40b131591f1e9c7d5b90a96ceec31
  CI: 'true'

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind asset custody to the carrier-free Arc attestation head
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          release = 'eb3fd7f53fd72641814cb3939648790e64e9adcf'
          product = '4b07539a06d40b131591f1e9c7d5b90a96ceec31'
          lock_path = Path('estate/estate.lock.json')
          lock = json.loads(lock_path.read_text())
          arc = lock['repositories']['arc']
          if arc.get('requiredAncestor') != product or arc.get('productAuthorityCommit') != product:
              raise SystemExit('Arc product authority moved unexpectedly')
          arc['requiredCommit'] = release
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          workflow_path = Path('.github/workflows/local-estate-replication.yml')
          workflow, count = re.subn(r'(?m)^(\s*ARC_LOCAL_ESTATE_REF:)\s*[0-9a-f]{40}\s*$', rf'\1 {release}', workflow_path.read_text(), count=1)
          if count != 1: raise SystemExit(f'expected one ARC_LOCAL_ESTATE_REF, found {count}')
          workflow_path.write_text(workflow)
          test_path = Path('tests/world/local-estate-contract.test.ts')
          test, count = re.subn(r'requiredCommit:\s*"[0-9a-f]{40}"', f'requiredCommit: "{release}"', test_path.read_text(), count=1)
          if count != 1: raise SystemExit(f'expected one Arc requiredCommit assertion, found {count}')
          test_path.write_text(test)
          doc_path = Path('docs/SUPPLY_CHAIN_CUSTODY.md')
          doc, count = re.subn(r'Arc release-evidence head `[0-9a-f]{40}`', f'Arc release-evidence head `{release}`', doc_path.read_text(), count=1)
          if count != 1: raise SystemExit(f'expected one Arc release-evidence statement, found {count}')
          doc_path.write_text(doc)
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify exact asset custody
        run: |
          set -euo pipefail
          node scripts/assets/build-release-asset-inventory.mjs --root "$PWD" --rollups src/assets/rollups/rodoh-v1-programs.json --descriptions src/assets/descriptions/rodoh-v1-dense-assets.json --output docs/release/RODOH_ASSET_INVENTORY.json --check
          npm run typecheck
          npm test -- tests/world/local-estate-contract.test.ts tests/world/supply-chain.test.ts tests/world/browser-support-performance.test.ts tests/world/asset-release-custody.test.ts tests/world/asset-release-workflow.test.ts tests/world/holder-estate.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then git restore --source=HEAD --staged --worktree -- docs/game; fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish the qualified asset refresh
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin qualify/asset-custody-assembled-v1
          test "$(git rev-parse origin/qualify/asset-custody-assembled-v1)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estate/estate.lock.json .github/workflows/local-estate-replication.yml tests/world/local-estate-contract.test.ts docs/SUPPLY_CHAIN_CUSTODY.md
          git diff --cached --check
          git commit -m 'Pin asset custody to Arc signed-evidence main'
          git push origin HEAD:qualify/asset-custody-assembled-v1
