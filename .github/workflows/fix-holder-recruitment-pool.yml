name: Fix holder-estate recruitment-pool custody

on:
  pull_request:
    paths:
      - '.github/workflows/fix-holder-recruitment-pool.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-holder-recruitment-pool
  cancel-in-progress: true

env:
  CI: 'true'
  PW_BASE_URL: http://127.0.0.1:5173

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind persisted recruitment candidates to the ordinary agent validator
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/world/holder-estate.ts')
          source = source_path.read_text()

          old_keys = '''    "id", "name", "reputation", "unlockedProgressionTiers", "resources", "infrastructure", "agents",
              "relationships", "precedents", "dramaQueue", "cycle", "distributionPolicy", "rngSeed", "cartridgeState",
          '''
          new_keys = '''    "id", "name", "reputation", "unlockedProgressionTiers", "resources", "infrastructure", "agents",
              "relationships", "precedents", "dramaQueue", "cycle", "distributionPolicy", "rngSeed", "cartridgeState",
              "recruitmentPool",
          '''
          if source.count(old_keys) != 1:
              raise SystemExit(f'organization allowlist anchor count: {source.count(old_keys)}')
          source = source.replace(old_keys, new_keys)

          old_agents = '''  const agents = plainObject(raw.agents, "organization.agents");
            for (const [agentId, value] of Object.entries(agents)) validateAgent(value, agentId);
            const agentIds = new Set(Object.keys(agents));

            const infrastructure = plainObject(raw.infrastructure, "organization.infrastructure");
          '''
          new_agents = '''  const agents = plainObject(raw.agents, "organization.agents");
            for (const [agentId, value] of Object.entries(agents)) validateAgent(value, agentId);
            const agentIds = new Set(Object.keys(agents));

            if (raw.recruitmentPool !== undefined) {
              if (!Array.isArray(raw.recruitmentPool)) throw new Error("organization.recruitmentPool must be an array");
              const candidateIds = new Set<string>();
              raw.recruitmentPool.forEach((candidate, index) => {
                const rawCandidate = plainObject(candidate, `organization.recruitmentPool[${index}]`);
                if (typeof rawCandidate.id !== "string" || rawCandidate.id.length === 0) {
                  throw new Error(`organization recruitment candidate ${index} has an invalid id`);
                }
                const candidateId = rawCandidate.id;
                if (agentIds.has(candidateId)) {
                  throw new Error(`organization recruitment candidate ${candidateId} overlaps an active agent`);
                }
                if (candidateIds.has(candidateId)) {
                  throw new Error(`organization recruitment pool duplicates candidate ${candidateId}`);
                }
                candidateIds.add(candidateId);
                validateAgent(candidate, candidateId);
              });
            }

            const infrastructure = plainObject(raw.infrastructure, "organization.infrastructure");
          '''
          if source.count(old_agents) != 1:
              raise SystemExit(f'organization agent-validation anchor count: {source.count(old_agents)}')
          source_path.write_text(source.replace(old_agents, new_agents))

          test_path = Path('tests/world/holder-estate.test.ts')
          tests = test_path.read_text()
          helper_anchor = '''function checkpointValue(arc: Arc = FIRST_CHARTER): string {
          '''
          helpers = '''function recruitmentCandidate(arc: Arc = FIRST_CHARTER) {
            const organization = foundOrganization(arc, { format: "axm-founding-input/1", seed: 424242 });
            const source = structuredClone(Object.values(organization.agents)[0]!);
            return { ...source, id: "candidate-001", name: "Candidate One" };
          }

          function runWithRecruitmentPool(candidates: unknown[], arc: Arc = FIRST_CHARTER): string {
            const run = JSON.parse(runValue(arc)) as { game: string };
            const game = JSON.parse(run.game) as { organization: Record<string, unknown> };
            game.organization.recruitmentPool = candidates;
            run.game = JSON.stringify(game);
            return JSON.stringify(run);
          }

          ''' + helper_anchor
          if tests.count(helper_anchor) != 1:
              raise SystemExit(f'recruitment helper anchor count: {tests.count(helper_anchor)}')
          tests = tests.replace(helper_anchor, helpers)

          test_anchor = '''  it("refuses a run whose inner engine save cannot resume", () => {
          '''
          additions = '''  it("accepts bounded recruitment candidates preserved by ordinary engine saves", () => {
            const values = completeStorage().snapshot();
            values[`${SAVE_KEY_PREFIX}${DIGEST}`] = runWithRecruitmentPool([recruitmentCandidate()]);
            const estate = buildHolderEstate(new MemoryStorage(values), { createdAt: "2026-07-25T00:00:00.000Z" });
            expect(parseHolderEstate(estate)).toEqual(estate);
          });

          it("refuses duplicate recruitment candidates", () => {
            const values = completeStorage().snapshot();
            const candidate = recruitmentCandidate();
            values[`${SAVE_KEY_PREFIX}${DIGEST}`] = runWithRecruitmentPool([candidate, structuredClone(candidate)]);
            const estate = buildHolderEstate(new MemoryStorage(values), { createdAt: "2026-07-25T00:00:00.000Z" });
            expect(() => parseHolderEstate(estate)).toThrow(/recruitment pool duplicates candidate/i);
          });

          it("refuses a recruitment candidate that overlaps an active agent", () => {
            const values = completeStorage().snapshot();
            const organization = foundOrganization(FIRST_CHARTER, { format: "axm-founding-input/1", seed: 424242 });
            const activeId = Object.keys(organization.agents)[0]!;
            const candidate = { ...recruitmentCandidate(), id: activeId };
            values[`${SAVE_KEY_PREFIX}${DIGEST}`] = runWithRecruitmentPool([candidate]);
            const estate = buildHolderEstate(new MemoryStorage(values), { createdAt: "2026-07-25T00:00:00.000Z" });
            expect(() => parseHolderEstate(estate)).toThrow(/overlaps an active agent/i);
          });

          ''' + test_anchor
          if tests.count(test_anchor) != 1:
              raise SystemExit(f'recruitment test anchor count: {tests.count(test_anchor)}')
          test_path.write_text(tests.replace(test_anchor, additions))
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify recruitment custody and the complete World product
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/world/holder-estate.test.ts tests/world/locale.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          npx playwright install --with-deps chromium
          export PW_CHROMIUM_PATH="$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          npx playwright test e2e/holder-estate.spec.ts
          git diff --check
      - name: Publish the workflow-neutral recruitment fix
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin release/holder-estate-v1
          test "$(git rev-parse origin/release/holder-estate-v1)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/holder-estate.ts tests/world/holder-estate.test.ts
          git rm .github/workflows/fix-holder-recruitment-pool.yml
          git diff --cached --check
          git commit -m 'Validate persisted recruitment candidates in holder estates'
          git push origin HEAD:release/holder-estate-v1
